<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cytostorm Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04050A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cytostorm">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-512.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* v3 layout: progress bar on top, the three-zone map in the middle, per-zone production cards and controls at the bottom.
   Deliberately single-theme: the art is fluorescence microscopy, glowing cells on black. */
:root {
  color-scheme: dark;
  --void: #04050A;
  --panel: #0A0D18;
  --panel2: #10152A;
  --line: #1E2540;
  --ink: #DDE6F5;
  --dim: #7A86A0;
  --cell: #3FE6FF;
  --germ: #FF3DCB;
  --gold: #FFD23F;
  --kill: #FF7A3D;
  --repair: #5CFFA1;
  --damage: #FF3B4E;
  --toxin: #B45CFF;
  --slime: #96C828;
  --display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--void); color: var(--ink); }
body { margin: 0; font: 14px/1.4 var(--display); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img.ico { width: 18px; height: 18px; flex: none; }

#app { height: 100%; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; padding-inline: 16px; box-sizing: border-box; }

/* HUD */
#hud { display: grid; gap: 4px; padding-block: 8px 2px; min-width: 0; }
.hudrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
#prog { position: absolute; z-index: 1; left: 0; top: 0; width: 22px; height: 100px; display: block; pointer-events: none; }
#clock { margin-right: auto; }
#clock { flex: none; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; color: var(--dim); min-width: 2.8em; text-align: right; }
.hbtn { flex: none; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font: 500 12px var(--mono); min-width: 34px; height: 30px; box-sizing: border-box; }
.hbtn img { width: 16px; height: 16px; }
#muteBtn { color: var(--ink, #E6E9F2); } #muteBtn .x { display: none; } #muteBtn.off { color: #6B7180; } #muteBtn.off .x { display: inline; } #muteBtn.off .wave { display: none; }
#ffBtn { min-width: 40px; font-variant-numeric: tabular-nums; }
#ffBtn.fast { border-color: var(--gold); color: var(--gold); }
/* Fatigue meter: fills as the body overworks; ticks at each tier */
.fatigue { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; color: var(--dim); min-width: 0; white-space: nowrap; }
#fTier { flex: none; font: 600 12px var(--display); color: #FF8FB1; }
#cellCount { font: 500 11px var(--mono); font-variant-numeric: tabular-nums; }
#cellCount { margin-left: auto; }
/* The fatigue heart sits left of the body output slider */
#heart { grid-row: 1 / span 3; width: 54px; height: 50px; align-self: center; }
.fatigue[data-tier="1"] #fTier { color: #FF9A4D; }
.fatigue[data-tier="2"] #fTier { color: var(--kill); }
.fatigue[data-tier="3"] #fTier { color: #C77DFF; }
.fatigue[data-tier="4"] #fTier { color: var(--damage); animation: pulse .35s ease-in-out infinite alternate; }
/* Organs: five mini organs with 4 pips each, by the fatigue label; tap for Organ status */
.fatigue { align-items: center; }
.bodybtn { flex: none; display: flex; gap: 3px; padding: 1px 4px 2px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
#cellCount { margin-left: auto; } #cellCount.cut { color: var(--damage); }
.bodybtn.over { border-color: var(--damage); box-shadow: 0 0 6px var(--damage); }
.bodybtn .org { display: grid; justify-items: center; gap: 1px; }
.bodybtn img { width: 19px; height: 14px; }
.bodybtn .s1 img { animation: pulse .3s ease-in-out infinite alternate; }
.bodybtn .hit img { filter: brightness(1.8); }
.pips { display: flex; gap: 1px; }
.pips i { width: 3px; height: 3px; border-radius: 1px; background: var(--line); }
.pips i.on { background: #7BE0A0; }
.pips i.part { background: #F2B33D; }
.s2 .pips i.on, .s3 .pips i.on { background: #F2B33D; }
.s1 .pips i.on, .s0 .pips i.on { background: #FF5A5A; }
.pips.big { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 4px; }
.pips.big i { width: 9px; height: 6px; }
.bodyview { display: grid; gap: 8px; }
.ocard { display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; align-items: start; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.ocard > img { grid-row: span 2; width: 52px; height: 39px; }
.ocard > ul, .ocard > div:not(.ometer) { grid-column: 2; }
.ocard b { font-size: 14px; }
.ocard .ost { font: 600 12px var(--mono); margin-left: 6px; }
.ocard.healthy .ost, .ocard.healthy .pips i.on { color: #7BE0A0; background-color: #7BE0A0; }
.ocard.strained .ost, .ocard.damaged .ost { color: #F2B33D; } .ocard.strained .pips i.on, .ocard.damaged .pips i.on { background: #F2B33D; }
.ocard.failing .ost { color: #FF5A5A; } .ocard.failing .pips i.on { background: #FF5A5A; }
.ocard.failed .ost { color: var(--dim); }
.ocard.healthy .ost { background: none; }
.ocard ul, .ocard ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 12.5px; line-height: 1.3; }
.ocard ul li { padding-left: 13px; position: relative; }
.ocard ul li::before { content: ''; position: absolute; left: 1px; top: .45em; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.ocard ul li.bad::before { background: var(--damage); } .ocard ul li.good::before { background: #7BE0A0; }
.ocard ul li.dim { color: var(--dim); }
.ocard .ometer { grid-column: 2; display: grid; gap: 3px; margin: 4px 0 2px; }
.ometer .mlab { font: 600 10.5px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.ometer .msegs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.ometer i { display: grid; justify-items: center; gap: 1px; padding: 4px 2px 3px; border-radius: 6px; background: rgba(140,150,170,.08); color: rgba(160,168,185,.38); font-style: normal; }
.ometer i b { font: 600 12px var(--mono); color: inherit; }
.ometer i small { font-size: 9.5px; }
.ometer i.on { color: #0B0E18; transform: scale(1.06); }
.ometer i.on b { font-size: 14px; }
.ometer i.s4 { background: #7BE0A0; } .ometer i.s3 { background: #C6E07B; } .ometer i.s2 { background: #F2B33D; } .ometer i.s1 { background: #FF5A5A; } .ometer i.s0 { background: #8A8F9C; }
.ocard .onow { grid-column: 2; margin: 2px 0 4px; font-size: 14px; font-weight: 600; }
.ocard .onow.bad { color: #FFB0A8; } .ocard .onow.good { color: #A8EBC0; }
#banner { min-height: 2.7em; font-size: 12.5px; line-height: 1.35; color: var(--dim); text-wrap: pretty; }
#banner b { color: var(--ink); font-weight: 600; }
#banner.alarm b { color: var(--toxin); }
#banner.bad b { color: var(--damage); }

/* Stage */
#stage { position: relative; flex: 1; min-height: 0; }
/* spectator zoom: a chip to get back out (double-tap or Esc also works) */
.zoomout { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 3; padding: 6px 12px; border-radius: 999px; background: rgba(10,13,24,.85); border: 1px solid var(--line); color: var(--dim); font: 500 12px var(--display); cursor: pointer; white-space: nowrap; }
.zoomout b { color: var(--ink); font-weight: 600; }
/* per-zone power buttons on the map (bottom-right of each sector): green = making cells, grey dashed = off */
.zpwr { position: absolute; z-index: 2; width: 30px; height: 30px; margin: -15px 0 0 -15px; display: grid; place-items: center; padding: 0; border-radius: 50%; background: rgba(10,13,24,.82); border: 1.5px solid #7BE0A0; box-shadow: 0 0 8px rgba(123,224,160,.45); cursor: pointer; touch-action: manipulation; }
.zpwr svg { width: 16px; height: 16px; fill: none; stroke: #7BE0A0; stroke-width: 2.6; stroke-linecap: round; }
.zpwr.off { border: 1.5px dashed #5A6070; box-shadow: none; }
.zpwr.off svg { stroke: #6B7180; }
.zpwr.no { animation: pwrNo .3s ease-in-out 2; }
@keyframes pwrNo { 0%, 100% { transform: none; } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#toasts { position: absolute; z-index: 6; left: 0; right: 0; bottom: 48px; display: grid; justify-items: center; gap: 4px; pointer-events: none; }
.toast { background: rgba(10, 13, 24, .9); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; animation: toast 2.2s ease forwards; }
.toast.bad { border-color: var(--damage); }
.toast.good { border-color: var(--gold); }
.toast.toxin { border-color: var(--toxin); }
@keyframes toast { 0% { opacity: 0; transform: translateY(6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* Bottom controls: marrow switch, pause */
#bar { display: flex; align-items: stretch; gap: 8px; padding-block: 6px 10px; min-width: 0; }
.mlabel { display: grid; gap: 2px; font-size: 12px; color: var(--dim); white-space: nowrap; }
.mlabel b { color: var(--ink); font: 600 12.5px var(--display); }
.mlabel span.cut { color: #C77DFF; }
.mlabel span { font: 500 11px var(--mono); font-variant-numeric: tabular-nums; }
/* Production cards: one per zone, a stacked bar of the mix */
.zones { flex: 1.4 1 0; min-width: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.zcard { min-width: 0; display: grid; gap: 4px; align-content: center; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.zcard.open { border-color: var(--cell); }
.zt { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.zt b { font: 600 12.5px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode { margin-left: auto; font: normal 500 10.5px var(--mono); }
.mode.offense { color: var(--kill); }
.mode.support { color: var(--repair); }
.mix { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--panel2); }
.mix i { display: block; flex: 1 1 0; min-width: 0; box-shadow: 0 0 6px currentColor; }
.zcard .boost { font: 600 10.5px var(--mono); font-style: normal; color: var(--gold); }
.zcard.off { border-style: dashed; }
.zcard.copied { animation: copied .7s ease-out; }
@keyframes pulse { from { opacity: 1; } to { opacity: .45; } }
@keyframes copied { 0% { box-shadow: 0 0 0 2px var(--gold), 0 0 16px rgba(255,210,63,.7); } 100% { box-shadow: none; } }
.lrow { align-items: flex-start; }
.loadouts { margin-left: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 76px)); gap: 6px; }
.lslot { display: grid; gap: 3px; }
.lapply { display: grid; gap: 4px; justify-items: start; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; font: 600 12px var(--mono); touch-action: manipulation; -webkit-touch-callout: none; }
.lapply[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.lbar { display: flex; width: 100%; height: 5px; border-radius: 3px; overflow: hidden; background: var(--line); }
.lbar i { display: block; min-width: 2px; }
.lbar em { font: 400 9.5px var(--display); color: var(--dim); font-style: normal; line-height: 5px; display: none; }
.lsave { background: none; border: 0; color: var(--dim); font: 500 11px var(--display); padding: 1px 0; text-decoration: underline; text-underline-offset: 2px; }
.copyall { margin-left: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.zcard.off .zt b, .zcard.off .zsub { color: var(--dim); }
.zcard.off .mix i { filter: grayscale(1) brightness(.6); }
.urow.dim { opacity: .45; }
.prow { border-top: 0; padding-top: 0; color: var(--ink); font-weight: 600; }
.seg2 button[data-on="1"][aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.seg2 button[data-on="0"][aria-pressed="true"] { border-color: var(--dim); color: var(--ink); background: var(--panel); }
.zsub { font: 500 10.5px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* The open production sheet sits over the bottom of the map */
#sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 100%; overflow: auto; z-index: 5; background: rgba(10, 13, 24, .96); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; display: grid; gap: 8px; box-sizing: border-box; max-width: 560px; margin: 0 auto; box-shadow: 0 -6px 30px rgba(0,0,0,.6); }
.shd { display: flex; gap: 8px; align-items: center; }
.ztabs { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.ztabs button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 2px; font-size: 12.5px; font-weight: 600; }
.ztabs button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.shint { margin: 0; font-size: 12px; color: var(--dim); text-wrap: pretty; }
.shint b { color: var(--ink); }
.urow { display: grid; grid-template-columns: 30px 1fr auto auto; grid-template-areas: "i t p a" "i r r r"; gap: 2px 8px; align-items: center; }
.urow img { grid-area: i; width: 30px; height: 30px; }
.urow .ut { grid-area: t; min-width: 0; display: grid; }
.urow .ut b { font-size: 13px; }
.urow .ut small { font-size: 11px; color: var(--dim); line-height: 1.25; }
.urow .pct { grid-area: p; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; min-width: 3em; text-align: right; }
.urow .qset { grid-area: a; display: flex; gap: 4px; }
.urow .qset button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.urow .qset button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 7px; font: 600 11.5px var(--mono); white-space: nowrap; }
.urow input { grid-area: r; width: 100%; margin: 2px 0; -webkit-appearance: none; appearance: none; height: 22px; background: none; }
.urow input::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--c) var(--p, 0%), var(--panel2) var(--p, 0%)); }
.urow input::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--c) var(--p, 0%), var(--panel2) var(--p, 0%)); }
.urow input::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: var(--c); border: 2px solid var(--void); box-shadow: 0 0 8px var(--c); }
.urow input::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--c); border: 2px solid var(--void); }
.mrow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 8px; }
.seg2 { margin-left: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.seg2 button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; }
.seg2 button[data-mode="offense"][aria-pressed="true"] { border-color: var(--kill); color: var(--kill); }
.seg2 button[data-mode="support"][aria-pressed="true"] { border-color: var(--repair); color: var(--repair); }
/* Cytokine storm: hold to preview the cost, release to fire */
#stormBtn { flex: none; display: grid; justify-items: center; align-content: center; gap: 2px; min-width: 58px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 6px; font: 600 11.5px var(--display); color: var(--dim); touch-action: none; }
#stormBtn img { width: 28px; height: 28px; }
#spawnRates input[type="range"] { width: 100%; }
#stormBtn { --charge: 0; position: relative; overflow: hidden; }
#stormBtn::before { content: ''; position: absolute; inset: auto 0 0 0; height: calc(var(--charge) * 100%); background: linear-gradient(to top, rgba(255,210,63,.45), rgba(255,210,63,.12)); pointer-events: none; }
#stormBtn > * { position: relative; }
#stormBtn.held { border-color: var(--gold); color: var(--gold); }
#stormBtn.lethal::before { background: linear-gradient(to top, rgba(255,59,78,.5), rgba(255,59,78,.14)); }
#stormBtn.charged { animation: stormReady .5s ease-in-out infinite alternate; }
@keyframes stormReady { from { box-shadow: 0 0 4px rgba(255,210,63,.4); } to { box-shadow: 0 0 18px rgba(255,210,63,.9); } }
#stormBtn.charged.lethal { animation-name: stormReadyLethal; }
@keyframes stormReadyLethal { from { box-shadow: 0 0 4px rgba(255,59,78,.4); } to { box-shadow: 0 0 20px rgba(255,59,78,1); } }
@media (prefers-reduced-motion: reduce) { #stormBtn.charged { animation: none; box-shadow: 0 0 14px rgba(255,210,63,.8); } }
#stormBtn.lethal { border-color: var(--damage); color: var(--damage); box-shadow: 0 0 12px rgba(255,59,78,.5); }
/* Risky: the storm would cost organ bars but not kill you */
#stormBtn.risky { border-color: #FF8A3D; color: #FF8A3D; box-shadow: 0 0 12px rgba(255,138,61,.5); }
#stormBtn.risky::before { background: linear-gradient(to top, rgba(255,138,61,.5), rgba(255,138,61,.14)); }
#stormBtn.charged.risky { animation-name: stormReadyRisky; }
@keyframes stormReadyRisky { from { box-shadow: 0 0 4px rgba(255,138,61,.4); } to { box-shadow: 0 0 18px rgba(255,138,61,.95); } }
#stormBtn.burning { border-color: var(--kill); color: var(--kill); }
#pauseBtn { height: auto; min-width: 44px; border-radius: 12px; }
.output { flex: 1 1 240px; min-width: 0; display: grid; grid-template-columns: 54px minmax(0, 1fr); column-gap: 10px; row-gap: 2px; align-content: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; }
.output .mlabel { display: flex; align-items: center; gap: 6px; }
.output .mlabel span { margin-left: auto; }
#output { width: 100%; margin: 4px 0 2px; -webkit-appearance: none; appearance: none; height: 18px; background: none; }
#output::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--track, var(--panel2)); }
#output::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track, var(--panel2)); }
#output::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: var(--ink); border: 2px solid var(--void); box-shadow: 0 0 8px rgba(255, 210, 63, .6); }
#output::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: 2px solid var(--void); }

/* Modals */
#modal { position: fixed; inset: 0; background: rgba(4, 5, 10, .8); display: grid; place-items: center; padding: 16px; z-index: 20; }
.mbox { width: 100%; max-width: 460px; max-height: calc(100% - 8px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; box-sizing: border-box; }
.mbox h2 { margin: 0; font-size: 24px; font-weight: 650; font-stretch: 80%; line-height: 1.05; text-wrap: balance; }
.mbox h2 .glow { color: var(--cell); }
.mbox h2 .bad { color: var(--damage); }
.mbox p { margin: 0; color: var(--dim); }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.howto { margin: 0; padding-left: 18px; display: grid; gap: 5px; color: var(--ink); font-size: 13.5px; }
.howto li::marker { color: var(--cell); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-weight: 600; white-space: nowrap; }
.btn.primary { border-color: var(--cell); color: var(--cell); }
.linkbtn { background: none; border: 0; color: var(--cell); text-decoration: underline; padding: 2px; justify-self: start; font-size: 13.5px; }
.stars { display: flex; gap: 6px; }
.stars img { width: 34px; height: 34px; }
.goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
.goals li { display: flex; gap: 8px; color: var(--dim); }
.goals li::before { content: "\2606"; }
.goals li.hit { color: var(--ink); }
.goals li.hit::before { content: "\2605"; color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { display: grid; gap: 1px; }
.stats b { font: 500 16px var(--mono); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--dim); }

/* Dev panel */
#dev { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100%); background: rgba(10, 13, 24, .97); border-left: 1px solid var(--line); z-index: 30; overflow: auto; padding: 14px 16px 40px; box-sizing: border-box; display: grid; gap: 12px; align-content: start; font-size: 13px; }

#dev .grp > input[type="range"] { width: 100%; accent-color: var(--gold); margin: 0 0 4px; }
#dev output.changed { color: var(--gold); }
#dev label.row output { font: 500 12px var(--mono); }
#dev input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--cell); }

#wsJson { width: 100%; min-height: 70px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 11px var(--mono); box-sizing: border-box; -webkit-user-select: text; user-select: text; }
.combos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.combo { display: grid; gap: 2px; align-content: start; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }

/* Wide screens: the Workshop panel docks beside the game */
@media (min-width: 1100px) { body.ws-open #app { margin-right: 380px; } #dev { width: 380px; } }
/* Phones: the panel is a bottom sheet so the map stays in view */
@media (max-width: 700px) { #dev { top: auto; left: 0; width: 100%; height: 58%; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; } body.ws-open #app { height: 50%; } body.ws-open #legend, body.ws-open #bar, body.ws-open #banner { display: none; } #dev { height: 50%; } }
/* v3's heart meter spans the left column; the toxin row sits under the fatigue line */
.output #toxRow { grid-column: 2; }
#heart { grid-row: 1 / span 4; }

/* v3's own debug spawn sliders duplicate the Workshop's antigen rates, so the Sandbox hides them */
#dev .grp:has(#spawnRates) { display: none; }

/* organ health buttons */
.devbtns .mini { align-self: center; font-size: 11px; color: var(--dim); margin-left: 4px; }

/* Toxin strip under the main game's organ button (no separate toxin bar) */
.bodybtn { flex-wrap: wrap; row-gap: 2px; }
.bodybtn .btox { display: block; flex-basis: 100%; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bodybtn .btox b { display: block; height: 100%; width: 0; background: var(--slime); }
.bodybtn .btox b.over { background: #C4E03A; box-shadow: 0 0 4px var(--slime); }
.ocard.tox .ost { color: var(--slime); }
.orgbtns { flex-wrap: wrap; }
.ocard.tox { grid-template-columns: 1fr; }

/* Narrower screens: production cards take a full row, controls below */
@media (max-width: 900px) {
  #bar { flex-wrap: wrap; }
  .zones { flex-basis: 100%; }
}
@media (max-width: 480px) {
  .zcard { padding: 5px 6px; }
  .zt b { font-size: 12px; }
  .mode { font-size: 0; } /* stance as a dot: the map chips spell it out, the zone name gets the room */
  .mode::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .bodybtn { gap: 2px; padding: 1px 3px 2px; }
  .bodybtn img { width: 16px; height: 12px; }
  .fatigue { gap: 6px; }
  .output { grid-template-columns: 44px minmax(0, 1fr); column-gap: 8px; }
  #heart { grid-row: 1 / span 2; width: 44px; height: 44px; }
  .output .fatigue { grid-column: 1 / -1; } /* full width, so the cell count never clips */
  #pauseBtn { min-width: 40px; }
  #stormBtn { min-width: 52px; }
}
/* Short landscape phones: tighten the chrome so the map keeps its height */
@media (max-height: 480px) {
  #hud { padding-block: 4px 0; }
  #banner { min-height: 1.35em; font-size: 12px; }
  #bar { padding-block: 4px 6px; }
  .zcard { gap: 2px; padding: 4px 6px; }
}
/* Wide screens: the map is always vertical, so it takes a tall column on the left and the controls stack on the right */
@media (min-width: 700px) and (min-aspect-ratio: 1/1) {
  #app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto auto 1fr auto; column-gap: 18px; max-width: calc(100vh * 0.52 + 430px); }
  #stage { grid-column: 1; grid-row: 1 / span 4; margin-block: 10px; }
  #hud { grid-column: 2; grid-row: 1; }
  #bar { grid-column: 2; grid-row: 4; flex-wrap: wrap; align-content: end; }
  .zones { flex-basis: 100%; grid-template-columns: 1fr; }
  .output { flex-basis: 100%; }
  #stormBtn { flex: 1; min-height: 52px; }
  #sheet { left: 0; right: 0; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation-duration: .01s; animation-delay: 2s; } }

<script>
// Immune RTS prototype art. Generated; edit gen.py, not this file.
// Usage: const img = await ART.load('neutrophil'); ctx.drawImage(img, x - s/2, y - s/2, s, s)
// Map sprites share a 64x64 box centred on the cell; `radius` is the body radius in those units.
// Non-square sprites (shots, trails) give meta.box [w,h] and meta.anchor [x,y]: put the anchor on the object and rotate to its heading.
// Draw cells and fields with ctx.globalCompositeOperation = 'lighter' for the fluorescence look.
const ART = {
  palette: {"void": "#04050A", "cell": "#3FE6FF", "cellHi": "#C8FAFF", "germ": "#FF3DCB", "germHi": "#FFC4EF", "toxin": "#B45CFF", "pollen": "#C9F25C", "pollenHi": "#F1FFC9", "antibody": "#FFD23F", "kill": "#FF7A3D", "repair": "#5CFFA1", "tissue": "#2B3A8C", "tissueHi": "#5468E0", "damage": "#FF3B4E", "blood": "#C2334F", "lymph": "#2FB89A", "ui": "#DDE6F5", "uiDim": "#6E7B96", "virus": "#D9B6FF", "virusHi": "#F4EAFF", "slime": "#A9CF3C", "wax": "#F3E3B5", "plum": "#5A1E4A", "amber": "#FFB23F", "dead": "#5D6478", "jaundice": "#E2D34A"},

  meta: {"neutrophil": {"kind": "unit", "size": 64, "radius": 13, "note": "Neutrophil, Eat stance (default). Small, fast swarm cell; the three-lobed nucleus is its tell."}, "net": {"kind": "effect", "size": 64, "radius": 28, "note": "DNA net left by a Trap neutrophil. Pins bacteria; tint the sector toward damage while it lasts."}, "neutrophil-trap": {"kind": "unit", "size": 64, "radius": 13, "note": "Neutrophil casting a net (Trap stance, one-way). Broken rim plus strands: it dies doing this."}, "macrophage-kill": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage, Kill stance. Big, slow tank. Orange core = inflammatory (adds Host Damage)."}, "macrophage-repair": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage, Repair stance. Same body, green core = healing tissue and calming the sector."}, "bacterium": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium (rod). Faces +x; rotate to heading. Rod silhouette keeps it distinct from round friendly cells."}, "bacterium-dividing": {"kind": "enemy", "size": 64, "radius": 12, "note": "Bacterium mid-division. Swap in for the last moments before a doubling so growth is visible."}, "bacterium-opsonized": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium coated in antibodies (Opsonize). Gold tags = macrophages eat it faster."}, "bacterium-complement": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium being holed by complement. Orange-rimmed pores; the orange is the inflammation it costs."}, "toxin-burst": {"kind": "effect", "size": 64, "radius": 30, "note": "Toxin burst (area damage). Draw at the blast radius, grow from 40% to 100% and fade out."}, "pollen": {"kind": "enemy", "size": 64, "radius": 18, "note": "Pollen grain (Pollen scenario). Harmless, so it gets its own hue and a calm spiky silhouette, not magenta."}, "antibody": {"kind": "particle", "size": 16, "radius": 2, "note": "Antibody particle (16px box). Draw at 3-6px, hundreds at once: random spin, slow drift,  "Neutrophil shot: a gold antibody tracer (64x16). Faces +x, head at the anchor. About 14px long on a phone.", "box": [64, 16], "anchor": [54, 8]}, "shot-tuned": {"kind": "projectile", "size": 64, "radius": 3.4, "note": "Tuned shot from inside a Support ring: thicker, white-hot, with a piercing tip. Draw ~1.4x the plain shot.", "box": [64, 16], "anchor": [54, 8]}, "hit-spark": {"kind": "effect", "size": 32, "radius": 14, "note": "Hit spark. Flash for ~80 ms where a shot lands; also the ricochet when a plain shot bounces off armor."}, "kill-shard": {"kind": "particle", "size": 16, "radius": 4, "note": "Kill fragment (16px). On a kill, throw 4-6 outward with random spin and fade over ~0.4 s."}, "bacterium-hit": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium flashed white on a hit. Swap in for ~80 ms and nudge it back along the shot."}, "bacterium-armored": {"kind": "enemy", "size": 64, "radius": 19, "note": "Armored bacterium: the rod inside a thick plated ring. Plain shots bounce off; tuned shots and Offense macrophages kill it."}, "bacterium-armored-dividing": {"kind": "enemy", "size": 64, "radius": 22, "note": "Armored bacterium mid-division (every 20 s). The shell stretches around both halves."}, "macrophage-offense": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage on Offense (v2). Orange core: swallows the nearest bacterium, one every 2 s."}, "macrophage-support": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage on Support (v2). Green core: stays put; pair with support-ring under it."}, "support-ring": {"kind": "field", "size": 128, "radius": 60, "note": "Support macrophage's ring (128 box, edge at 60). Width on screen = ring radius x 128/60. Pulse gently: scale 0.97-1.03 and alpha 0.7-1 over ~1.6 s."}, "speed-trail": {"kind": "effect", "size": 48, "radius": null, "note": "Speed trail behind a boosted neutrophil (48x16). Faces +x; put the anchor on the neutrophil's centre, rotate to its heading, draw before the cell. He ing: the pod cracks with a white flash. Show for ~0.3 s, then spawn bacteria.", "worldR": 7}, "staph-toxic": {"kind": "enemy", "size": 64, "radius": 9, "note": "Toxic-shock Staph (the drain): a plain rod wrapped in an orange pulse (the fatigue colour). Pulse its alpha ~1 Hz.", "worldR": 5.5}, "strep-link": {"kind": "enemy", "size": 64, "radius": 7, "note": "Strep chain link (one bead, with link stubs both sides). Place links ~18 units apart along the chain's path and rotate each to the path. Draw ~0.8x a plain bacterium.", "worldR": 4}, "strep-chain": {"kind": "enemy", "size": 64, "radius": 28, "note": "Strep chain (6 beads, wriggling). For icons, markers and previews; in play, build chains from strep-link.", "worldR": 14}, "herpes": {"kind": "enemy", "size": 64, "radius": 11, "note": "Herpes particle: a lilac hexagonal capsid in a dotted envelope. 8 burst out of each infected neutrophil.", "worldR": 3.5}, "neutrophil-infected": {"kind": "unit", "size": 64, "radius": 13, "note": "Neutrophil carrying herpes: looks normal except a faint lilac glow and a capsid inside. Flicker this sprite with the plain neutrophil every ~0.3 s so a sharp-eyed player can spot it.", "worldR": 8}, "tapeworm-head": {"kind": "enemy", "size": 64, "radius": 26, "note": "Tapeworm head (scolex): four suckers and a hook crown. The only enemy bigger than a macrophage: draw ~1.6x a macrophage. Faces +x.", "worldR": 24}, "tapeworm-segment": {"kind": "enemy", "size": 48, "radius": 19, "note": "Tapeworm segment (48x40). Chain them behind the head along its path, overlapping a little, each rotated to the path. Flash with hit-spark; when one breaks off, swap it for tapeworm-small.", "box": [48, 40], "anchor": [24, 20], "worldR": 15}, "tapeworm-small": {"kind": "enemy", "size": 64, "radius": 12, "note": "Small fast worm, made when a tapeworm segment breaks off. Faces +x.", "worldR": 6}, "neutrophil-net": {"kind": "unit", "size": 64, "radius": 13, "note": "Net neutrophil (marrow option), on its run to th   // ---- cytokine storm ----
  // Full-screen storm effect in view space, drawn last with source-over.
  // phase 'windup' (1 s): red flush rises, the storm-wave rolls out from (ox, oy), the marrow side.

  },
  // Screen-edge glow for Feverish (tier 2) and Exhausted (tier 3). Call last, in view space, with source-over.
  // Feverish: warm orange edges that breathe. Exhausted: thicker red edges with a slow, tired heartbeat and a slight dim.
  drawFatigueEdge(ctx, w, h, tier, t) {

// ---- 5a. Organs and overload ----
// The game's overload rules (v3 sim.js): past 100 fatigue every organ loses 0.008·over·(1 + over/25)·weight
// bars a second, the heart hit hardest; above 100 the body recovers 4× faster; while Fine (under 35) the liver
// and lungs grow back a bar a minute; any organ at 0 bars is Host failure. organTable integrates that in game
// time: step(t, f, hp, d) gives the next fatigue after d game seconds; gs(t) is game seconds per clip second,
// so a clip can pause (0) or fast-forward.
const ORGAN_W = [1, 0.8, 0.6, 0.6, 0.4, 0.5], ORGAN_HEALS = [2, 3]; // heart, kidneys, lungs, liver, spleen, brain
const orgLv = h => Math.max(0, Math.min(4, Math.ceil(h - 1e-9)));
const heartCap = h => [1.25, 1.25, 1.5, 1.75, 2][orgLv(h)];
// fatigue per game second at effective body output mul (kidneys slow recovery; 4× faster in Overload)
const fatigueRate = (mul, f, kid) => mul > 1.15 ? (mul - 1.15) * 1.2 : (mul - 1.15) * 1.2 * [0.25, 0.25, 0.5, 0.75, 1][orgLv(kid)] * (f > 100 ? 4 : 1);
function organTable(dur, f0, hp0, step, gs = () => 1) {
  const dt = 0.02, rows = [];
  let f = f0, hp = hp0.slice(), g = 0;
  for (let t = 0; t <= dur + dt; t += dt) {
    rows.push({ f, hp: hp.slice(), g });
    const d = dt * gs(t); g += d;
    f = Math.max(0, Math.min(150, step(t, f, hp, d)));
    const over = f - 100;
    if (over > 0) hp = hp.map((h, i) => Math.max(0, h - 0.008 * over * (1 + over / 25) * ORGAN_W[i] * d));

})();

// Cytokine storm: charge() returns a live handle so the page can mirror the game's
// hold-5-seconds-then-release control. fire() is the release, cancel() an early let-go.
SFX.stormCharge = (b, t, o = {}) => {
  const c = b.ctx, out = voice(b, t, o, 0.2), HOLD = 5;
  const bus = c.createGain(); bus.gain.value = 1; bus.connect(out);
  const lp = filt(c, 'lowpass', 180, 6);
  sweep(lp.frequency, t, 180, 3800, HOLD);
  const trem = c.createGain(); trem.gain.value = 0.6;
  const tl = osc(c, 'sine', 3, t, 60), td = c.createGain(); td.gain.value = 0.4;
  tl.frequency.setValueAtTime(3, t); tl.frequency.exponentialRampToValueAtTime(18, t + HOLD);
  chain(tl, td, trem.gain);
  const env = c.createGain(); env.gain.setValueAtTime(0.0001, t); env.gain.exponentialRampToValueAtTime(0.5, t + HOLD);
  chain(lp, trem, env, bus);
  const srcs = [tl];
  [0, 7, 12.1].forEach(det => {
    const s = osc(c, 'sawtooth', 55, t, 60);
    s.frequency.setValueAtTime(55 * Math.pow(2, det / 12), t);
    s.frequency.exponentialRampToValueAtTime(220 * Math.pow(2, det / 12), t + HOLD);
    s.connect(lp); srcs.push(s);
  });
  const n = noise(c, t, 60), hp = filt(c, 'highpass', 2000);
  const ng = c.createGain(); ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(0.18, t + HOLD);
  chain(n, hp, ng, bus); srcs.push(n);
  // Warning ticks once the charge turns Risky (orange) then Lethal (red).
  const ticks = [];
  for (let k = 0; k < 18; k++) {
    const tt = t + 2 + k * (k < 8 ? 0.25 : 0.14); if (tt > t + HOLD) break;
    const s = osc(c, 'square', k < 8 ? 1320 : 1760, tt, 0.04);
    chain(s, filt(c, 'lowpass', 4000), perc(c, tt, 0.07, 0.002, 0.04), bus); ticks.push(s);
  }
  // Fully charged: a held high whine until release.
  const ready = osc(c, 'sine', 1760, t + HOLD, 60), rg = c.createGain();
  rg.gain.setValueAtTime(0, t); rg.gain.setValueAtTime(0, t + HOLD); rg.gain.linearRampToValueAtTime(0.06, t + HOLD + 0.05);
  chain(ready, rg, bus); srcs.push(ready);
  const stopAll = (at) => { srcs.concat(ticks).forEach(s => { try { s.stop(at); } catch (e) {} }); };
  return {
    start: t, hold: HOLD,
    fire(at) {
      at = Math.max(at, c.currentTime);
      bus.gain.setValueAtTime(1, at); bus.gain.linearRampToValueAtTime(0.0001, at + 0.06); stopAll(at + 0.1);
      return SFX.stormBlast(b, at, o);
    },
    cancel(at) {
      at = Math.max(at, c.currentTime);
      srcs.forEach(s => { if (s.frequency) s.frequency.cancelScheduledValues(at), s.frequency.setValueAtTime(s.frequency.value || 110, at), s.frequency.exponentialRampToValueAtTime(30, at + 0.35); });
      bus.gain.setValueAtTime(1, at); bus.gain.exponentialRampToValueAtTime(0.0001, at + 0.4); stopAll(at + 0.45);

    }
  };
};

    chain(s, filt(c, 'lowpass', 220 + hard * 500), perc(c, t + dt, 0.95 * v, 0.006, 0.18), out);
    // phone speakers barely play below ~150 Hz, so add an overtone and a soft thump they can reproduce

const INST = {
  kick(c, out, t, v = 1) {
    const s = osc(c, 'sine', 150, t, 0.4);
    sweep(s.frequency, t, 150, 44, 0.12);
    chain(s, perc(c, t, 0.9 * v, 0.003, 0.38), out);
    chain(noise(c, t, 0.012), filt(c, 'bandpass', 3000, 0.8), perc(c, t, 0.18 * v, 0.001, 0.012), out);
  },
  heartKick(c, out, t, v = 1) {             // softer, rounder kick for the heartbeat pattern
    const s = osc(c, 'sine', 100, t, 0.3);
    sweep(s.frequency, t, 100, 45, 0.14);
    chain(s, filt(c, 'lowpass', 300), perc(c, t, 1.0 * v, 0.005, 0.28), out);
    const h = osc(c, 'triangle', 220, t, 0.12);
    sweep(h.frequency, t, 220, 110, 0.1);
    chain(h, filt(c, 'lowpass', 700), perc(c, t, 0.25 * v, 0.004, 0.1), out);
  },
  snare(c, out, t, v = 1) {
    chain(noise(c, t, 0.18), filt(c, 'bandpass', 1900, 0.9), perc(c, t, 0.5 * v, 0.002, 0.17), out);
    const s = osc(c, 'triangle', 200, t, 0.1);
    sweep(s.frequency, t, 200, 120, 0.08);
    chain(s, perc(c, t, 0.35 * v, 0.002, 0.1), out);
  },
  clap(c, out, t, v = 1) {
    const bp = filt(c, 'bandpass', 1300, 1.5); bp.connect(out);
    [0, 0.012, 0.024].forEach((dt, i) => chain(noise(c, t + dt, 0.12), perc(c, t + dt, 0.45 * v, 0.001, i === 2 ? 0.14 : 0.012), bp));
  },
  hat(c, out, t, v = 1, open) {
    chain(noise(c, t, open ? 0.22 : 0.05), filt(c, 'highpass', 7500), perc(c, t, 0.22 * v, 0.001, open ? 0.2 : 0.045), out);
  },
  shaker(c, out, t, v = 1) {
    chain(noise(c, t, 0.06), filt(c, 'bandpass', 5500, 1.2), perc(c, t, 0.12 * v, 0.015, 0.06), out);
  },
  bass(c, out, t, m, d, v = 1) {
    const f = mtof(m), lp = filt(c, 'lowpass', 220, 6);
    lp.frequency.setValueAtTime(220 + 1300 * v, t); lp.frequency.exponentialRampToValueAtTime(200, t + Math.min(d, 0.25));
    osc(c, 'sawtooth', f, t, d).connect(lp);

  },
  fuzzBass(c, out, t, m, d, v = 1) {

    lp.frequency.setValueAtTime(1600, t); lp.frequency.exponentialRampToValueAtTime(350, t + d);
    const s = osc(c, 'sawtooth', f, t, d), s2 = osc(c, 'square', f * 1.005, t, d), mix = c.createGain(); mix.gain.value = 0.5;
    s.connect(mix); s2.connect(mix);

  },
  pluck(c, out, t, m, d, v = 1, type = 'square') {
    const lp = filt(c, 'lowpass', 400, 4);
    lp.frequency.setValueAtTime(4200, t); lp.frequency.exponentialRampToValueAtTime(500, t + 0.18);
    osc(c, type, mtof(m), t, d + 0.2).connect(lp);
    chain(lp, perc(c, t, 0.13 * v, 0.003, Math.max(d, 0.2)), out);
  },
  bell(c, out, t, m, d, v = 1) {
    const f = mtof(m), car = osc(c, 'sine', f, t, d + 1.5), mod = osc(c, 'sine', f * 2, t, d + 1.5), idx = c.createGain();

  pad(c, out, t, notes, d, v = 1, bright = 900) {

  },

    lp.frequency.setValueAtTime(3000, t); lp.frequency.exponentialRampToValueAtTime(700, t + d);
    notes.forEach(m => [-6, 6].forEach(cents => { const s = osc(c, 'sawtooth', mtof(m), t, d); s.detune.value = cents; s.connect(lp); }));
    chain(lp, perc(c, t, 0.07 * v, 0.003, d), out);

  triBass(c, out, t, m, d, v = 1) {

  },
  chipNoise(c, out, t, v = 1, long) {
    chain(noise(c, t, long ? 0.15 : 0.04), filt(c, 'highpass', long ? 1500 : 5000), perc(c, t, (long ? 0.3 : 0.12) * v, 0.001, long ? 0.14 : 0.035), out);
  },
  bubble(c, out, t, v = 1) {
    const f = 300 + R() * 900, s = osc(c, 'sine', f, t, 0.12);
    sweep(s.frequency, t, f, f * 2.2, 0.06);

  siren(c, out, t, m, d, v = 1) {

  }
};

// Live player with lookahead scheduling. One track at a time.
function Player(bus) {
  this.bus = bus; this.track = null; this.timer = null; this.level = 1;

Player.prototype.play = function (key) {
  this.stop();
  const c = this.bus.ctx, tr = TRACKS[key], out = c.createGain();
  out.gain.value = 1; out.connect(this.bus.music);

  this.track = key; this.out = out; this.cur = this.level; this.queued = null; this.sd = sd;

  swallow: ['gulp', 'slurp'], // a macrophage eats a germ

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Uniform grid of buckets for neighbour queries
const CELL = 16, GC = Math.ceil(L / CELL) + 1, GR = Math.ceil(WIDTH / CELL) + 1;
class Grid {
  constructor() { this.b = Array.from({ length: GC * GR }, () => []); this.used = []; }
  clear() { for (const k of this.used) this.b[k].length = 0; this.used.length = 0; }
  key(u, v) { const c = Math.max(0, Math.min(GC - 1, Math.floor(u / CELL))), r = Math.max(0, Math.min(GR - 1, Math.floor(v / CELL))); return r * GC + c; }
  add(o) { const k = this.key(o.u, o.v), a = this.b[k]; if (!a.length) this.used.push(k); a.push(o); }
  // call fn(o) for everything in buckets overlapping the circle (u, v, rad)
  each(u, v, rad, fn) {
    const c0 = Math.max(0, Math.floor((u - rad) / CELL)), c1 = Math.min(GC - 1, Math.floor((u + rad) / CELL));
    const r0 = Math.max(0, Math.floor((v - rad) / CELL)), r1 = Math.min(GR - 1, Math.floor((v + rad) / CELL));
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) { const a = this.b[r * GC + c]; for (let i = 0; i < a.length; i++) if (fn(a[i]) === false) return; }
  }
}

class Game {

    this.seed = seed || 1;
    this.rand = mulberry32(this.seed * 9973 + 17);
    this.t = 0;
    this.ag = [];      // antigens
    this.cells = [];   // your cells: {type: neut | net | nk | mac}
    this.shots = []; this.domes = []; this.webs = [];
    this.hyphae = []; this.fungi = []; this.gH = null;
    this.fx = [];
    const share = 1 / this.units.length;
    this.zones = ZONES.map(name => {

      for (const u of this.units) { mix[u] = u === 'neut' ? 0.8 : 0; prog[u] = 0; }
      const rest = this.units.includes('mac') ? ['mac'] : this.units.filter(u => u !== 'neut');
      for (const u of rest) mix[u] = 0.2 / rest.length;
      return { name, mode: 'offense', on: true, count: 0, mix, prog, share };
    });

    this.clocks = {}; this.inNode = {}; // breach clock per organ (0-1), and how many of its germs sit in the node
    this.startState = () => ({ output: CONFIG.output.start, zones: this.zones.map(z => ({ mode: z.mode, on: z.on, mix: Object.fromEntries(this.units.map(u => [u, Math.round(z.mix[u] * 100)])) })) });
    this.waveIdx = 0; this.streamAcc = 0;

  }

  // ---- player actions ----
  // Production mix for a zone: shares across the level's unit types, always summing to 1
  setShare(z, type, x) {
    const zn = this.zones[z]; if (!zn || !(type in zn.mix)) return;
    x = Math.max(0, Math.min(1, +x || 0));
    const others = this.units.filter(u => u !== type), s = others.reduce((a, u) => a + zn.mix[u], 0);
    zn.mix[type] = x;
    for (const u of others) zn.mix[u] = s > 1e-6 ? zn.mix[u] * (1 - x) / s : (1 - x) / others.length;
    this.logMix(z, 'slider', type);
  }
  allIn(z, type) { const zn = this.zones[z]; if (!zn || !(type in zn.mix)) return; for (const u of this.units) zn.mix[u] = u === type ? 1 : 0; this.logMix(z, 'allIn', type); }
  setMix(z, mix) {
    const zn = this.zones[z]; if (!zn) return;
    let s = 0; for (const u of this.units) s += Math.max(0, +mix[u] || 0);
    for (const u of this.units) zn.mix[u] = s > 0 ? Math.max(0, +mix[u] || 0) / s : 1 / this.units.length;
    this.logMix(z, 'set');
  }
  // Switch a zone's production off (its share of the marrow goes to the zones still on) or back on. One zone always stays on.
  setZoneOn(z, on) {
    const zn = this.zones[z]; on = !!on; if (!zn || zn.on === on) return false;
    if (!on && this.zones.filter(q => q.on).length <= 1) return false;
    zn.on = on; this.logInput({ a: 'production', z, on }); return true;
  }
  // Copy one zone's production mix to every zone (stance and On/Off stay as they are)
  copyMixToAll(z) {
    const src = this.zones[z]; if (!src) return;
    for (const q of this.zones) if (q !== src) for (const u of this.units) q.mix[u] = src.mix[u];
    this.logInput({ a: 'mixAll', z, mix: Object.fromEntries(this.units.map(u => [u, Math.round(src.mix[u] * 100)])) });
  }
  toggleZoneOn(z) { const zn = this.zones[z]; return zn ? this.setZoneOn(z, !zn.on) : false; }
  zonesOn() { let n = 0; for (const q of this.zones) if (q.on) n++; return Math.max(1, n); }
  toggleZone(z) { const zn = this.zones[z]; if (zn) { zn.mode = zn.mode === 'offense' ? 'support' : 'offense'; this.logInput({ a: 'mode', z, mode: zn.mode }); } }
  setZone(z, mode) { const zn = this.zones[z]; if (zn && zn.mode !== mode) { zn.mode = mode; this.logInput({ a: 'mode', z, mode }); } }
  setOutput(x) {
    const o = Math.max(0, Math.min(1, +x || 0));
    if (Math.abs(o - this.output) < 1e-6) return;
    this.output = o; this.logInput({ a: 'output', x: +o.toFixed(2), mul: +this.outputMul().toFixed(2) }, 'output');
  }
  // ---- fight log ----
  // A player input. Rapid repeats of the same control (a slider being dragged) collapse into the last value.
  logInput(e, key) {
    const L = this.log.inputs, last = L[L.length - 1];
    e.t = +this.t.toFixed(2);
    if (key && last && last.key === key && e.t - last.t < 1) { Object.assign(last, e); return; }
    if (key) e.key = key;
    L.push(e);
    if (L.length > 4000) L.splice(0, L.length - 4000);
  }
  logMix(z, how, type) {
    const zn = this.zones[z], mix = {};

  }
  logEvent(e) { e.t = +this.t.toFixed(2); this.log.events.push(e); if (this.log.events.length > 4000) this.log.events.splice(0, 1000); }
  tick(key, n) { this.tally[key] = (this.tally[key] || 0) + (n || 1); }
  // ---- organs: 4 bars each; the penalty steps up with each whole bar lost; any organ at 0 is Host failure
  organLevel(k) { return Math.max(0, Math.min(4, Math.ceil(this.organs[k] - 1e-9))); }
  organVal(k, healthy) { const l = this.organLevel(k); return l >= 4 ? healthy : CONFIG.organs[k + Math.max(1, l)]; }
  // Breach clocks: each organ's germs in the Lymph node fill its own clock; a full clock costs that organ a bar
  breach(k, amount, why) {
    if (this.result || !(k in this.organs) || !(amount > 0)) return;
    const c = (this.clocks[k] || 0) + amount;
    if (c >= 1) { this.clocks[k] = 0; this.fx.push({ k: 'breachHit', organ: k }); this.hurtOrgan(k, 1, why || 'breach', 0); }
    else this.clocks[k] = c;
  }
  organOf(a) { return a.organ || (KINDS[a.k] && KINDS[a.k].organ) || 'spleen'; }
  // brain at 2 bars or fewer: a production mix change takes organs.brainDelay s to kick in
  usedMix(zn, t) {
    if (!zn.used) zn.used = Object.assign({}, zn.mix);
    let same = true; for (const u of this.units) if (Math.abs(zn.used[u] - zn.mix[u]) > 1e-9) { same = false; break; }
    if (same) { zn.pend = null; return zn.used; }
    if (zn.pend == null) zn.pend = t;
    if (this.organLevel('brain') > 2 || t - zn.pend >= CONFIG.organs.brainDelay) { zn.used = Object.assign({}, zn.mix); zn.pend = null; }
    return zn.used;
  }
  // brain: extra wander for every cell (1 = none)
  wanderMul() { return this.organVal('brain', 1); }
  // Sandbox: set an organ directly (0-4 bars); never ends the match by itself
  setOrgan(k, bars) { if (k in this.organs) this.organs[k] = Math.max(0, Math.min(4, +bars || 0)); }
  heartCap() { return this.organVal('heart', CONFIG.output.max); }
  recoverMul() { return this.organVal('kidney', 1); }
  moveMul() { return this.organVal('lungs', 1); }
  makeMul() { return this.organVal('liver', 1); }
  cellCap() { return Math.min(CONFIG.caps.cells, this.organVal('spleen', CONFIG.caps.cells)); }
  overload() { return Math.max(0, this.fatigue - 100); }
  // body output after the heart's ceiling
  effMul() { return Math.min(this.outputMul(), this.heartCap()); }
  // floor: lowest it can push the organ (default: overload can take the last bar, other causes stop at organs.otherFloor)
  hurtOrgan(k, bars, why, floor) {
    if (this.result || !(k in this.organs) || bars <= 0) return;
    const before = this.organLevel(k), lo = floor != null ? floor : (why || 'overload') === 'overload' ? 0 : CONFIG.organs.otherFloor;
    if (this.organs[k] <= lo) return;
    this.organs[k] = Math.max(lo, this.organs[k] - bars); this.organHit[k] = 0.6;
    const after = this.organLevel(k), cause = why || 'overload';
    if (cause !== 'overload') this.fx.push({ k: 'organHit', organ: k, amount: bars, cause });
    if (after < before) { this.fx.push({ k: 'organLevel', organ: k, level: after }); this.logEvent({ e: 'organ', organ: k, level: after, why: cause, fatigue: Math.round(this.fatigue) }); }
    if (after === 0 && before > 0) this.fx.push({ k: 'organFail', organ: k });
    if (this.organs[k] <= 0 && this.organLoss) this.finish(false, `Host failure. ${ORGAN_NAMES[k]} function lost ${cause === 'breach' ? 'to germs in the Lymph node' : cause === 'overload' ? `at fatigue ${Math.round(this.fatigue)}` : `(${cause})`}.`, 'host');
  }
  // Rough look ahead for the storm preview: fatigue path and the worst organ left, assuming nothing changes
  stormOutcome() {
    const C = CONFIG, S = C.storm, O = C.output, G = C.organs, F = C.fatigue;
    let f = Math.min(F.max, this.fatigue + S.cost), after = S.after, peak = f, worst = 4;
    const hp = Object.assign({}, this.organs), mul = this.effMul();
    for (let t = 0, dt = 0.2; t < 240; t += dt) {
      const kl = Math.max(0, Math.min(4, Math.ceil(hp.kidney - 1e-9))), rm = kl >= 4 ? 1 : G['kidney' + Math.max(1, kl)];
      let df = mul > O.rest ? (mul - O.rest) * O.tire : (mul - O.rest) * O.recover * rm;
      if (after > 0) { after -= dt; df = Math.max(0, df) + S.afterRate * (this.output <= 0.001 ? 0.5 : 1); }
      else if (df < 0 && f > 100) df *= G.overRecover;
      f = Math.max(0, Math.min(F.max, f + df * dt)); peak = Math.max(peak, f);
      const over = f - 100;
      if (over > 0) for (const k of ORGAN_KEYS) { hp[k] -= this.organRate(k, over) * dt; worst = Math.min(worst, hp[k]); }
      else if (after <= 0) break;
    }
    return { peak, worst, hurt: peak > 100, fatal: worst <= 0 };
  }
  organRate(k, over) { const G = CONFIG.organs; return G.dmg * over * (1 + over / G.knee) * G[ORGAN_WKEY[k]]; }
  // Cytokine storm: fires after a short wind-up, any time. Fatigue past 100 hurts every organ; an organ at 0 is Host failure.
  useStorm() { if (this.result || this.storm.wind > 0) return false; this.storm.wind = CONFIG.storm.windup; this.fx.push({ k: 'stormStart' }); this.logInput({ a: 'storm', fatigue: Math.round(this.fatigue) }); return true; }
  stormActive() { return this.storm.wind > 0 || this.storm.after > 0; }
  // Where a storm started now would leave fatigue, roughly (for the ghost bar)
  stormForecast() { const S = CONFIG.storm; return Math.min(CONFIG.fatigue.max, this.fatigue + S.cost + S.after * S.afterRate * (this.output <= 0.001 ? 0.5 : 1)); }

  outputMul() { const O = CONFIG.output; return O.min * Math.pow(O.max / O.min, this.output); }
  fatigueTier() { const F = CONFIG.fatigue, f = this.fatigue; return f >= F.exhausted ? 3 : f >= F.feverish ? 2 : f >= F.tired ? 1 : 0; }
  pendingToxin() {
    for (const tx of this.toxins) {
      if (tx.state === 'sweeping') return tx;
      if (tx.state === 'coming' && this.t >= tx.at - CONFIG.toxin.notice) return tx;
    }
    return null;
  }
  // Progress-bar markers still to come: {t, kind: 'wave' | 'toxin' | 'hatch', kinds, final}
  markers() {
    const out = [];
    for (let i = this.waveIdx; i < this.lv.waves.length; i++) {
      const w = this.lv.waves[i];
      out.push({ t: w.t, kind: 'wave', final: !!w.final, kinds: Object.keys(KINDS).filter(k => w[k] > 0), armored: !!w.mrsa });
    }
    for (const w of this.lv.waves) if (w.spore && w.t + CONFIG.spore.hatch > this.t) out.push({ t: w.t + CONFIG.spore.hatch, kind: 'hatch' });
    for (const tx of this.toxins) if (tx.state === 'coming') out.push({ t: tx.at, kind: 'toxin' });
    return out;
  }
  // Every scripted event, past and future (for the progress bar)
  levelEvents() {
    const ev = [];
    for (const w of this.lv.waves) if (w.t > 0) ev.push({ t: w.t, kind: 'wave', final: !!w.final, kinds: Object.keys(KINDS).filter(k => w[k] > 0), armored: !!w.mrsa });
    for (const w of this.lv.waves) if (w.spore) ev.push({ t: w.t + CONFIG.spore.hatch, kind: 'hatch' });
    for (const tx of this.toxins) ev.push({ t: tx.at, kind: 'toxin' });
    return ev;
  }
  liveAg() { return this.ag.filter(a => !a.dead && !a.eaten); }
  count(type) { let n = 0; for (const c of this.cells) if (c.type === type && !c.dead) n++; return n; }
  cellCount() { return this.cells.length; }
  get neut() { return this.cells.filter(c => c.type === 'neut' || c.type === 'net'); }
  get mac() { return this.cells.filter(c => c.type === 'mac'); }
  get bact() { return this.ag; }

  // ---- spawning ----
  spawnCell(type, home, u, v, start) {
    const C = CONFIG, r = this.rand;
    // every cell has the same fields (keeps the JS engine fast)
    const c = {
      id: this.id++, type, home, u: 0, v: 0, vu: 0, vv: 0, r: 3, m: 1, age: 0, dead: false, stun: 0,
      head: Math.PI / 2, turn: 0, cd: r() * 0.5, boosted: false, infected: 0, target: null, retarget: 0, tu: -1, tv: -1,
      pu: 0, pv: 0, mode: 'offense', gulp: 0, prey: null, flip: 0, tb: null,
    };
    if (type === 'mac') {
      const n = this.cells.filter(m => m.type === 'mac' && m.home === home).length, slot = n % POSTS.length;
      c.pu = home * ZONE + POSTS[slot][0] * ZONE; c.pv = VESSEL + POSTS[slot][1] * (WIDTH - VESSEL);
      c.r = C.macrophage.radius; c.m = 10; c.cd = 0;
      if (start) { c.u = c.pu; c.v = c.pv; }
    } else if (type === 'nk') { c.r = C.nk.radius; c.m = 2; }
    else if (type === 'net') { c.r = C.net.radius; c.m = 1.6; }
    else { c.r = C.neutrophil.radius; c.m = 1.4; }
    if (!start) {
      c.u = u != null ? u : home * ZONE + 20 + r() * (ZONE - 40);
      c.v = v != null ? v : VESSEL * 0.5;
      if (v == null) {
        c.vv = 60 + r() * 40; // pushed out of the vessel into the tissue
        if (type !== 'mac' && r() < 0.5) { c.v = WIDTH - FAR_VESSEL * 0.5; c.vv = -c.vv; } // or out of the far vessel
      }
    }
    this.cells.push(c);
    if (!start) this.tick('made.' + type);
    return c;
  }
  spawnAg(k, u, v, extra) {
    const C = CONFIG, r = this.rand;
    if (this.ag.length >= C.bacteria.maxCount + 260) return null;
    const K = KINDS[k];
    const hp = K.hp || (K.hpKey ? C[K.hpKey].hp : k === 'worm' ? C.worm.segHp : k === 'wormlet' ? C.worm.wormletHp : 1);
    const a = {
      id: this.id++, k, u: u == null ? WOUND.u + (r() - 0.5) * 90 : u, v: v == null ? WOUND.v + (r() - 0.5) * 180 : v,
      vu: 0, vv: 0, r: radiusOf(k), hp, maxHp: hp, age: 0, div: this.divTime(k), flash: 0, blink: 0, rot: r() * 6.283,
      dead: false, eaten: false, domed: false, prev: null, next: null, m: 1, split: false, anchored: false, hatchAt: 0,
    };
    a.m = Math.max(0.6, a.r * a.r / 6) * (k === 'worm' ? 3 : 1);
    if (extra) { if (extra.hatchAt) a.hatchAt = extra.hatchAt; if (extra.split) a.split = true; }
    this.ag.push(a);
    this.tick('in.' + k);
    return a;
  }
  divTime(k) {
    const C = CONFIG, base = { staph: C.staph.doubling, mrsa: C.mrsa.doubling, pseudo: C.pseudo.doubling, clos: C.clos.doubling, tb: C.tb.doubling, toxic: C.toxic.doubling }[k];
    return base ? base * (1 + (this.rand() - 0.5) * 2 * C.bacteria.jitter) : Infinity;
  }
  // A chain of links following a head (Strep chains, the Tapeworm)
  spawnChain(k, n, u, v) {
    let prev = null; const sp = radiusOf(k) * 2.1;
    for (let i = 0; i < n; i++) {
      const a = this.spawnAg(k, u - i * sp, v + Math.sin(i * 0.7) * 3);
      if (!a) break;
      if (prev) { a.prev = prev; prev.next = a; }
      prev = a;
    }
  }
  runWaves() {
    const w = this.lv.waves, r = this.rand;
    while (this.waveIdx < w.length && this.t >= w[this.waveIdx].t) {
      const wave = w[this.waveIdx++];
      let n = 0;
      for (const k of Object.keys(KINDS)) {
        const c = wave[k] || 0; if (!c) continue;
        if (k === 'strep') { for (let i = 0; i < c; i++) this.spawnChain('strep', CONFIG.strep.links, WOUND.u + 30, WOUND.v + (r() - 0.5) * 200); n += c * CONFIG.strep.links; }
        else if (k === 'worm') { for (let i = 0; i < c; i++) this.spawnChain('worm', CONFIG.worm.segments, WOUND.u + 60, WOUND.v); n += c; }
        else if (k === 'spore') { for (let i = 0; i < c; i++) this.spawnAg('spore', null, null, { hatchAt: wave.t + CONFIG.spore.hatch }); n += c; }
        else if (k === 'flu') { const cu = WOUND.u, cv = WOUND.v + (r() - 0.5) * 80; for (let i = 0; i < c; i++) this.spawnAg('flu', cu + (r() - 0.5) * 50, cv + (r() - 0.5) * 70); n += c; }
        else { for (let i = 0; i < c; i++) this.spawnAg(k); n += c; }
      }
      this.logEvent({ e: 'wave', final: !!wave.final, counts: Object.fromEntries(Object.keys(KINDS).filter(k => wave[k] > 0).map(k => [k, wave[k]])) });
      this.fx.push({ k: 'wave', u: WOUND.u, v: WOUND.v, n, kinds: Object.keys(KINDS).filter(k => wave[k] > 0), counts: Object.fromEntries(Object.keys(KINDS).filter(k => wave[k] > 0).map(k => [k, wave[k]])), final: !!wave.final });
    }
  }

  // ---- queries ----
  // Shots and nets can hurt it (not inert, not under a dome)
  hittable(a) { return !a.dead && !a.eaten && !a.domed && a.k !== 'spore'; }
  inRing(u, v) {
    const r2 = (this.ringR || CONFIG.support.ring) ** 2;
    for (const m of this.cells) if (m.type === 'mac' && !m.dead && !m.tb && m.mode === 'support' && m.stun <= 0 && (m.u - u) ** 2 + (m.v - v) ** 2 < r2) return true;
    return false;
  }
  nearestAg(u, v, maxD, filter) {
    let best = null, bd = maxD * maxD;
    const test = a => {
      if (a.dead || a.eaten || (filter && !filter(a))) return;
      const d = (a.u - u) ** 2 + (a.v - v) ** 2;
      if (d < bd) { bd = d; best = a; }
    };

    return best;
  }
  band(z) { const lsh = CONFIG.neutrophil.leash; return [z * ZONE - lsh, (z + 1) * ZONE + lsh]; }

  // ---- tick ----
  step(dt) {
    if (this.result) return;
    const C = CONFIG, r = this.rand;
    this.t += dt;
    const t = this.t;
    if (this.fx.length > 500) this.fx.splice(0, this.fx.length - 500);

    // --- script: waves, stream, spores, toxins
    this.runWaves();
    if (t < this.duration) {
      const S = this.lv.stream, f = t / this.duration;
      this.streamAcc += dt * (S.start + (S.end - S.start) * f);
      while (this.streamAcc >= 1) {
        const n = Math.max(1, Math.min(Math.floor(this.streamAcc), 1 + Math.floor(r() * S.clump)));
        this.streamAcc -= n;
        const ks = S.kinds.filter(x => !x.from || t >= x.from), tot = ks.reduce((a, x) => a + x.w, 0);
        let pick = r() * tot, k = ks[0].k;
        for (const x of ks) { if ((pick -= x.w) <= 0) { k = x.k; break; } }
        const cu = WOUND.u + (r() - 0.5) * 60, cv = WOUND.v + (r() - 0.5) * 160;
        for (let i = 0; i < n; i++) this.spawnAg(k, cu + (r() - 0.5) * 12, cv + (r() - 0.5) * 12);
        this.fx.push({ k: 'trickle', u: cu, v: cv });
      }
    }
    for (const a of this.ag) if (a.k === 'spore' && !a.dead && t >= a.hatchAt) {
      a.k = 'clos'; a.hp = a.maxHp = C.clos.hp; a.r = radiusOf('clos'); a.div = this.divTime('clos'); a.age = 0; a.blink = BLINK;
      this.fx.push({ k: 'hatch', u: a.u, v: a.v }); this.tick('hatch');
    }

    // --- body output, fatigue, storm
    const mul = this.effMul(), O = C.output, F = C.fatigue, S = C.storm, G = C.organs;
    const toxicAlive = this.ag.some(a => a.k === 'toxic' && !a.dead);
    this.toxicDrain = toxicAlive;
    // above rest fatigue builds; below it the body recovers (slower with hurt kidneys, much faster while in overload)
    let df = mul > O.rest ? (mul - O.rest) * O.tire * (toxicAlive ? C.toxic.fatigueMul : 1) : (mul - O.rest) * O.recover * this.recoverMul() * (this.fatigue > 100 ? G.overRecover : 1);
    if (this.storm.wind > 0) {
      this.storm.wind -= dt;
      if (this.storm.wind <= 0) this.fireStorm();
    } else if (this.storm.after > 0) {
      this.storm.after -= dt;
      df = Math.max(0, df) + S.afterRate * (this.output <= 0.001 ? 0.5 : 1);
    }
    this.fatigue = Math.max(0, Math.min(F.max, this.fatigue + df * dt));
    this.fatiguePeak = Math.max(this.fatiguePeak, this.fatigue);
    this.storm.justFired = false;
    // overload: past 100 every organ takes damage, faster the further over; rested, the liver and lungs heal
    const over = this.overload();
    for (const k of ORGAN_KEYS) this.organHit[k] = Math.max(0, this.organHit[k] - dt);
    if (over > 0) {
      if (this.overT === 0) this.fx.push({ k: 'overload' });
      this.overT += dt;
      for (const k of ORGAN_KEYS) { this.hurtOrgan(k, this.organRate(k, over) * dt, 'overload'); if (this.result) return; }
    } else {
      this.overT = 0;
      if (this.fatigue < F.tired && G.heal > 0) for (const k of ['liver', 'lungs']) this.organs[k] = Math.min(4, this.organs[k] + dt / G.heal);
    }
    const tier = this.fatigueTier();
    if (tier !== this.tier) { this.fx.push({ k: 'tier', tier, up: tier > this.tier }); this.logEvent({ e: 'tier', tier, fatigue: Math.round(this.fatigue) }); this.tier = tier; }
    this.tierTime[tier] += dt;
    const slow = (tier >= 1 ? F.tiredSpeed : 1) * this.moveMul();
    this.ringR = C.support.ring * (tier >= 3 ? F.exhaustedRing : 1);

    for (const tx of this.toxins) {
      if (tx.state === 'coming' && t >= tx.at) { tx.state = 'sweeping'; tx.front = 0; this.fx.push({ k: 'burst', u: WOUND.u, v: WOUND.v }); this.logEvent({ e: 'toxin', cellsInWound: this.cells.filter(c => !c.dead && c.u < ZONE).length }); }
      if (tx.state === 'sweeping') {
        tx.front += dt / C.toxin.sweep;
        const reach = tx.front * 340;
        for (const c of this.cells) if (!c.dead && c.u < ZONE && Math.hypot(c.u - WOUND.u, c.v - WOUND.v) < reach) { this.killCell(c, 'toxin'); this.stats.toxinDeaths++; }
        if (tx.front >= 1) tx.state = 'done';
      }
    }
    const warnTx = this.toxins.find(tx => tx.state === 'coming' && t >= tx.at - C.toxin.warn);
    this.warning = warnTx ? (warnTx.at - t) : 0;

    // --- production: the marrow is shared evenly by the zones that are on, each split by its mix
    const rate = C.marrow.rate * mul * this.makeMul() / this.zonesOn();
    const nMac = this.count('mac'), nNk = this.count('nk'), cellCap = this.cellCap();
    let total = this.cells.length;
    for (let z = 0; z < 3; z++) {
      const zn = this.zones[z];
      if (!zn.on) continue;
      const mix = this.usedMix(zn, t);
      for (const u of this.units) {
        zn.prog[u] += dt * rate * mix[u] / C.marrow[u];
        if (zn.prog[u] >= 1) {
          const capped = total >= cellCap || (u === 'mac' && nMac >= C.caps.mac) || (u === 'nk' && nNk >= C.caps.nk);
          if (capped) { zn.prog[u] = 1; continue; }
          zn.prog[u] -= 1; total++; this.stats.made++;
          const c = this.spawnCell(u, z);
          this.fx.push({ k: 'arrive', u: c.u, v: c.v, type: u });
        }
      }
    }

    // --- grids
    this.gA.clear(); this.gF.clear();
    for (const a of this.ag) if (!a.dead && !a.eaten) this.gA.add(a);
    for (const c of this.cells) if (!c.dead) this.gF.add(c);
    this.gH.clear();
    for (const h of this.hyphae) if (!h.dead && !h.wither) this.gH.add(h);
    // domes: mark what is sheltered, grow them
    for (const d of this.domes) d.r = Math.min(C.pseudo.domeMax, d.r + C.pseudo.domeGrow * dt * (d.hp / C.pseudo.domeHp));
    for (const a of this.ag) {
      a.domed = false;
      for (const d of this.domes) if ((a.u - d.u) ** 2 + (a.v - d.v) ** 2 < d.r * d.r) { a.domed = true; break; }
    }
    for (const w of this.webs) { w.life -= dt; w.r = this.penR(w); }
    if (this.webs.length) this.webs = this.webs.filter(w => w.life > 0);

    // --- your cells (a hurt brain makes every cell wander)
    const wob = (this.wanderMul() - 1) * C.organs.brainJitter;
    for (const c of this.cells) {
      if (c.dead) continue;
      c.age += dt;
      c.stun = Math.max(0, c.stun - dt);
      if (c.type === 'mac') this.stepMac(c, dt, slow);
      else if (c.type === 'neut') this.stepNeut(c, dt, slow, tier);
      else if (c.type === 'net') this.stepNet(c, dt, slow);
      else if (c.type === 'nk') this.stepNk(c, dt, slow);
      if (wob > 0) { const an = this.rand() * 6.283; c.vu += Math.cos(an) * wob * dt; c.vv += Math.sin(an) * wob * dt; }
    }
    // integrate and keep in bounds
    for (const c of this.cells) {
      if (c.dead) continue;
      c.u += c.vu * dt; c.v += c.vv * dt;
      if (c.u < 6) { c.u = 6; c.vu = Math.abs(c.vu) * 0.3; }
      if (c.u > L - 6) { c.u = L - 6; c.vu = -Math.abs(c.vu) * 0.3; }
      if (c.v < VESSEL * 0.3) { c.v = VESSEL * 0.3; c.vv = Math.abs(c.vv) * 0.3; }
      if (c.v > WIDTH - 6) { c.v = WIDTH - 6; c.vv = -Math.abs(c.vv) * 0.3; }
    }

      const lu = z * ZONE + ZONE * (0.25 + r() * 0.5), lv = WIDTH - (typeof FAR_VESSEL === 'number' ? FAR_VESSEL : 0) - 12; // just inside the far vessel's wall
      for (let i = 0; i < s.size; i++) this.spawnLeaker(k, lu + (r() - 0.5) * 30, lv - r() * 20);
    }
    else for (let i = 0; i < s.size; i++) g.spawnAg(k, cu + (r() - 0.5) * 24, cv + (r() - 0.5) * 24, k === 'spore' ? { hatchAt: g.t + C.spore.hatch } : null);
    g.fx.push({ k: 'trickle', u: cu, v: cv });
  }
  // Measles rides on v3's one-hit 'flu' body (shots, nets, storm and swallows already handle it),
  // flagged hj so this layer steers it at macrophages instead of letting it swim to the Lymph node.
  spawnMeasles(u, v, vu, vv) {
    const a = this.game.spawnAg('flu', u, v, { split: true });
    if (a) { a.hj = true; a.r = WS.measles.radius; a.vu = vu || 0; a.vv = vv || 0; }
    return a;
  }
  spawnLeaker(k, u, v) {
    const g = this.game, Lk = WS.leakers;
    const a = k === 'hep' ? g.spawnAg('flu', u, v, { split: true }) : g.spawnAg('staph', u, v);
    if (!a) return null;
    a.leak = a.organ = k === 'hep' ? 'liver' : 'kidney'; // organ: whose breach clock it fills in the Lymph node and on a leak
    if (k === 'ecoli') { a.hp = a.maxHp = Lk.ecoliHp; a.div = Infinity; a.ediv = Lk.ecoliDivide * (0.8 + 0.4 * g.rand()); }
    this.leakers.push(a);
    return a;
  }
  // ---- organs: v3 owns them (4 bars each, breach clocks). A leak into the blood vessel adds CONFIG.lymph.leak to its
  // organ's breach clock (a full clock costs a bar). Toxin hurts the kidneys through g.hurtOrgan (stops at organs.otherFloor).
  // This is the one place leak damage happens.
  leak(organ) {
    const g = this.game, o = this.organs; o.leaks[organ]++;
    g.fx.push({ k: 'leak', organ });
    if (!this.dev.organs) return;
    o.pops.push({ organ, t: 0, txt: `+${Math.round(CONFIG.lymph.leak * 100)}%` });
    g.breach(organ, CONFIG.lymph.leak, organ === 'liver' ? 'Hepatitis' : 'E. coli');
  }
  // h: share of full health (1 = 4 bars), as the Workshop buttons and combos give it
  setOrgan(organ, h) { this.game.setOrgan(organ, h * 4); }
  stepOrgans(dt) {
    const g = this.game, d = this.dev, o = this.organs, O = WS.organs, Lk = WS.leakers;
    // leakers swim for the vessel; E. coli divides on its own clock
    let marked = false;
    for (const a of this.leakers) {
      if (a.dead || a.eaten) { if (a.eaten) a.wasEaten = true; continue; }
      const sp = a.leak === 'liver' ? Lk.hepSpeed : Lk.ecoliSpeed;
      // the sim just moved it with its own drift toward the Lymph node; swap that drift for ours, keep collisions
      const tu = Math.sin(g.t * 1.7 + a.id) * sp * Lk.wobble, tv = -sp;
      if (!a.pen) { a.u += (tu - a.vu) * dt; a.v += (tv - a.vv) * dt; a.vu = tu; a.vv = tv; }
      else { a.u += (tu * 0.3 - a.vu) * dt; a.v += (tv * 0.3 - a.vv) * dt; } // caught in a net: sluggish
      if (a.v < VESSEL + 8) { a.dead = true; a.leaked = true; marked = true; this.leak(a.leak); continue; }
      if (a.leak === 'kidney' && !d.noDivision) {
        a.ediv -= dt;
        if (a.ediv <= 0) { a.ediv = Lk.ecoliDivide; const b = this.spawnLeaker('ecoli', a.u + (g.rand() - 0.5) * 8, a.v + (g.rand() - 0.5) * 8); if (b) b.blink = a.blink = typeof BLINK !== 'undefined' ? BLINK : 0.6; }
      }
    }
    if (marked) g.ag = g.ag.filter(a => !a.dead);
    // E. coli killed messily dumps extra toxin (the sim's pop already counted it as a plain kill)
    for (const a of this.leakers) if (a.dead && !a.leaked && !a.wasEaten && !a.counted && a.leak === 'kidney') {
      a.counted = true;
      if (d.toxinLoad && !d.toxinSimple) this.addToxin(Math.max(0, Lk.ecoliTox - WS.toxload.perKill));
      else if (d.toxinLoad && d.toxinSimple && !d.noFatigue) this.feed(Math.max(0, WS.toxheart.perEndo - WS.toxheart.perKill));
    }
    if (this.leakers.length > 50) this.leakers = this.leakers.filter(a => !a.dead);
    for (const p of o.pops) p.t += dt; if (o.pops.length) o.pops = o.pops.filter(p => p.t < 1.4);
    // high toxin wears the kidneys down
    if (d.organs && d.toxinLoad && !d.toxinSimple && this.tox.load > O.kidneyToxAt) g.hurtOrgan('kidney', O.kidneyToxBars * dt, 'toxin');
  }
  hijack(m) {
    const g = this.game;
    if (m.prey) g.release(m);
    m.infected = WS.measles.incubate; m.hj = true;
    g.fx.push({ k: 'infect', u: m.u, v: m.v }); g.fx.push({ k: 'hijack', u: m.u, v: m.v });
  }
  stepMeasles(dt) {
    const g = this.game, M = WS.measles;
    let marked = false;
    for (const a of g.ag) {
      if (!a.hj || a.dead) continue;
      if (a.eaten) { // swallowed: the macrophage that ate it is hijacked
        const m = g.cells.find(c => c.prey === a);
        a.dead = true; marked = true;
        if (m && !m.hj && !m.tb) this.hijack(m);
        continue;
      }
      let host = null, bd = M.seek * M.seek;
      for (const c of g.cells) if (c.type === 'mac' && !c.dead && !c.hj && !c.tb) { const d = (c.u - a.u) ** 2 + (c.v - a.v) ** 2; if (d < bd) { bd = d; host = c; } }
      if (!host) continue;
      const d = Math.sqrt(bd) || 1;
      if (d < host.r + a.r + 1) { a.dead = true; marked = true; this.hijack(host); continue; }
      a.vu = (host.u - a.u) / d * M.speed; a.vv = (host.v - a.v) / d * M.speed;
    }
    if (marked) g.ag = g.ag.filter(a => !a.dead);
    // hijacked macrophages: dark (no ring, no eating), then burst into more Measles
    for (const m of g.cells) {
      if (!m.hj || m.dead) continue;
      m.stun = Math.max(m.stun, 0.25);
      m.infected -= dt;
      if (m.infected <= 0) {
        m.infected = 0; // so v3 doesn't release Herpes; we release Measles instead
        g.killCell(m, 'burst');
        for (let i = 0; i < M.burst; i++) { const an = g.rand() * 6.283; const b = this.spawnMeasles(m.u, m.v, Math.cos(an) * 50, Math.sin(an) * 50); if (b) b.blink = typeof BLINK !== 'undefined' ? BLINK : 0.6; }
        g.fx.push({ k: 'measlesBurst', u: m.u, v: m.v });
      }
    }
    if (g.cells.some(c => c.dead)) g.cells = g.cells.filter(c => !c.dead);
  }
  spawnFriendly(type, n) {
    const g = this.game;
    for (let i = 0; i < (n || 1); i++) {
      const z = this.nextZone; this.nextZone = (this.nextZone + 1) % 3;
      const c = g.spawnCell(type, z);
      g.fx.push({ k: 'arrive', u: c.u, v: c.v, type });
    }
  }
  clearMap() {
    const g = this.game; for (const a of g.ag) if (!a.eaten) a.dead = true; g.domes.length = 0;
    if (g.hyphae) { g.hyphae.length = 0; g.fungi.length = 0; }
  }
  toxinBurstNow() { const g = this.game; g.toxins.push({ at: g.t + 0.01, state: 'coming', front: 0 }); }

  // ---- the tick ----
  step(dt) {
    const g = this.game, d = this.dev, C = CONFIG;
    if (g.result) return;
    if (g.fx.length > 450) g.fx.splice(0, g.fx.length - 450); // so the sim's own trim never shifts our read position
    // spawn rates: groups (or cells) per 10 s
    for (const s of SPAWNABLE) {
      const rate = d.rates[s.k] || 0; if (!rate) { this.acc[s.k] = 0; continue; }
      this.acc[s.k] = (this.acc[s.k] || 0) + dt * rate / 10 * (d.spawnMul == null ? 1 : d.spawnMul);
      while (this.acc[s.k] >= 1) { this.acc[s.k] -= 1; this.spawnGroup(s.k); }
    }
    for (const u of FRIENDLY) {
      const rate = d.friendly[u] || 0; if (!rate) { this.facc[u] = 0; continue; }
      this.facc[u] = (this.facc[u] || 0) + dt * rate / 10;
      while (this.facc[u] >= 1) { this.facc[u] -= 1; this.spawnFriendly(u); }
    }
    // marrow off: hold every zone's production progress at zero
    if (!d.marrowOn) for (const zn of g.zones) for (const u in zn.prog) zn.prog[u] = Math.min(zn.prog[u], 0);
    // cheats that work by holding values
    if (d.noDivision) for (const a of g.ag) a.div = Infinity;
    else for (const a of g.ag) if (a.div === Infinity && !a.leak) a.div = g.divTime(a.k);
    if (d.immortal) for (const c of g.cells) if (c.type === 'neut' || c.type === 'nk') c.age = Math.min(c.age, 1);
    if (d.noFatigue) g.fatigue = 0;

    // Fever slows division (bacteria only: viruses copy themselves inside your cells)
    if (d.feverDivision && !d.noDivision) {
      const F = WS.fever, mul = [1, F.tired, F.feverish, F.exhausted][g.fatigueTier()];
      if (mul < 1) for (const a of g.ag) if (KINDS[a.k] && KINDS[a.k].divides && !a.dead && !a.eaten) a.age = Math.max(0, a.age - dt * (1 - mul));
    }
    const from = g.fx.length, u0 = new Map();
    if (this.tox.puddles.length) for (const c of g.cells) u0.set(c, [c.u, c.v]);
    g.organLoss = !d.noDeath && !d.immortal; // the cheats keep a failed organ from ending the match
    g.step(dt);
    if (!g.result) this.stepMeasles(dt);
    if (!g.result) this.stepOrgans(dt);

    // Toxin load reads what just happened from the sim's event list
    const T = WS.toxload;
    if (d.toxinLoad && d.toxinSimple) {
      // Feed the heart: messy kills add fatigue directly, no separate bar
      const H = WS.toxheart;
      for (let i = from; i < g.fx.length; i++) {
        const f = g.fx[i];
        const amt = f.k === 'pop' ? (NO_TOXIN[f.kind] ? 0 : ENDO[f.kind] ? H.perEndo : H.perKill) : f.k === 'burst' ? H.perBurst : 0;
        if (amt && !d.noFatigue && !g.result) { this.feed(amt); this.tox.added += amt; }
      }
      if (this.tox.load) this.tox.load = 0;
    } else if (d.toxinLoad) {
      for (let i = from; i < g.fx.length; i++) {
        const f = g.fx[i];
        if (f.k === 'pop') {
          if (NO_TOXIN[f.kind]) continue;
          const amt = ENDO[f.kind] ? T.perEndo : T.perKill;
          this.addToxin(amt);
          if (d.puddles && this.tox.load > T.puddleAt && this.tox.puddles.length < 160) this.tox.puddles.push({ u: f.u, v: f.v, r: T.puddleR, life: T.puddleLife, max: T.puddleLife });
        } else if (f.k === 'burst') this.addToxin(T.perBurst);
      }
      // Clearance is proportional to the load (a half-life): very fast when rested, slow when exhausted.
      // The toxin left over feeds the heart, so it only matters once fatigue has slowed clearance.
      const k = this.clearRate();
      this.tox.load = Math.max(0, this.tox.load * Math.exp(-k * dt));
      if (!d.noFatigue && !g.result && this.tox.load > T.safe) this.tox.fed += this.feed(T.feed * (this.tox.load - T.safe) * dt);
      if (this.tox.load >= 99.9) this.tox.pinned += dt;
    } else if (this.tox.load) this.tox.load = 0;
    // puddles fade (faster as the load drops) and slow your cells passing through
    if (this.tox.puddles.length) {
      const fade = d.toxinLoad && this.tox.load > T.puddleAt ? 1 : 2.5;

      this.tox.puddles = this.tox.puddles.filter(p => p.life > 0);
      for (const c of g.cells) {
        const was = u0.get(c); if (!was) continue;
        for (const p of this.tox.puddles) if ((c.u - p.u) ** 2 + (c.v - p.v) ** 2 < p.r * p.r) {
          c.u = was[0] + (c.u - was[0]) * T.puddleSlow; c.v = was[1] + (c.v - was[1]) * T.puddleSlow; break;
        }
      }
    }
    if (d.noFatigue) g.fatigue = 0;
    if (d.immortal) for (const c of g.cells) if (c.type === 'neut' || c.type === 'nk') c.age = Math.min(c.age, 1);

    // No death: an organ at 0 would have been Host failure; log it and keep playing (g.organLoss is off, so it keeps its worst penalty)
    if (d.noDeath) for (let i = from; i < g.fx.length; i++) if (g.fx[i].k === 'organFail') { this.nearLosses.push({ t: g.t, cause: g.fx[i].organ }); g.fx.push({ k: 'nearLoss', cause: g.fx[i].organ }); }
    if (g.result && !g.result.win && d.noDeath) { g.fx.push({ k: 'nearLoss', cause: g.result.cause }); this.forgive(); }
  }
  // undo a loss and play on (No death, or "Keep going" on the end screen)
  forgive() {
    const g = this.game; if (!g.result) return;
    this.nearLosses.push({ t: g.t, cause: g.result.cause });
    g.fatigue = Math.min(g.fatigue, 90); g.storm.after = 0; g.storm.wind = 0; g.result = null;
  }
  // Toxin feeds fatigue up to 100 but never pushes it into Overload (only body output and the storm do that)
  feed(n) { const g = this.game, f0 = g.fatigue; if (f0 < 100) g.fatigue = Math.min(100, f0 + n); return g.fatigue - f0; }
  // Toxin cleared per second per point of load (so the half-life is ln 2 / clearRate)
  clearRate() { const T = WS.toxload; return T.clear * this.fatigueClear() * this.clearFactor(); }
  fatigueClear() { const T = WS.toxload; return 1 + (T.clearTired - 1) * Math.min(1, this.game.fatigue / 100); }
  // liver and kidneys share the clearing, by their health in the main game (4 bars = full)
  clearFactor() { const o = this.game.organs, O = WS.organs; return Math.max(O.minClear, (O.liverShare * o.liver + (1 - O.liverShare) * o.kidney) / 4); }
  addToxin(n) {

    this.tox.added += n;
    this.tox.peak = Math.max(this.tox.peak, this.tox.load);
  }

  // Live numbers for the readout
  census() {
    const g = this.game, out = {};
    for (const a of g.ag) if (!a.dead && !a.eaten) { const k = a.hj ? 'measles' : a.leak === 'liver' ? 'hep' : a.leak === 'kidney' ? 'ecoli' : a.k; out[k] = (out[k] || 0) + 1; }

  }
}

  function drawGraph() {
    const c = $('#graph'), r = c.getBoundingClientRect(), k = Math.min(3, window.devicePixelRatio || 1);
