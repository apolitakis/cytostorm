<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cytostorm v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04050A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cytostorm">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-512.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* v2 layout: progress bar on top, the three-zone map in the middle, one control row at the bottom.
   Deliberately single-theme: the art is fluorescence microscopy, glowing cells on black. */
:root {
  color-scheme: dark;
  --void: #04050A;
  --panel: #0A0D18;
  --panel2: #10152A;
  --line: #1E2540;
  --ink: #DDE6F5;
  --dim: #7A86A0;
  --cell: #3FE6FF;
  --germ: #FF3DCB;
  --gold: #FFD23F;
  --kill: #FF7A3D;
  --repair: #5CFFA1;
  --damage: #FF3B4E;
  --toxin: #B45CFF;
  --display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--void); color: var(--ink); }
body { margin: 0; font: 14px/1.4 var(--display); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img.ico { width: 18px; height: 18px; flex: none; }

#app { height: 100%; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; padding-inline: 16px; box-sizing: border-box; }

/* HUD */
#hud { display: grid; gap: 4px; padding-block: 8px 2px; min-width: 0; }
.hudrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
#prog { flex: 1; min-width: 0; height: 30px; display: block; }
#clock { flex: none; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; color: var(--dim); min-width: 2.8em; text-align: right; }
.hbtn { flex: none; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font: 500 12px var(--mono); min-width: 34px; height: 30px; box-sizing: border-box; }
.hbtn img { width: 16px; height: 16px; }
#speedTag { font: 500 12px var(--mono); color: var(--gold); }
/* Fatigue meter: fills as the body overworks; ticks at each tier */
.fatigue { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--dim); min-width: 0; }
.fatigue > span:first-child { flex: none; }
.ftrack { flex: 1; min-width: 40px; height: 10px; display: flex; }
.ftrack svg { display: block; }
#fIcon { width: 18px; height: 18px; flex: none; }
#fTier { flex: none; min-width: 5.4em; font: 600 11.5px var(--display); color: var(--dim); text-align: right; }
.fatigue[data-tier="1"] #fTier { color: var(--gold); }
.fatigue[data-tier="2"] #fTier { color: var(--kill); }
.fatigue[data-tier="3"] #fTier { color: var(--damage); }
#banner { min-height: 1.4em; font-size: 12.5px; line-height: 1.35; color: var(--dim); text-wrap: pretty; }
#banner b { color: var(--ink); font-weight: 600; }
#banner.alarm b { color: var(--toxin); }
#banner.bad b { color: var(--damage); }

/* Stage */
#stage { position: relative; flex: 1; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#toasts { position: absolute; left: 0; right: 0; bottom: 8px; display: grid; justify-items: center; gap: 4px; pointer-events: none; }
.toast { background: rgba(10, 13, 24, .9); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; animation: toast 2.2s ease forwards; }
.toast.bad { border-color: var(--damage); }
.toast.good { border-color: var(--gold); }
.toast.toxin { border-color: var(--toxin); }
@keyframes toast { 0% { opacity: 0; transform: translateY(6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* Bottom controls: marrow switch, pause */
#bar { display: flex; align-items: stretch; gap: 8px; padding-block: 6px 10px; min-width: 0; }
.marrow { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.mlabel { display: grid; gap: 2px; font-size: 12px; color: var(--dim); white-space: nowrap; }
.mlabel b { color: var(--ink); font: 600 12.5px var(--display); }
.mlabel span { font: 500 11px var(--mono); font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; min-width: 0; }
.seg button { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 4px; font-size: 13px; font-weight: 600; overflow: hidden; min-width: 0; white-space: nowrap; }
.seg button img { width: 20px; height: 20px; flex: none; }
.seg button .nm { overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.seg button .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--cell); box-shadow: 0 0 8px var(--cell); }
.seg button .ct { font: 500 11px var(--mono); color: var(--dim); }
#pauseBtn { height: auto; min-width: 48px; border-radius: 12px; }
.output { flex: 0 1 300px; min-width: 0; display: grid; gap: 2px; align-content: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; }
.output .mlabel { display: flex; align-items: center; gap: 6px; }
.output .mlabel span { margin-left: auto; }
#output { width: 100%; margin: 4px 0 2px; -webkit-appearance: none; appearance: none; height: 18px; background: none; }
#output::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--track, var(--panel2)); }
#output::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track, var(--panel2)); }
#output::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: var(--ink); border: 2px solid var(--void); box-shadow: 0 0 8px rgba(255, 210, 63, .6); }
#output::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: 2px solid var(--void); }

/* Modals */
#modal { position: fixed; inset: 0; background: rgba(4, 5, 10, .8); display: grid; place-items: center; padding: 16px; z-index: 20; }
.mbox { width: 100%; max-width: 460px; max-height: calc(100% - 8px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; box-sizing: border-box; }
.mbox h2 { margin: 0; font-size: 24px; font-weight: 650; font-stretch: 80%; line-height: 1.05; text-wrap: balance; }
.mbox h2 .glow { color: var(--cell); }
.mbox h2 .bad { color: var(--damage); }
.mbox p { margin: 0; color: var(--dim); }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.howto { margin: 0; padding-left: 18px; display: grid; gap: 5px; color: var(--ink); font-size: 13.5px; }
.howto li::marker { color: var(--cell); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-weight: 600; white-space: nowrap; }
.btn.primary { border-color: var(--cell); color: var(--cell); }
.linkbtn { background: none; border: 0; color: var(--cell); text-decoration: underline; padding: 2px; justify-self: start; font-size: 13.5px; }
.stars { display: flex; gap: 6px; }
.stars img { width: 34px; height: 34px; }
.goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
.goals li { display: flex; gap: 8px; color: var(--dim); }
.goals li::before { content: "\2606"; }
.goals li.hit { color: var(--ink); }
.goals li.hit::before { content: "\2605"; color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { display: grid; gap: 1px; }
.stats b { font: 500 16px var(--mono); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--dim); }
#graph { width: 100%; height: 130px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--dim); margin-top: -6px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; background: var(--c); }
/* Guide */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; position: sticky; top: -18px; background: var(--panel); padding-block: 6px; z-index: 1; }
.tabs button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; font-size: 12.5px; }
.tabs button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.gsec { display: grid; gap: 14px; }
.unit { display: grid; grid-template-columns: 44px 1fr; gap: 2px 12px; align-items: start; }
.unit > img { grid-row: span 3; width: 44px; height: 44px; }
.unit h4 { margin: 0; font-size: 16px; font-weight: 650; font-stretch: 85%; }
.unit .why { margin: 0; color: var(--ink); font-size: 13.5px; }
.unit ul { margin: 2px 0 0; padding-left: 16px; display: grid; gap: 3px; color: var(--dim); font-size: 13px; }
.unit ul b { color: var(--ink); font-weight: 600; }

/* Dev panel */
#dev { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100%); background: rgba(10, 13, 24, .97); border-left: 1px solid var(--line); z-index: 30; overflow: auto; padding: 14px 16px 40px; box-sizing: border-box; display: grid; gap: 12px; align-content: start; font-size: 13px; }
#dev h3 { margin: 0; font-size: 16px; font-weight: 650; font-stretch: 85%; display: flex; align-items: center; }
#dev h3 button { margin-left: auto; }
#dev .grp { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
#dev label.row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
#dev input[type="number"] { width: 5.5em; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: 12px var(--mono); }
#dev input[type="number"].changed { border-color: var(--gold); color: var(--gold); }
#dev details summary { cursor: pointer; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 4px 0; }
#dev details[open] summary { color: var(--ink); }
#dev details .field { display: grid; gap: 2px; padding: 4px 0; }
#dev details .field small { color: var(--dim); font-size: 11px; line-height: 1.3; }
#dev .devbtns { display: flex; gap: 6px; flex-wrap: wrap; }
#dev .devbtns button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; }
#devJson { width: 100%; min-height: 80px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 11px var(--mono); box-sizing: border-box; }
#speed { width: 100%; accent-color: var(--gold); }

/* Narrow portrait phones: the marrow label sits above the switch so both names fit */
@media (max-width: 640px) {
  #bar { flex-wrap: wrap; }
  .marrow { flex-basis: 100%; }
  .output { flex: 1 1 auto; }
}
@media (max-width: 480px) {
  .marrow { grid-template-columns: 1fr; padding: 5px 6px 6px; }
  .mlabel { display: flex; align-items: baseline; gap: 8px; }
  .seg button { font-size: 12.5px; gap: 4px; padding: 6px 3px; }
  .seg button img { width: 18px; height: 18px; }
  #pauseBtn { min-width: 40px; }
}
/* Short landscape phones: tighten the chrome so the map keeps its height */
@media (max-height: 480px) {
  #hud { padding-block: 4px 0; }
  #banner { min-height: 0; font-size: 12px; }
  #bar { padding-block: 4px 6px; }
  .seg button { padding: 5px 4px; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation-duration: .01s; animation-delay: 2s; } }
</style>

<div id="app">
  <header id="hud">
    <div class="hudrow">
      <canvas id="prog" aria-label="Level progress: waves and toxin bursts still to come"></canvas>
      <span id="clock">0:00</span>
      <span id="speedTag" hidden></span>
      <button id="helpBtn" class="hbtn" type="button" aria-label="Guide">?</button>
      <button id="devBtn" class="hbtn" type="button">Dev</button>
    </div>
    <div id="banner" aria-live="polite"></div>
  </header>

  <main id="stage">
    <canvas id="cv" aria-label="The map: Wound, Tissue and Lymph node. Tap a zone to flip its macrophages between Offense and Support."></canvas>
    <div id="toasts"></div>
  </main>

  <footer id="bar">
    <div class="marrow">
      <div class="mlabel"><b>Marrow</b><span id="cellCount">0/20</span></div>
      <div class="seg" id="marrowSeg">
        <button type="button" data-make="neut" aria-pressed="true"><img data-art="neutrophil" alt=""><span class="nm">Neutrophils</span><span class="ct" id="nCount">0</span><i class="fill"></i></button>
        <button type="button" data-make="mac" aria-pressed="false"><img data-art="macrophage-offense" alt=""><span class="nm">Macrophages</span><span class="ct" id="mCount">0</span><i class="fill"></i></button>
      </div>
    </div>
    <div class="output">
      <div class="mlabel"><img class="ico" data-art="body-output" alt=""><b>Body output</b><span id="outVal">1.0×</span></div>
      <input type="range" id="output" min="0" max="100" step="5" value="50" aria-label="Body output: how fast the marrow makes cells">
      <div class="fatigue" id="fatigue" data-tier="0"><span>Fatigue</span><div class="ftrack" id="ftrack"></div><img id="fIcon" alt=""><span id="fTier">Fine</span></div>
    </div>
    <button id="pauseBtn" class="hbtn" type="button" aria-label="Pause"><img data-art="pause" alt=""></button>
  </footer>
</div>

<div id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>

<aside id="dev" hidden aria-label="Dev tools">
  <h3>Dev tools <button type="button" class="hbtn" id="devClose">Close</button></h3>
  <div class="grp">
    <label class="row" for="speed"><span>Speed <b id="speedVal">1×</b></span></label>
    <input type="range" id="speed" min="0" max="6" step="1" value="2">
    <div class="devbtns"><button type="button" id="devPause">Pause</button><button type="button" id="devStep">Step 1 s</button><button type="button" id="devSkip">Skip 15 s</button></div>
  </div>
  <div class="grp">
    <label class="row" for="seed"><span>Random seed</span><input type="number" id="seed" value="1" min="1" step="1"></label>
    <div class="devbtns"><button type="button" id="devRestart">Restart with seed</button><button type="button" id="devNewSeed">New seed</button></div>
  </div>
  <div class="grp">
    <span>Cheats and overlays</span>
    <div class="devbtns"><button type="button" id="cheatBact">+10 bacteria</button><button type="button" id="cheatArmor">+4 armored</button><button type="button" id="cheatClear">Kill all bacteria</button></div>
    <label class="row" for="ovRange"><span>Show neutrophil range</span><input type="checkbox" id="ovRange"></label>
    <label class="row" for="ovRotate"><span>Force portrait layout</span><input type="checkbox" id="ovRotate"></label>
  </div>
  <div class="grp">
    <span>Tuning <small style="color:var(--dim)">(live; gold = changed from default; saved in this browser)</small></span>
    <div id="tuning"></div>
    <div class="devbtns"><button type="button" id="tuneCopy">Copy changes as JSON</button><button type="button" id="tuneReset">Reset all</button></div>
    <textarea id="devJson" hidden readonly aria-label="Tuning JSON"></textarea>
  </div>
</aside>

<script>
// Immune RTS prototype art. Generated; edit gen.py, not this file.
// Usage: const img = await ART.load('neutrophil'); ctx.drawImage(img, x - s/2, y - s/2, s, s)
// Map sprites share a 64x64 box centred on the cell; `radius` is the body radius in those units.
// Non-square sprites (shots, trails) give meta.box [w,h] and meta.anchor [x,y]: put the anchor on the object and rotate to its heading.
// Draw cells and fields with ctx.globalCompositeOperation = 'lighter' for the fluorescence look.
const ART = {
  palette: {"void": "#04050A", "cell": "#3FE6FF", "cellHi": "#C8FAFF", "germ": "#FF3DCB", "germHi": "#FFC4EF", "toxin": "#B45CFF", "pollen": "#C9F25C", "pollenHi": "#F1FFC9", "antibody": "#FFD23F", "kill": "#FF7A3D", "repair": "#5CFFA1", "tissue": "#2B3A8C", "tissueHi": "#5468E0", "damage": "#FF3B4E", "blood": "#C2334F", "lymph": "#2FB89A", "ui": "#DDE6F5", "uiDim": "#6E7B96"},
  alert: {"quiet": "#7F8FB0", "watch": "#FFD23F", "inflamed": "#FF7A3D", "max": "#FF3B4E"},
  meta: {"neutrophil": {"kind": "unit", "size": 64, "radius": 13, "note": "Neutrophil, Eat stance (default). Small, fast swarm cell; the three-lobed nucleus is its tell."}, "net": {"kind": "effect", "size": 64, "radius": 28, "note": "DNA net left by a Trap neutrophil. Pins bacteria; tint the sector toward damage while it lasts."}, "neutrophil-trap": {"kind": "unit", "size": 64, "radius": 13, "note": "Neutrophil casting a net (Trap stance, one-way). Broken rim plus strands: it dies doing this."}, "macrophage-kill": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage, Kill stance. Big, slow tank. Orange core = inflammatory (adds Host Damage)."}, "macrophage-repair": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage, Repair stance. Same body, green core = healing tissue and calming the sector."}, "bacterium": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium (rod). Faces +x; rotate to heading. Rod silhouette keeps it distinct from round friendly cells."}, "bacterium-dividing": {"kind": "enemy", "size": 64, "radius": 12, "note": "Bacterium mid-division. Swap in for the last moments before a doubling so growth is visible."}, "bacterium-opsonized": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium coated in antibodies (Opsonize). Gold tags = macrophages eat it faster."}, "bacterium-complement": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium being holed by complement. Orange-rimmed pores; the orange is the inflammation it costs."}, "toxin-burst": {"kind": "effect", "size": 64, "radius": 30, "note": "Toxin burst (area damage). Draw at the blast radius, grow from 40% to 100% and fade out."}, "pollen": {"kind": "enemy", "size": 64, "radius": 18, "note": "Pollen grain (Pollen scenario). Harmless, so it gets its own hue and a calm spiky silhouette, not magenta."}, "antibody": {"kind": "particle", "size": 16, "radius": 2, "note": "Antibody particle (16px box). Draw at 3-6px, hundreds at once: random spin, slow drift, short fade. Spawn rate follows the antibody field."}, "antibody-cloud": {"kind": "field", "size": 64, "radius": 30, "note": "Faint gold haze under dense antibody particles. One stamp per field cell, alpha = density, additive."}, "tissue": {"kind": "tile", "size": 128, "radius": null, "note": "Healthy tissue, seamless 128px tile. Sits under everything; keep it dim."}, "tissue-damaged": {"kind": "tile", "size": 128, "radius": null, "note": "Damaged tissue tile. Cross-fade over 'tissue' by the sector's Host Damage share."}, "vessel-blood": {"kind": "tile", "size": 128, "radius": null, "note": "Blood vessel strip, tiles horizontally (128x64). Edge of the blood-entry sector; new cells emerge from it."}, "vessel-lymph": {"kind": "tile", "size": 128, "radius": null, "note": "Lymph vessel strip, tiles horizontally (128x64). Chevron valves point the way out."}, "wound": {"kind": "tile", "size": 128, "radius": null, "note": "Wound gash overlay (transparent background, 128x64). Lay across the wound sector where bacteria pour in."}, "alert-quiet": {"kind": "icon", "size": 48, "radius": null, "note": "Sector alert: Quiet. Bars = level, colour ramps toward inflammation."}, "alert-watch": {"kind": "icon", "size": 48, "radius": null, "note": "Sector alert: Watch. Bars = level, colour ramps toward inflammation."}, "alert-inflamed": {"kind": "icon", "size": 48, "radius": null, "note": "Sector alert: Inflamed. Bars = level, colour ramps toward inflammation."}, "alert-max": {"kind": "icon", "size": 48, "radius": null, "note": "Sector alert: Max. Bars = level, colour ramps toward inflammation."}, "fever": {"kind": "icon", "size": 48, "radius": null, "note": "Fever (body-wide ability). Slows bacterial growth, costs Host Damage, has a cooldown."}, "stance-eat": {"kind": "icon", "size": 48, "radius": null, "note": "Neutrophil stance: Eat (default). Engulf bacteria one at a time."}, "stance-trap": {"kind": "icon", "size": 48, "radius": null, "note": "Neutrophil stance: Trap (one-way). Cells die casting nets that pin bacteria but damage tissue."}, "stance-kill": {"kind": "icon", "size": 48, "radius": null, "note": "Macrophage stance: Kill. Fights hard, adds inflammation."}, "stance-repair": {"kind": "icon", "size": 48, "radius": null, "note": "Macrophage stance: Repair. Heals tissue and calms the sector."}, "marrow": {"kind": "icon", "size": 48, "radius": null, "note": "Bone marrow (production mix). Pair with the neutrophil and macrophage sprites at each end of the slider."}, "meter-pathogen": {"kind": "icon", "size": 48, "radius": null, "note": "Pathogen Load meter icon. Fill the bar in the bacteria magenta."}, "meter-host": {"kind": "icon", "size": 48, "radius": null, "note": "Host Damage meter icon (cracked tissue cell). Fill the bar in damage red."}, "lymph-node": {"kind": "icon", "size": 48, "radius": null, "note": "Lymph node / sample bar. Fills as macrophages eat bacteria; full = antibody choice."}, "choice-opsonize": {"kind": "icon", "size": 48, "radius": null, "note": "Adaptive choice: Opsonize. Macrophages eat tagged bacteria faster, with no extra inflammation."}, "choice-complement": {"kind": "icon", "size": 48, "radius": null, "note": "Adaptive choice: Complement. Punches holes in bacteria directly; adds inflammation."}, "sector-blood": {"kind": "icon", "size": 48, "radius": null, "note": "Sector label: blood entry. Reinforcements arrive here."}, "sector-wound": {"kind": "icon", "size": 48, "radius": null, "note": "Sector label: wound. Where the infection starts."}, "sector-lymph": {"kind": "icon", "size": 48, "radius": null, "note": "Sector label: lymph exit. Samples leave here for the lymph node."}, "scenario-papercut": {"kind": "icon", "size": 48, "radius": null, "note": "Scenario: Papercut (rout). Clear the infection."}, "scenario-pollen": {"kind": "icon", "size": 48, "radius": null, "note": "Scenario: Pollen (restraint). Harmless invader; win by not hurting the host."}, "shot": {"kind": "projectile", "size": 64, "radius": 2.2, "note": "Neutrophil shot: a gold antibody tracer (64x16). Faces +x, head at the anchor. About 14px long on a phone.", "box": [64, 16], "anchor": [54, 8]}, "shot-tuned": {"kind": "projectile", "size": 64, "radius": 3.4, "note": "Tuned shot from inside a Support ring: thicker, white-hot, with a piercing tip. Draw ~1.4x the plain shot.", "box": [64, 16], "anchor": [54, 8]}, "hit-spark": {"kind": "effect", "size": 32, "radius": 14, "note": "Hit spark. Flash for ~80 ms where a shot lands; also the ricochet when a plain shot bounces off armor."}, "kill-shard": {"kind": "particle", "size": 16, "radius": 4, "note": "Kill fragment (16px). On a kill, throw 4-6 outward with random spin and fade over ~0.4 s."}, "bacterium-hit": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium flashed white on a hit. Swap in for ~80 ms and nudge it back along the shot."}, "bacterium-armored": {"kind": "enemy", "size": 64, "radius": 19, "note": "Armored bacterium: the rod inside a thick plated ring. Plain shots bounce off; tuned shots and Offense macrophages kill it."}, "bacterium-armored-dividing": {"kind": "enemy", "size": 64, "radius": 22, "note": "Armored bacterium mid-division (every 20 s). The shell stretches around both halves."}, "macrophage-offense": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage on Offense (v2). Orange core: swallows the nearest bacterium, one every 2 s."}, "macrophage-support": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage on Support (v2). Green core: stays put; pair with support-ring under it."}, "support-ring": {"kind": "field", "size": 128, "radius": 60, "note": "Support macrophage's ring (128 box, edge at 60). Width on screen = ring radius x 128/60. Pulse gently: scale 0.97-1.03 and alpha 0.7-1 over ~1.6 s."}, "speed-trail": {"kind": "effect", "size": 48, "radius": null, "note": "Speed trail behind a boosted neutrophil (48x16). Faces +x; put the anchor on the neutrophil's centre, rotate to its heading, draw before the cell. Height ~ the cell's body diameter.", "box": [48, 16], "anchor": [36, 8]}, "wound-flash": {"kind": "effect", "size": 128, "radius": null, "note": "Toxin warning: stretch over the Wound zone and blink it (about 3 Hz) for the 2 s before a burst."}, "toxin-shockwave": {"kind": "effect", "size": 256, "radius": 118, "note": "Toxin shockwave (256 box, front at 118). Grow from the wound until it covers the zone in ~0.5 s, fade out, shake the screen lightly. Kills your cells it passes."}, "marker-wave": {"kind": "marker", "size": 24, "radius": null, "note": "Progress bar: a wave of bacteria still to come."}, "marker-wave-armored": {"kind": "marker", "size": 24, "radius": null, "note": "Progress bar: a wave of armored bacteria."}, "marker-wave-final": {"kind": "marker", "size": 24, "radius": null, "note": "Progress bar: the final wave (bigger, ringed)."}, "marker-toxin": {"kind": "marker", "size": 24, "radius": null, "note": "Progress bar: a toxin burst in the Wound (diamond)."}, "mode-offense": {"kind": "icon", "size": 48, "radius": null, "note": "Zone chip: Offense. Macrophages here swallow bacteria."}, "mode-support": {"kind": "icon", "size": 48, "radius": null, "note": "Zone chip: Support. Neutrophils in the ring move faster and fire tuned shots."}, "sector-tissue": {"kind": "icon", "size": 48, "radius": null, "note": "Zone label: Tissue (the middle zone)."}, "pause": {"kind": "icon", "size": 48, "radius": null, "note": "Pause button."}, "star": {"kind": "icon", "size": 48, "radius": null, "note": "Win star (earned)."}, "star-empty": {"kind": "icon", "size": 48, "radius": null, "note": "Win star (not earned)."}, "fatigue-fine": {"kind": "icon", "size": 48, "radius": null, "note": "Fatigue tier: Fine. The body is keeping up."}, "fatigue-tired": {"kind": "icon", "size": 48, "radius": null, "note": "Fatigue tier: Tired (hourglass). Every cell moves slower."}, "fatigue-feverish": {"kind": "icon", "size": 48, "radius": null, "note": "Fatigue tier: Feverish (thermometer with heat). Shots spray and neutrophils die sooner."}, "fatigue-exhausted": {"kind": "icon", "size": 48, "radius": null, "note": "Fatigue tier: Exhausted (empty battery). The marrow drops to half speed and Support rings shrink."}, "body-output": {"kind": "icon", "size": 48, "radius": null, "note": "Body output (gauge). Cyan is what the body can sustain; past the orange mark fatigue builds."}},

  _img: {},
  ready: {},  // name -> loaded <img>, filled in as loads finish (the draw helpers below read it)
  // Resolves to an <img> you can drawImage(). Cached per name.
  load(name) {
    if (!this._img[name]) this._img[name] = new Promise((ok, err) => {
      const i = new Image();
      i.onload = () => { this.ready[name] = i; ok(i); }; i.onerror = err;
      i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(this.svg[name]);
    });
    return this._img[name];
  },
  loadAll() {
    return Promise.all(Object.keys(this.svg).map(n => this.load(n))).then(() => this);
  },
  // Pre-render a sprite to an offscreen canvas at a fixed pixel size (fast to blit hundreds of times).
  async sprite(name, px) {
    const img = await this.load(name), c = document.createElement('canvas');
    c.width = c.height = Math.ceil(px * (window.devicePixelRatio || 1));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  },
  // ---- v2 HUD helpers (call after loadAll) ----
  // Lymph node infection timer: a ring that fills red clockwise from 12 o'clock.
  // frac 0..1; beating = bacteria inside the node (adds a double-thump heartbeat); t = seconds, for the pulse.
  drawTimer(ctx, x, y, r, frac, { beating = false, t = 0 } = {}) {
    const red = this.palette.damage, k = beating ? 1 + 0.08 * this._beat(t) : 1, R = r * k;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(3, r * 0.22);
    ctx.strokeStyle = 'rgba(255,59,78,0.18)';
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = Math.max(1, r * 0.06); ctx.strokeStyle = 'rgba(255,59,78,0.45)';
    for (let i = 0; i < 12; i++) {           // tick marks every 1/12
      const a = i / 12 * Math.PI * 2 - Math.PI / 2, i0 = R - r * 0.42, i1 = R - r * 0.3;
      ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * i0, y + Math.sin(a) * i0); ctx.lineTo(x + Math.cos(a) * i1, y + Math.sin(a) * i1); ctx.stroke();
    }
    if (frac > 0) {
      const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * Math.min(1, frac);
      ctx.strokeStyle = red; ctx.lineWidth = Math.max(3, r * 0.22);
      ctx.shadowColor = red; ctx.shadowBlur = r * (beating ? 0.9 : 0.5);
      ctx.beginPath(); ctx.arc(x, y, R, a0, a1); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = '#FFE1E5';
      ctx.beginPath(); ctx.arc(x + Math.cos(a1) * R, y + Math.sin(a1) * R, Math.max(1.5, r * 0.09), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  },
  _beat(t) {  // lub-dub at ~70 bpm, 0..1
    const p = (t * 70 / 60) % 1, b = (c, w) => Math.exp(-(((p - c) / w) ** 2));
    return Math.max(b(0.05, 0.05), 0.6 * b(0.25, 0.05));
  },
  // Level progress bar. frac 0..1; events = [{at: 0..1, kind: 'wave'|'wave-armored'|'wave-final'|'toxin'}].
  // Events already passed dim out; the next one glows.
  drawProgress(ctx, x, y, w, h, frac, events = []) {
    ctx.save();
    const r = h / 2, f = Math.max(0, Math.min(1, frac));
    ctx.fillStyle = 'rgba(221,230,245,0.08)'; ctx.strokeStyle = 'rgba(221,230,245,0.3)'; ctx.lineWidth = 1;
    this._pill(ctx, x, y, w, h, r); ctx.fill(); ctx.stroke();
    if (f > 0) {
      const g = ctx.createLinearGradient(x, 0, x + w * f, 0);
      g.addColorStop(0, 'rgba(63,230,255,0.15)'); g.addColorStop(1, 'rgba(63,230,255,0.55)');
      ctx.fillStyle = g; this._pill(ctx, x, y, Math.max(h, w * f), h, r); ctx.fill();
      ctx.fillStyle = this.palette.cellHi; ctx.fillRect(x + w * f - 1, y - 2, 2, h + 4);
    }
    const next = events.filter(e => e.at > f).sort((a, b) => a.at - b.at)[0];
    for (const e of events) {
      const img = this.ready['marker-' + e.kind]; if (!img) continue;
      const s = h * (e.kind === 'wave-final' ? 2.6 : 2.1) * (e === next ? 1.15 : 1);
      ctx.globalAlpha = e.at <= f ? 0.25 : 1;
      ctx.drawImage(img, x + w * e.at - s / 2, y + h / 2 - s / 2, s, s);
    }
    ctx.restore();
  },
  // ---- v2 round 2: body output and fatigue ----
  fatigueColors: { fine: '#7F8FB0', tired: '#FFD23F', feverish: '#FF7A3D', exhausted: '#FF3B4E' },
  _fm: 0,
  // Fatigue meter as an inline SVG string for the DOM HUD: el.innerHTML = ART.fatigueMeterSVG(g.fatigue, CONFIG.fatigue).
  // Faint bands preview each tier; the fill takes the colour of the band it has reached; a bright edge marks "now".
  fatigueMeterSVG(fatigue, tiers = { tired: 35, feverish: 60, exhausted: 85 }, h = 10) {
    const id = 'fm' + (this._fm++ % 1000), c = this.fatigueColors, f = Math.max(0, Math.min(100, fatigue));
    const t1 = tiers.tired, t2 = tiers.feverish, t3 = tiers.exhausted, r = h / 2;
    const band = (a, b, col, op) => `<rect x="${a}" y="0" width="${b - a}" height="${h}" fill="${col}" fill-opacity="${op}"/>`;
    const tick = x => `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="#04050A" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Fatigue ${Math.round(f)} of 100">`
      + `<defs><clipPath id="${id}c"><rect width="100" height="${h}" rx="${r}" ry="${r}"/></clipPath>`
      + `<linearGradient id="${id}g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">`
      + `<stop offset="${t1 * .8 / 100}" stop-color="${c.fine}"/><stop offset="${t1 / 100}" stop-color="${c.tired}"/>`
      + `<stop offset="${t2 / 100}" stop-color="${c.feverish}"/><stop offset="${t3 / 100}" stop-color="${c.exhausted}"/></linearGradient></defs>`
      + `<g clip-path="url(#${id}c)">${band(0, t1, c.fine, .1)}${band(t1, t2, c.tired, .14)}${band(t2, t3, c.feverish, .17)}${band(t3, 100, c.exhausted, .22)}`
      + (f > 0.5 ? `<rect width="${f}" height="${h}" fill="url(#${id}g)"/><rect x="${Math.max(0, f - .8)}" width=".8" height="${h}" fill="#FFFFFF" fill-opacity=".9"/>` : '')
      + `${tick(t1)}${tick(t2)}${tick(t3)}</g></svg>`;
  },
  // Background for the Body output slider track: cool up to the sustainable point, heating past it.
  // restFrac = where the rest multiplier sits on the slider (0..1), e.g. log(rest/min)/log(max/min).
  outputTrackCSS(restFrac) {
    const p = Math.round(restFrac * 100);
    return `linear-gradient(90deg, rgba(63,230,255,.15) 0%, rgba(63,230,255,.45) ${p}%, #FFD23F ${p}%, #FF7A3D ${Math.round(p + (100 - p) * .5)}%, #FF3B4E 100%)`;
  },
  // Screen-edge glow for Feverish (tier 2) and Exhausted (tier 3). Call last, in view space, with source-over.
  // Feverish: warm orange edges that breathe. Exhausted: thicker red edges with a slow, tired heartbeat and a slight dim.
  drawFatigueEdge(ctx, w, h, tier, t) {
    if (tier < 2) return;
    const ex = tier >= 3, base = Math.min(w, h), d = base * (ex ? 0.2 : 0.16);
    const rgb = ex ? '255,59,78' : '255,122,61';
    const a = ex ? 0.24 + 0.18 * this._beat(t * 50 / 70) : 0.20 + 0.08 * Math.sin(t * Math.PI);

      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.45, `rgba(${rgb},${a * 0.35})`); g.addColorStop(1, `rgba(${rgb},0)`);

    };
    edge(0, 0, 0, d, 0, 0, w, d); edge(0, h, 0, h - d, 0, h - d, w, d);

  },
  _pill(ctx, x, y, w, h, r) {

};

<script>
'use strict';

// Immune RTS prototype v2: simulation. No DOM, so it also runs headless under

//
// World coordinates: u runs along the lymph flow (0 = wound end, L = lymph

// ---------------------------------------------------------------------------

// Every tunable number. The dev panel edits these live; the sim reads them each tick.
const DEFAULTS = {

  stream:     { start: 0.5, end: 1.4, clump: 3, armoredFrom: 90, armoredShare: 0.15 },

  neutrophil: { speed: 46, range: 64, fireEvery: 0.8, life: 30, turnEvery: 0.3, zigzag: 1.5, stray: 0.25, standoff: 36, shotSpeed: 420, spread: 0.35 },
  macrophage: { speed: 20, eatEvery: 2, gulp: 0.45, reach: 11 },

  bacteria:   { hp: 3, doubling: 10, armorDoubling: 20, jitter: 0.25, drift: 10, crowdDrift: 0.12, crowdStart: 25, crowdRadius: 10, crowdMax: 5, knock: 4, hitRadius: 4.5, armorRadius: 6 },

// One line per tunable, shown in the dev panel.
const HINTS = {

  'level.maxBacteria': 'Bacteria stop dividing at this many on the map.',
  'level.startNeut': 'Neutrophils on the field at 0:00.',
  'level.startMac': 'Macrophages on the field at 0:00.',
  'marrow.neutEvery': 'Seconds to make one neutrophil.',
  'marrow.macEvery': 'Seconds to make one macrophage.',
  'neutrophil.speed': 'Units per second (zones are 300 long).',
  'neutrophil.range': 'Firing range. A neutrophil is about 16 units across.',
  'neutrophil.fireEvery': 'Seconds between shots.',
  'neutrophil.life': 'Seconds a neutrophil lives.',
  'neutrophil.turnEvery': 'Seconds between zigzag turns.',
  'neutrophil.zigzag': 'How far each turn can veer off the target line (radians).',
  'neutrophil.stray': 'Chance each turn heads somewhere completely random instead.',
  'neutrophil.standoff': 'Neutrophils stop closing in at about this distance.',

  'macrophage.gulp': 'Seconds a swallow takes.',
  'macrophage.reach': 'How close it must get to swallow.',
  'support.ring': 'Radius of a Support macrophage ring.',
  'support.speedMul': 'Speed multiplier for neutrophils inside a ring.',
  'bacteria.hp': 'Plain hits to kill a bacterium (tuned shots always kill).',
  'bacteria.doubling': 'Seconds for a bacterium to divide while it has room.',

  'bacteria.crowdDrift': 'Extra drift per bacterium in a zone beyond crowd start (spill-over).',
  'bacteria.crowdStart': 'Zone count where crowding starts pushing bacteria onward.',

  'bacteria.crowdMax': 'A bacterium will not divide with this many neighbours.',

  'bacteria.hitRadius': 'How close a shot must pass to hit a plain bacterium.',

  'toxin.warn': 'Seconds the Wound flashes red before a burst.',
  'toxin.notice': 'Seconds before a burst that the banner starts counting down.',
  'toxin.sweep': 'Seconds for the toxin wave to cross the Wound.',
  'lymph.fill': 'Seconds of bacteria in the Lymph node before you lose. Holds while it is clear.',

// Scripted levels. Waves: b = bacteria, a = armored bacteria. Toxins are fractions of the level.
const LEVELS = {
  papercut: {
    name: 'Papercut',
    // Doc schedule with counts scaled up after balance runs, plus two small filler waves (0:50, 3:40)
    waves: [{ t: 0, b: 40 }, { t: 50, b: 30 }, { t: 90, a: 26, b: 24 }, { t: 150, b: 80 }, { t: 220, b: 40 }, { t: 255, b: 80, a: 28, final: true }],
    toxins: [1 / 3, 2 / 3],
  },
};

const clone = o => JSON.parse(JSON.stringify(o));
let CONFIG = clone(DEFAULTS);
function mergeConfig(saved) {
  if (!saved || typeof saved !== 'object') return;
  for (const g in saved) {
    if (!CONFIG[g]) continue;
    for (const k in saved[g]) if (k in DEFAULTS[g] && typeof saved[g][k] === 'number') CONFIG[g][k] = saved[g][k];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Map: three zones of 300 along the flow; the blood vessel is a strip along v < VESSEL.
const L = 900, WIDTH = 460, ZONE = 300, VESSEL = 44;
const ZONES = ['Wound', 'Tissue', 'Lymph node'];
const zoneOf = u => (u < ZONE ? 0 : u < 2 * ZONE ? 1 : 2);
const WOUND = { u: 70, v: 270 }; // where waves spill in and toxins burst from
// Support/Offense posts inside a zone, in fill order (fractions of zone length / field width)
const POSTS = [[0.5, 0.5], [0.3, 0.3], [0.7, 0.72], [0.3, 0.75], [0.7, 0.28], [0.5, 0.15], [0.5, 0.88]];

class Game {
  constructor(levelKey, seed) {
    this.key = levelKey || 'papercut';
    this.lv = LEVELS[this.key];
    this.seed = seed || 1;
    this.rand = mulberry32(this.seed * 9973 + 17);
    this.t = 0;
    this.bact = []; this.neut = []; this.mac = []; this.shots = [];
    this.fx = []; // visual events for the UI: {k, u, v, ...}
    this.zones = ZONES.map(name => ({ name, mode: 'offense', count: 0 }));
    this.marrow = { make: 'neut', prog: 0 };
    this.lymph = { timer: 0, peak: 0, reached: false, beat: 0 };
    this.waveIdx = 0; this.streamAcc = 0;
    this.output = CONFIG.output.start; this.fatigue = 0; this.tier = 0; this.fatiguePeak = 0; this.tierTime = [0, 0, 0, 0];
    this.toxins = this.lv.toxins.map(f => ({ at: f * CONFIG.level.duration, state: 'coming', front: 0 }));
    this.stats = { shotKills: 0, swallows: 0, made: 0, toxinDeaths: 0, peak: 0, bounced: 0 };
    this.history = []; this.histT = 0;
    this.result = null;
    this.id = 1;
    for (let i = 0; i < CONFIG.level.startNeut; i++) this.spawnNeut(60 + this.rand() * 300, VESSEL + 30 + this.rand() * 120);
    for (let i = 0; i < CONFIG.level.startMac; i++) this.spawnMac(true);
    this.runWaves();
  }

  // ---- player actions ----
  setMarrow(kind) { if (kind === 'neut' || kind === 'mac') { if (kind !== this.marrow.make) this.marrow.prog = 0; this.marrow.make = kind; } }
  toggleZone(z) { const zn = this.zones[z]; if (zn) zn.mode = zn.mode === 'offense' ? 'support' : 'offense'; }
  setZone(z, mode) { if (this.zones[z]) this.zones[z].mode = mode; }
  setOutput(x) { this.output = Math.max(0, Math.min(1, +x || 0)); }
  // Marrow speed multiplier from the slider (geometric between min and max, 1x in the middle by default)
  outputMul() { const O = CONFIG.output; return O.min * Math.pow(O.max / O.min, this.output); }
  // 0 fine, 1 Tired, 2 Feverish, 3 Exhausted
  fatigueTier() { const F = CONFIG.fatigue, f = this.fatigue; return f >= F.exhausted ? 3 : f >= F.feverish ? 2 : f >= F.tired ? 1 : 0; }
  // The toxin about to hit (inside its notice window) or mid-sweep, if any
  pendingToxin() {
    for (const tx of this.toxins) {
      if (tx.state === 'sweeping') return tx;
      if (tx.state === 'coming' && this.t >= tx.at - CONFIG.toxin.notice) return tx;
    }
    return null;
  }

  // ---- spawning ----
  spawnNeut(u, v) {
    this.neut.push({ id: this.id++, u, v, vu: 0, vv: 0, head: Math.PI / 2, turn: 0, cd: this.rand() * 0.5, age: 0, boosted: false, dead: false });
  }
  spawnMac(start) {
    // New macrophages take the zone with the fewest; ties go to the earlier zone
    const n = [0, 0, 0]; for (const m of this.mac) n[m.home]++;
    let home = 0; for (let z = 1; z < 3; z++) if (n[z] < n[home]) home = z;
    const slot = n[home] % POSTS.length;
    const pu = home * ZONE + POSTS[slot][0] * ZONE, pv = VESSEL + POSTS[slot][1] * (WIDTH - VESSEL);
    const u = start ? pu : Math.min(L - 20, Math.max(20, pu + (this.rand() - 0.5) * 80)), v = start ? pv : VESSEL * 0.5;
    this.mac.push({ id: this.id++, u, v, home, pu, pv, mode: 'offense', cd: 0, gulp: 0, prey: null, dead: false, flip: 0 });
  }
  spawnBact(armored, u, v) {
    if (this.bact.length >= CONFIG.level.maxBacteria + 140) return;
    const r = this.rand;
    this.bact.push({
      id: this.id++, armored: !!armored,
      u: u == null ? WOUND.u + (r() - 0.5) * 90 : u, v: v == null ? WOUND.v + (r() - 0.5) * 180 : v,
      hp: armored ? 1 : CONFIG.bacteria.hp, age: 0, div: this.divTime(armored), flash: 0, rot: r() * 6.283, dead: false, eaten: false,
    });
  }
  divTime(armored) { return (armored ? CONFIG.bacteria.armorDoubling : CONFIG.bacteria.doubling) * (1 + (this.rand() - 0.5) * 2 * CONFIG.bacteria.jitter); }

  runWaves() {
    const w = this.lv.waves;
    while (this.waveIdx < w.length && this.t >= w[this.waveIdx].t) {
      const wave = w[this.waveIdx++];
      for (let i = 0; i < (wave.b || 0); i++) this.spawnBact(false);
      for (let i = 0; i < (wave.a || 0); i++) this.spawnBact(true);
      this.fx.push({ k: 'wave', u: WOUND.u, v: WOUND.v, n: (wave.b || 0) + (wave.a || 0), armored: wave.a || 0, final: !!wave.final });
    }
  }
  // Progress-bar markers still to come: {t, kind: 'wave'|'toxin', final}
  markers() {
    const out = [];
    for (let i = this.waveIdx; i < this.lv.waves.length; i++) out.push({ t: this.lv.waves[i].t, kind: 'wave', final: !!this.lv.waves[i].final, armored: !!this.lv.waves[i].a });
    for (const tx of this.toxins) if (tx.state === 'coming') out.push({ t: tx.at, kind: 'toxin' });
    return out;
  }

  // ---- queries ----
  liveBact() { return this.bact.filter(b => !b.dead && !b.eaten); }
  nearestBact(u, v, maxD, filter) {
    let best = null, bd = maxD * maxD;
    for (const b of this.bact) {
      if (b.dead || b.eaten || (filter && !filter(b))) continue;
      const d = (b.u - u) ** 2 + (b.v - v) ** 2;
      if (d < bd) { bd = d; best = b; }
    }
    return best;
  }
  inRing(u, v) {
    const r2 = (this.ringR || CONFIG.support.ring) ** 2;
    for (const m of this.mac) if (!m.dead && m.mode === 'support' && (m.u - u) ** 2 + (m.v - v) ** 2 < r2) return true;
    return false;
  }
  cellCount() { return this.neut.length + this.mac.length; }

  // ---- tick ----
  step(dt) {
    if (this.result) return;
    const C = CONFIG, r = this.rand;
    this.t += dt;
    const t = this.t;
    if (this.fx.length > 400) this.fx.splice(0, this.fx.length - 400);

    // Script: waves, trickle, toxins
    this.runWaves();
    // Constant stream through the Wound between the big waves, ramping up over the level
    if (t < C.level.duration) {
      const f = t / C.level.duration;
      this.streamAcc += dt * (C.stream.start + (C.stream.end - C.stream.start) * f);
      while (this.streamAcc >= 1) {
        const n = Math.max(1, Math.min(Math.floor(this.streamAcc), 1 + Math.floor(r() * C.stream.clump)));
        this.streamAcc -= n;
        const cu = WOUND.u + (r() - 0.5) * 60, cv = WOUND.v + (r() - 0.5) * 160;
        for (let i = 0; i < n; i++) this.spawnBact(t >= C.stream.armoredFrom && r() < C.stream.armoredShare, cu + (r() - 0.5) * 12, cv + (r() - 0.5) * 12);
        this.fx.push({ k: 'trickle', u: cu, v: cv });
      }
    }

    // Body output and fatigue: pushing the marrow past what the body can sustain builds fatigue
    const mul = this.outputMul(), O = C.output, F = C.fatigue;
    this.fatigue += (mul > O.rest ? (mul - O.rest) * O.tire : (mul - O.rest) * O.recover) * dt;
    this.fatigue = Math.max(0, Math.min(100, this.fatigue));
    this.fatiguePeak = Math.max(this.fatiguePeak, this.fatigue);
    const tier = this.fatigueTier();
    if (tier !== this.tier) { this.fx.push({ k: 'tier', tier, up: tier > this.tier }); this.tier = tier; }
    this.tierTime[tier] += dt;
    const slow = tier >= 1 ? F.tiredSpeed : 1;
    this.ringR = C.support.ring * (tier >= 3 ? F.exhaustedRing : 1);
    for (const tx of this.toxins) {
      if (tx.state === 'coming' && t >= tx.at) { tx.state = 'sweeping'; tx.front = 0; this.fx.push({ k: 'burst', u: WOUND.u, v: WOUND.v }); }
      if (tx.state === 'sweeping') {
        tx.front += dt / C.toxin.sweep;
        const reach = tx.front * 340; // radius from the wound that covers the whole zone
        const kill = c => c.u < ZONE && Math.hypot(c.u - WOUND.u, c.v - WOUND.v) < reach;
        for (const c of this.neut) if (!c.dead && kill(c)) { c.dead = true; this.stats.toxinDeaths++; this.fx.push({ k: 'die', u: c.u, v: c.v, who: 'neut' }); }
        for (const c of this.mac) if (!c.dead && kill(c)) { c.dead = true; this.stats.toxinDeaths++; if (c.prey) c.prey.eaten = false, c.prey = null; this.fx.push({ k: 'die', u: c.u, v: c.v, who: 'mac' }); }
        if (tx.front >= 1) tx.state = 'done';
      }
    }
    const warnTx = this.toxins.find(tx => tx.state === 'coming' && t >= tx.at - C.toxin.warn);
    this.warning = warnTx ? (warnTx.at - t) : 0;

    // Marrow: a steady flow of the chosen cell, held at the cap
    const every = this.marrow.make === 'neut' ? C.marrow.neutEvery : C.marrow.macEvery;
    if (this.cellCount() < C.level.cellCap) {
      this.marrow.prog += dt / every * mul * (tier >= 3 ? F.exhaustedMarrow : 1);
      if (this.marrow.prog >= 1) {
        this.marrow.prog = 0; this.stats.made++;
        if (this.marrow.make === 'neut') { const u = 40 + r() * (L - 80); this.spawnNeut(u, VESSEL * 0.5); this.fx.push({ k: 'arrive', u, v: VESSEL * 0.5 }); }
        else { this.spawnMac(false); const m = this.mac[this.mac.length - 1]; this.fx.push({ k: 'arrive', u: m.u, v: m.v }); }
      }
    } else this.marrow.prog = Math.min(1, this.marrow.prog);

    // Macrophages: mode comes from the zone they stand in
    for (const m of this.mac) {
      if (m.dead) continue;
      const mode = this.zones[zoneOf(m.u)].mode;
      if (mode !== m.mode) { m.mode = mode; m.flip = 0.4; if (mode === 'support' && m.prey) { m.prey.eaten = false; m.prey = null; m.gulp = 0; } }
      m.flip = Math.max(0, m.flip - dt);
      m.cd = Math.max(0, m.cd - dt);
      let tu = m.pu, tv = m.pv, sp = C.macrophage.speed * slow;
      if (m.gulp > 0) {
        m.gulp -= dt;
        if (m.prey) { m.prey.u += (m.u - m.prey.u) * Math.min(1, dt * 8); m.prey.v += (m.v - m.prey.v) * Math.min(1, dt * 8); }
        if (m.gulp <= 0 && m.prey) { m.prey.dead = true; m.prey = null; this.stats.swallows++; m.cd = C.macrophage.eatEvery; }
        sp = 0;
      } else if (m.mode === 'offense' && m.cd <= 0) {
        const lo = m.home * ZONE - 10, hi = (m.home + 1) * ZONE + 10;
        const b = this.nearestBact(m.u, m.v, 400, b => b.u >= lo && b.u < hi);
        if (b) {
          tu = b.u; tv = b.v;
          if (Math.hypot(b.u - m.u, b.v - m.v) < C.macrophage.reach) { m.prey = b; b.eaten = true; m.gulp = C.macrophage.gulp; this.fx.push({ k: 'gulp', id: m.id, u: m.u, v: m.v }); sp = 0; }
        }
      }
      const du = tu - m.u, dv = tv - m.v, d = Math.hypot(du, dv);
      if (d > 1 && sp > 0) { const s = Math.min(d, sp * dt); m.u += du / d * s; m.v += dv / d * s; }
    }

    // Neutrophils: directed random walk toward the nearest bacterium, shooting anything in range
    for (const n of this.neut) {
      if (n.dead) continue;
      n.age += dt;
      if (n.age >= C.neutrophil.life * (tier >= 2 ? F.feverLife : 1)) { n.dead = true; this.fx.push({ k: 'expire', u: n.u, v: n.v }); continue; }
      n.boosted = this.inRing(n.u, n.v);
      const target = this.nearestBact(n.u, n.v, 2000);
      n.turn -= dt;
      if (n.turn <= 0) {
        n.turn = C.neutrophil.turnEvery * (0.6 + r() * 0.8);
        let want;
        if (target) {
          const d = Math.hypot(target.u - n.u, target.v - n.v);
          want = Math.atan2(target.v - n.v, target.u - n.u);
          if (d < C.neutrophil.standoff) want += Math.PI / 2 * (r() < 0.5 ? 1 : -1); // circle instead of crowding in
        } else {
          // Nothing to chase: drift toward the middle of the field
          want = Math.atan2(WIDTH * 0.55 - n.v, L * 0.45 - n.u) + (r() - 0.5) * 2;
        }
        // Directed random walk: veer off the line each turn, and sometimes just wander off
        n.head = r() < C.neutrophil.stray ? r() * 6.283 : want + C.neutrophil.zigzag * (r() * 2 - 1);
      }
      let sp = C.neutrophil.speed * slow * (n.boosted ? C.support.speedMul : 1);
      n.vu += (Math.cos(n.head) * sp - n.vu) * Math.min(1, dt * 6);
      n.vv += (Math.sin(n.head) * sp - n.vv) * Math.min(1, dt * 6);
      n.u = Math.max(8, Math.min(L - 8, n.u + n.vu * dt));
      n.v = Math.max(VESSEL * 0.3, Math.min(WIDTH - 8, n.v + n.vv * dt));
      if (n.v < VESSEL && n.vv < 0) n.vv *= -0.5;
      // Fire: prefer a target the shot can hurt
      n.cd -= dt;
      if (n.cd <= 0) {
        const can = n.boosted ? null : b => !b.armored;
        const aim = this.nearestBact(n.u, n.v, C.neutrophil.range, can) || this.nearestBact(n.u, n.v, C.neutrophil.range);
        if (aim) {
          n.cd = C.neutrophil.fireEvery;
          const d = Math.hypot(aim.u - n.u, aim.v - n.v), tt = d / C.neutrophil.shotSpeed;
          const au = aim.u + C.bacteria.drift * tt, av = aim.v;
          const a = Math.atan2(av - n.v, au - n.u) + (r() - 0.5) * 2 * (C.neutrophil.spread + (tier >= 2 ? F.feverSpread : 0));
          this.shots.push({ u: n.u, v: n.v, pu: n.u, pv: n.v, du: Math.cos(a), dv: Math.sin(a), life: C.neutrophil.range * 1.4 / C.neutrophil.shotSpeed, tuned: n.boosted, from: n.id });
        } else n.cd = 0.05;
      }
    }

    // Shots: straight tracers; the first bacterium touched takes the hit
    for (const s of this.shots) {

  finish(win, reason) {

      { text: 'Clear every bacterium', hit: win },
      { text: 'Lymph node timer never passed half', hit: win && this.lymph.peak <= 0.5 },

  // Tissue, vessel and the wound: one offscreen image in view space

    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (flashT > 0) { ctx.fillStyle = `rgba(180,92,255,${flashT * 0.6})`; ctx.fillRect(zr[0], zr[1], zr[2], zr[3]); }
    // Fatigue: edge glow, orange and breathing when Feverish, red heartbeat when Exhausted
    ART.drawFatigueEdge(ctx, VW, VH, g.tier, ts);
    ctx.restore();

    if (paused && !modal) {
      ctx.fillStyle = 'rgba(4,5,10,0.55)'; ctx.fillRect(0, 0, VW, VH);
      ctx.fillStyle = PAL.ui; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `600 ${22 / scale}px ${getComputedStyle(document.body).getPropertyValue('--display')}`;
      ctx.fillText('Paused', VW / 2, VH / 2);
    }
  }

  // View-space rect [x, y, w, h] of a zone (below the vessel)
  function zoneRect(z) {
    const [x0, y0] = P(z * ZONE, VESSEL), [x1, y1] = P((z + 1) * ZONE, WIDTH);
    return [Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0)];
  }
  const FONT = '"Instrument Sans", "Helvetica Neue", Arial, sans-serif', MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  const ZONE_ICON = ['sector-wound', 'sector-tissue', 'sector-lymph'];
  // Per-zone readouts: name, big bacteria count, mode chip; the Lymph node also gets its timer ring
  function zoneLayer(g, ts) {
    const px = 1 / scale;
    ctx.textBaseline = 'middle';
    for (let z = 0; z < 3; z++) {
      const [x, y, w, h] = zoneRect(z), zn = g.zones[z], cx = x + w / 2;
      // name
      ctx.globalAlpha = 0.9; ctx.textAlign = 'left';
      const ic = img[ZONE_ICON[z]];
      if (ic) ctx.drawImage(ic, x + 8 * px, y + 6 * px, 18 * px, 18 * px);
      ctx.fillStyle = PAL.ui; ctx.font = `600 ${13 * px}px ${FONT}`;
      ctx.fillText(zn.name, x + 30 * px, y + 15 * px);
      // big count, under the name and out of the way of the macrophage posts
      const n = zn.count;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.font = `600 ${36 * px}px ${FONT}`;
      ctx.globalAlpha = n ? 0.85 : 0.22; ctx.fillStyle = n ? PAL.germHi : PAL.ui;
      ctx.fillText(String(n), x + 10 * px, y + 62 * px);
      const nw = ctx.measureText(String(n)).width;
      ctx.font = `500 ${11 * px}px ${MONO}`; ctx.globalAlpha = n ? 0.7 : 0.3; ctx.fillStyle = PAL.ui;
      ctx.fillText(n === 1 ? 'bacterium' : 'bacteria', x + 16 * px + nw, y + 60 * px);
      ctx.textBaseline = 'middle';
      // mode chip (tap target is the whole zone)
      const sup = zn.mode === 'support', col = sup ? PAL.repair : PAL.kill;
      const cw = 96 * px, ch = 26 * px, chx = cx - cw / 2, chy = y + h - ch - 10 * px;
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(10,13,24,0.85)'; ctx.strokeStyle = col; ctx.lineWidth = 1.5 * px;
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(chx, chy, cw, ch, ch / 2); else ctx.rect(chx, chy, cw, ch);
      ctx.fill(); ctx.stroke();
      const mi = img[sup ? 'mode-support' : 'mode-offense'];
      if (mi) ctx.drawImage(mi, chx + 6 * px, chy + 4 * px, 18 * px, 18 * px);
      ctx.fillStyle = col; ctx.font = `600 ${12.5 * px}px ${FONT}`; ctx.textAlign = 'left';
      ctx.fillText(sup ? 'Support' : 'Offense', chx + 28 * px, chy + ch / 2 + 0.5 * px);
      // lymph node timer
      if (z === 2) {
        const r = 20 * px, tx = x + w - r - 14 * px, ty = y + r + 12 * px;
        ART.drawTimer(ctx, tx, ty, r, g.lymph.timer, { beating: n > 0, t: ts });
        ctx.fillStyle = g.lymph.timer > 0 ? '#FFB3BC' : PAL.uiDim; ctx.font = `500 ${10.5 * px}px ${MONO}`; ctx.textAlign = 'center';
        ctx.fillText(`${Math.round(g.lymph.timer * CONFIG.lymph.fill)}/${CONFIG.lymph.fill}s`, tx, ty + r + 13 * px);
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---- progress bar ----
  function levelEvents(g) {
    const D = CONFIG.level.duration, ev = [];
    for (const w of g.lv.waves) if (w.t > 0) ev.push({ at: w.t / D, kind: w.final ? 'wave-final' : w.a ? 'wave-armored' : 'wave' });
    for (const tx of g.toxins) ev.push({ at: tx.at / D, kind: 'toxin' });
    return ev;
  }
  function drawProg() {

    if (!game) return;
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = w / dpr, H = h / dpr, bh = 10, pad = 14;
    ART.drawProgress(pctx, pad, (H - bh) / 2, W - pad * 2, bh, Math.min(1, game.t / CONFIG.level.duration), levelEvents(game));
  }

  // ---- HUD ----
  function nextEventText(g) {

    } else if (g.tier >= 2) {

    } else if (cells >= cap) {

    } else if (g.t >= CONFIG.level.duration) {

  function drawGraph() {
    const c = $('#graph'), r = c.getBoundingClientRect(), k = Math.min(3, window.devicePixelRatio || 1);
    c.width = r.width * k; c.height = r.height * k;
    const g = c.getContext('2d'); g.scale(k, k);
    const W = r.width, H = r.height, padL = 26, padB = 16, h = game.history;
    const T = Math.max(CONFIG.level.duration, game.t), maxY = Math.max(10, ...h.map(p => Math.max(...p.z)));
    const X = t => padL + (W - padL - 4) * t / T, Y = v => (H - padB) - (H - padB - 6) * v / maxY;
    g.font = `10px ${MONO}`; g.fillStyle = PAL.uiDim; g.strokeStyle = 'rgba(221,230,245,0.12)'; g.lineWidth = 1;
    g.textAlign = 'right'; g.textBaseline = 'middle';
    for (const v of [0, Math.round(maxY / 2), maxY]) { g.beginPath(); g.moveTo(padL, Y(v)); g.lineTo(W, Y(v)); g.stroke(); g.fillText(v, padL - 4, Y(v)); }
    g.textAlign = 'center'; g.textBaseline = 'top';
    for (let t = 0; t <= T; t += 60) { g.textAlign = X(t) > W - 20 ? 'right' : 'center'; g.fillText(fmt(t), Math.min(X(t), W), H - padB + 3); }
    g.fillStyle = 'rgba(180,92,255,0.5)';
    for (const tx of game.toxins) g.fillRect(X(tx.at) - 1, 4, 2, H - padB - 4);
    [PAL.germ, PAL.antibody, PAL.damage].forEach((col, z) => {
      g.strokeStyle = col; g.lineWidth = 2; g.lineJoin = 'round'; g.beginPath();
      h.forEach((p, i) => (i ? g.lineTo : g.moveTo).call(g, X(p.t), Y(p.z[z])));
      g.stroke();
    });
  }

  // ---- game flow ----
  function newGame() {
    game = new Game('papercut', seed);
    paused = false; acc = 0; endShown = false; parts = []; shake = 0; flashT = 0; gulps.clear();
    $('#pauseBtn').setAttribute('aria-label', 'Pause');
    hud();
  }

  let hudT = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
    if (game && !paused && !modal && !game.result) {
      acc += dt * SPEEDS[speedIdx];
      let n = 0;
      while (acc >= STEP && n < 16) { game.step(STEP); acc -= STEP; n++; }
      if (n === 16) acc = 0;
    }
    if (game) {
      consumeFx();
      const pdt = paused || modal ? 0 : dt * SPEEDS[speedIdx];
      for (const p of parts) { p.life -= pdt; p.u += p.vu * pdt; p.v += p.vv * pdt; p.vu *= 0.92; p.vv *= 0.92; if (p.vr) p.rot += p.vr * pdt; }
      if (parts.length) parts = parts.filter(p => p.life > 0);
      shake = Math.max(0, shake - pdt * 2.5); flashT = Math.max(0, flashT - pdt);
      if (game.result && !endShown) { hud(); setTimeout(showEnd, 700); endShown = true; }
    }
    render(now);
    drawProg();
    hudT -= dt;
    if (hudT <= 0) { hudT = 0.1; hud(); }
    requestAnimationFrame(frame);
  }

  // ---- input ----
  function tapZone(z) {
    if (!game || game.result) return;
    game.toggleZone(z);
    const zn = game.zones[z];
    toast(`${zn.name}: ${zn.mode === 'support' ? 'Support' : 'Offense'}`, zn.mode === 'support' ? 'good' : '');
    hud();
  }
  cv.addEventListener('pointerdown', e => {
    if (!game || modal) return;
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left - ox) / scale, y = (e.clientY - r.top - oy) / scale;
    if (x < 0 || y < 0 || x > VW || y > VH) return;
    const u = portrait ? y : x;
    tapZone(zoneOf(u));
  });
  function setPaused(p) {
    paused = p; $('#pauseBtn').setAttribute('aria-label', paused ? 'Resume' : 'Pause');
    $('#devPause').textContent = paused ? 'Resume' : 'Pause';
  }
  $('#pauseBtn').addEventListener('click', () => setPaused(!paused));
  $('#marrowSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !game) return;
    game.setMarrow(b.dataset.make); hud();
  });
  $('#output').addEventListener('input', e => { if (game) { game.setOutput(+e.target.value / 100); hud(); } });
  $('#helpBtn').addEventListener('click', () => { if (modal === 'guide') return; if (!modal) showGuide('game', 'units'); });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === ' ') { e.preventDefault(); if (!modal) setPaused(!paused); }
    if (!game || modal) return;
    if (e.key >= '1' && e.key <= '3') tapZone(+e.key - 1);
    if (e.key === 'n' || e.key === 'N') game.setMarrow('neut');
    if (e.key === 'm' || e.key === 'M') game.setMarrow('mac');
    if (e.key === '-' || e.key === '_') game.setOutput(game.output - 0.1);
    if (e.key === '=' || e.key === '+') game.setOutput(game.output + 0.1);
  });

  // ---- dev tools ----
  $('#devBtn').addEventListener('click', () => { $('#dev').hidden = !$('#dev').hidden; });
  $('#devClose').addEventListener('click', () => { $('#dev').hidden = true; });
  $('#speed').addEventListener('input', e => { speedIdx = +e.target.value; $('#speedVal').textContent = `${SPEEDS[speedIdx]}×`; hud(); });
  $('#devPause').addEventListener('click', () => setPaused(!paused));
  $('#devStep').addEventListener('click', () => { if (game && !game.result) for (let i = 0; i < 60; i++) game.step(STEP); });
  $('#devSkip').addEventListener('click', () => { if (game && !game.result) for (let i = 0; i < 900 && !game.result; i++) game.step(STEP); });
  $('#seed').addEventListener('change', e => { seed = Math.max(1, Math.floor(+e.target.value || 1)); store.set('immuneRtsV2.seed', seed); });
  $('#devRestart').addEventListener('click', () => { closeModal(); newGame(); });
  $('#devNewSeed').addEventListener('click', () => { seed = 1 + Math.floor(Math.random() * 9999); $('#seed').value = seed; store.set('immuneRtsV2.seed', seed); closeModal(); newGame(); });
  $('#cheatBact').addEventListener('click', () => { if (game) for (let i = 0; i < 10; i++) game.spawnBact(false); });
  $('#cheatArmor').addEventListener('click', () => { if (game) for (let i = 0; i < 4; i++) game.spawnBact(true); });
  $('#cheatClear').addEventListener('click', () => { if (game) for (const b of game.bact) if (!b.eaten) { b.dead = true; game.fx.push({ k: 'pop', u: b.u, v: b.v }); } });
  $('#ovRange').addEventListener('change', e => { overlay.range = e.target.checked; });
  $('#ovRotate').addEventListener('change', e => { overlay.portrait = e.target.checked; resize(); });

  const human = k => k.replace(/([A-Z])/g, ' $1').toLowerCase();
  function stepFor(v) { const a = Math.abs(v); return a === 0 ? 0.001 : Math.pow(10, Math.floor(Math.log10(a)) - 1); }
  function buildTuning() {
    const host = $('#tuning'); host.innerHTML = '';
    for (const grp in DEFAULTS) {
      const det = document.createElement('details');
      det.innerHTML = `<summary>${human(grp)}</summary>`;
      for (const key in DEFAULTS[grp]) {
        const def = DEFAULTS[grp][key], id = `t-${grp}-${key}`;
        const f = document.createElement('div'); f.className = 'field';
        f.innerHTML = `<label class="row" for="${id}"><span>${human(key)}</span><input type="number" id="${id}" step="${stepFor(def)}"></label>`;
        const hint = HINTS[`${grp}.${key}`];
        if (hint) f.insertAdjacentHTML('beforeend', `<small>${hint}</small>`);
        det.appendChild(f);
        const inp = f.querySelector('input');
        inp.value = CONFIG[grp][key];
        const mark = () => inp.classList.toggle('changed', +inp.value !== def);
        mark();
        inp.addEventListener('input', () => {
          const v = parseFloat(inp.value); if (!isFinite(v)) return;
          CONFIG[grp][key] = v; mark(); saveTuning();
          if (grp === 'support') buildGraphics();
        });
      }
      host.appendChild(det);
    }
  }
  function tuningDiff() {
    const out = {};
    for (const g in DEFAULTS) for (const k in DEFAULTS[g]) if (DEFAULTS[g][k] !== CONFIG[g][k]) (out[g] = out[g] || {})[k] = CONFIG[g][k];
    return out;
  }
  function saveTuning() { store.set('immuneRtsV2.tuning', tuningDiff()); }
  $('#tuneReset').addEventListener('click', () => {
    for (const g in DEFAULTS) for (const k in DEFAULTS[g]) CONFIG[g][k] = DEFAULTS[g][k];
    saveTuning(); buildTuning(); buildGraphics();
  });
  $('#tuneCopy').addEventListener('click', () => {
    const txt = JSON.stringify(tuningDiff(), null, 1), ta = $('#devJson');
    ta.value = txt; ta.hidden = false;
    const fallback = () => { ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Tuning copied'), fallback); } catch (e) { fallback(); }
  });

  // ---- boot ----
  document.querySelectorAll('img[data-art]').forEach(i => { i.src = artUrl(i.dataset.art); });
  buildTuning();
  $('#seed').value = seed;
  // Slider track: cool up to the sustainable output, heating past it
  { const O = CONFIG.output; $('#output').style.setProperty('--track', ART.outputTrackCSS(Math.log(O.rest / O.min) / Math.log(O.max / O.min))); }
  ART.loadAll().then(() => {
    Object.assign(img, ART.ready);
    resize();
    new ResizeObserver(resize).observe(stage);
  });
  newGame();
  showStart();
  requestAnimationFrame(frame);
})();

</script>
