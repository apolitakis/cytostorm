<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cytostorm v3 (tuner settings)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* v3 layout: progress bar on top, the three-zone map in the middle, per-zone production cards and controls at the bottom.
   Deliberately single-theme: the art is fluorescence microscopy, glowing cells on black. */
:root {
  color-scheme: dark;
  --void: #04050A;
  --panel: #0A0D18;
  --panel2: #10152A;
  --line: #1E2540;
  --ink: #DDE6F5;
  --dim: #7A86A0;
  --cell: #3FE6FF;
  --germ: #FF3DCB;
  --gold: #FFD23F;
  --kill: #FF7A3D;
  --repair: #5CFFA1;
  --damage: #FF3B4E;
  --toxin: #B45CFF;
  --display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--void); color: var(--ink); }
body { margin: 0; font: 14px/1.4 var(--display); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img.ico { width: 18px; height: 18px; flex: none; }

#app { height: 100%; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; padding-inline: 16px; box-sizing: border-box; }

/* HUD */
#hud { display: grid; gap: 4px; padding-block: 8px 2px; min-width: 0; }
.hudrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
#prog { flex: 1; min-width: 0; height: 30px; display: block; }
#clock { flex: none; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; color: var(--dim); min-width: 2.8em; text-align: right; }
.hbtn { flex: none; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font: 500 12px var(--mono); min-width: 34px; height: 30px; box-sizing: border-box; }
.hbtn img { width: 16px; height: 16px; }
#speedTag { font: 500 12px var(--mono); color: var(--gold); }
/* Fatigue meter: fills as the body overworks; ticks at each tier */
.fatigue { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--dim); min-width: 0; }
.fatigue > span:first-child { flex: none; }
.ftrack { flex: 1; min-width: 40px; height: 10px; display: flex; }
.ftrack svg { display: block; }
#fIcon { width: 18px; height: 18px; flex: none; }
#fTier { flex: none; min-width: 5.4em; font: 600 11.5px var(--display); color: var(--dim); text-align: right; }
.fatigue[data-tier="1"] #fTier { color: var(--gold); }
.fatigue[data-tier="2"] #fTier { color: var(--kill); }
.fatigue[data-tier="3"] #fTier { color: var(--damage); }
#banner { min-height: 2.7em; font-size: 12.5px; line-height: 1.35; color: var(--dim); text-wrap: pretty; }
#banner b { color: var(--ink); font-weight: 600; }
#banner.alarm b { color: var(--toxin); }
#banner.bad b { color: var(--damage); }

/* Stage */
#stage { position: relative; flex: 1; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#toasts { position: absolute; left: 0; right: 0; bottom: 48px; display: grid; justify-items: center; gap: 4px; pointer-events: none; }
.toast { background: rgba(10, 13, 24, .9); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; animation: toast 2.2s ease forwards; }
.toast.bad { border-color: var(--damage); }
.toast.good { border-color: var(--gold); }
.toast.toxin { border-color: var(--toxin); }
@keyframes toast { 0% { opacity: 0; transform: translateY(6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* Bottom controls: marrow switch, pause */
#bar { display: flex; align-items: stretch; gap: 8px; padding-block: 6px 10px; min-width: 0; }
.mlabel { display: grid; gap: 2px; font-size: 12px; color: var(--dim); white-space: nowrap; }
.mlabel b { color: var(--ink); font: 600 12.5px var(--display); }
.mlabel span { font: 500 11px var(--mono); font-variant-numeric: tabular-nums; }
/* Production cards: one per zone, a stacked bar of the mix */
.zones { flex: 1.4 1 0; min-width: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.zcard { min-width: 0; display: grid; gap: 4px; align-content: center; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.zcard.open { border-color: var(--cell); }
.zt { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.zt b { font: 600 12.5px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode { margin-left: auto; font: normal 500 10.5px var(--mono); }
.mode.offense { color: var(--kill); }
.mode.support { color: var(--repair); }
.mix { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--panel2); }
.mix i { display: block; flex: 1 1 0; min-width: 0; box-shadow: 0 0 6px currentColor; }
.zsub { font: 500 10.5px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ulegend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11px; color: var(--dim); padding: 0 2px 4px; }
.ulegend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
/* The open production sheet sits over the bottom of the map */
#sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 100%; overflow: auto; z-index: 5; background: rgba(10, 13, 24, .96); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; display: grid; gap: 8px; box-sizing: border-box; max-width: 560px; margin: 0 auto; box-shadow: 0 -6px 30px rgba(0,0,0,.6); }
.shd { display: flex; gap: 8px; align-items: center; }
.ztabs { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.ztabs button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 2px; font-size: 12.5px; font-weight: 600; }
.ztabs button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.shint { margin: 0; font-size: 12px; color: var(--dim); text-wrap: pretty; }
.shint b { color: var(--ink); }
.urow { display: grid; grid-template-columns: 30px 1fr auto auto; grid-template-areas: "i t p a" "i r r r"; gap: 2px 8px; align-items: center; }
.urow img { grid-area: i; width: 30px; height: 30px; }
.urow .ut { grid-area: t; min-width: 0; display: grid; }
.urow .ut b { font-size: 13px; }
.urow .ut small { font-size: 11px; color: var(--dim); line-height: 1.25; }
.urow .pct { grid-area: p; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; min-width: 3em; text-align: right; }
.urow .allin { grid-area: a; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.urow input { grid-area: r; width: 100%; margin: 2px 0; -webkit-appearance: none; appearance: none; height: 22px; background: none; }
.urow input::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--c) var(--p, 0%), var(--panel2) var(--p, 0%)); }
.urow input::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--c) var(--p, 0%), var(--panel2) var(--p, 0%)); }
.urow input::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: var(--c); border: 2px solid var(--void); box-shadow: 0 0 8px var(--c); }
.urow input::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--c); border: 2px solid var(--void); }
.mrow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 8px; }
.seg2 { margin-left: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.seg2 button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; }
.seg2 button[data-mode="offense"][aria-pressed="true"] { border-color: var(--kill); color: var(--kill); }
.seg2 button[data-mode="support"][aria-pressed="true"] { border-color: var(--repair); color: var(--repair); }
/* Cytokine storm: hold to preview the cost, release to fire */
#stormBtn { flex: none; display: grid; justify-items: center; align-content: center; gap: 2px; min-width: 58px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 6px; font: 600 11.5px var(--display); color: var(--dim); touch-action: none; }
#stormBtn img { width: 28px; height: 28px; }
#stormBtn.held { border-color: var(--gold); color: var(--gold); }
#stormBtn.lethal { border-color: var(--damage); color: var(--damage); box-shadow: 0 0 12px rgba(255,59,78,.5); }
#stormBtn.burning { border-color: var(--kill); color: var(--kill); }
#pauseBtn { height: auto; min-width: 44px; border-radius: 12px; }
.output { flex: 1 1 220px; min-width: 0; display: grid; gap: 2px; align-content: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; }
.output .mlabel { display: flex; align-items: center; gap: 6px; }
.output .mlabel span { margin-left: auto; }
#output { width: 100%; margin: 4px 0 2px; -webkit-appearance: none; appearance: none; height: 18px; background: none; }
#output::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--track, var(--panel2)); }
#output::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track, var(--panel2)); }
#output::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: var(--ink); border: 2px solid var(--void); box-shadow: 0 0 8px rgba(255, 210, 63, .6); }
#output::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: 2px solid var(--void); }

/* Modals */
#modal { position: fixed; inset: 0; background: rgba(4, 5, 10, .8); display: grid; place-items: center; padding: 16px; z-index: 20; }
.mbox { width: 100%; max-width: 460px; max-height: calc(100% - 8px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; box-sizing: border-box; }
.mbox h2 { margin: 0; font-size: 24px; font-weight: 650; font-stretch: 80%; line-height: 1.05; text-wrap: balance; }
.mbox h2 .glow { color: var(--cell); }
.mbox h2 .bad { color: var(--damage); }
.mbox p { margin: 0; color: var(--dim); }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.howto { margin: 0; padding-left: 18px; display: grid; gap: 5px; color: var(--ink); font-size: 13.5px; }
.howto li::marker { color: var(--cell); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-weight: 600; white-space: nowrap; }
.btn.primary { border-color: var(--cell); color: var(--cell); }
.linkbtn { background: none; border: 0; color: var(--cell); text-decoration: underline; padding: 2px; justify-self: start; font-size: 13.5px; }
.stars { display: flex; gap: 6px; }
.stars img { width: 34px; height: 34px; }
.goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
.goals li { display: flex; gap: 8px; color: var(--dim); }
.goals li::before { content: "\2606"; }
.goals li.hit { color: var(--ink); }
.goals li.hit::before { content: "\2605"; color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { display: grid; gap: 1px; }
.stats b { font: 500 16px var(--mono); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--dim); }
#graph { width: 100%; height: 130px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--dim); margin-top: -6px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; background: var(--c); }
/* Level list */
.levels { display: grid; gap: 4px; }
.lvl { display: grid; grid-template-columns: 1.6em 1fr auto auto; gap: 8px; align-items: center; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 5px 8px; }
.lvl[aria-pressed="true"] { border-color: var(--cell); }
.lvl .n { font: 500 12px var(--mono); color: var(--dim); }
.lvl .nm { font-weight: 600; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lvl .new { display: flex; gap: 2px; }
.lvl .new img { width: 20px; height: 20px; }
.lvl .rough { font: normal 500 10.5px var(--mono); color: var(--gold); margin-left: 4px; }
.lvl .st { font-size: 12px; color: var(--gold); letter-spacing: 1px; }
.lvl .st span { color: var(--line); }
.emblem { width: 72px; height: 72px; justify-self: center; }
/* Guide */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; position: sticky; top: -18px; background: var(--panel); padding-block: 6px; z-index: 1; }
.tabs button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; font-size: 12.5px; }
.tabs button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.gsec { display: grid; gap: 14px; }
.unit { display: grid; grid-template-columns: 44px 1fr; gap: 2px 12px; align-items: start; }
.unit > img { grid-row: span 3; width: 44px; height: 44px; }
.unit h4 { margin: 0; font-size: 16px; font-weight: 650; font-stretch: 85%; }
.unit .why { margin: 0; color: var(--ink); font-size: 13.5px; }
.unit ul { margin: 2px 0 0; padding-left: 16px; display: grid; gap: 3px; color: var(--dim); font-size: 13px; }
.unit ul b { color: var(--ink); font-weight: 600; }

/* Dev panel */
#dev { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100%); background: rgba(10, 13, 24, .97); border-left: 1px solid var(--line); z-index: 30; overflow: auto; padding: 14px 16px 40px; box-sizing: border-box; display: grid; gap: 12px; align-content: start; font-size: 13px; }
#dev h3 { margin: 0; font-size: 16px; font-weight: 650; font-stretch: 85%; display: flex; align-items: center; }
#dev h3 button { margin-left: auto; }
#dev .grp { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
#dev label.row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
#dev input[type="number"] { width: 5.5em; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: 12px var(--mono); }
#dev input[type="number"].changed { border-color: var(--gold); color: var(--gold); }
#dev details summary { cursor: pointer; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 4px 0; }
#dev details[open] summary { color: var(--ink); }
#dev details .field { display: grid; gap: 2px; padding: 4px 0; }
#dev details .field small { color: var(--dim); font-size: 11px; line-height: 1.3; }
#dev .devbtns { display: flex; gap: 6px; flex-wrap: wrap; }
#dev select { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font: 12px var(--display); padding: 4px; }
#dev .devbtns button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; }
#devJson { width: 100%; min-height: 80px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 11px var(--mono); box-sizing: border-box; }
#speed { width: 100%; accent-color: var(--gold); }

/* Narrower screens: production cards take a full row, controls below */
@media (max-width: 760px) {
  #bar { flex-wrap: wrap; }
  .zones { flex-basis: 100%; }
}
@media (max-width: 480px) {
  .zcard { padding: 5px 6px; }
  .zt b { font-size: 12px; }
  .mode { font-size: 10px; }
  #pauseBtn { min-width: 40px; }
  #stormBtn { min-width: 52px; }
}
/* Short landscape phones: tighten the chrome so the map keeps its height */
@media (max-height: 480px) {
  #hud { padding-block: 4px 0; }
  #banner { min-height: 1.35em; font-size: 12px; }
  #bar { padding-block: 4px 6px; }
  .ulegend { display: none; }
  .zcard { gap: 2px; padding: 4px 6px; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation-duration: .01s; animation-delay: 2s; } }
#tunerBack { position: relative; z-index: 21; border-color: var(--gold); color: var(--gold); }
</style>

<div id="app">
  <header id="hud">
    <div class="hudrow">
      <canvas id="prog" aria-label="Level progress: waves and toxin bursts still to come"></canvas>
      <span id="clock">0:00</span>
      <span id="speedTag" hidden></span>
      <button id="tunerBack" class="hbtn" type="button" onclick="history.length > 1 ? history.back() : (location.href = 'index.html')">Tuner</button>
      <button id="helpBtn" class="hbtn" type="button" aria-label="Guide">?</button>
      <button id="devBtn" class="hbtn" type="button">Dev</button>
    </div>
    <div id="banner" aria-live="polite"></div>
  </header>

  <main id="stage">
    <canvas id="cv" aria-label="The map: Wound, Tissue and Lymph node. Tap a zone to flip its macrophages between Offense and Support."></canvas>
    <div id="toasts"></div>
    <div id="sheet" hidden></div>
  </main>

  <div id="legend" class="ulegend" aria-hidden="true"></div>
  <footer id="bar">
    <div id="zones" class="zones"></div>
    <div class="output">
      <div class="mlabel"><img class="ico" data-art="body-output" alt=""><b>Body output</b><span id="outVal">1.0×</span></div>
      <input type="range" id="output" min="0" max="100" step="5" value="50" aria-label="Body output: how fast the marrow makes cells">
      <div class="fatigue" id="fatigue" data-tier="0"><span>Fatigue</span><div class="ftrack" id="ftrack"></div><img id="fIcon" alt=""><span id="fTier">Fine</span></div>
      <span class="mlabel"><span id="cellCount">0 cells</span></span>
    </div>
    <button id="stormBtn" type="button" aria-label="Cytokine storm: hold to see the cost, release to fire"><img id="stormIcon" alt=""><span id="stormLbl">Storm</span></button>
    <button id="pauseBtn" class="hbtn" type="button" aria-label="Pause"><img data-art="pause" alt=""></button>
  </footer>
</div>

<div id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>

<aside id="dev" hidden aria-label="Dev tools">
  <h3>Dev tools <button type="button" class="hbtn" id="devClose">Close</button></h3>
  <div class="grp">
    <label class="row" for="speed"><span>Speed <b id="speedVal">1×</b></span></label>
    <input type="range" id="speed" min="0" max="6" step="1" value="2">
    <div class="devbtns"><button type="button" id="devPause">Pause</button><button type="button" id="devStep">Step 1 s</button><button type="button" id="devSkip">Skip 15 s</button></div>
  </div>
  <div class="grp">
    <label class="row" for="seed"><span>Random seed</span><input type="number" id="seed" value="1" min="1" step="1"></label>
    <div class="devbtns"><button type="button" id="devRestart">Restart with seed</button><button type="button" id="devNewSeed">New seed</button></div>
  </div>
  <div class="grp">
    <span>Cheats and overlays</span>
    <div class="devbtns"><select id="cheatKind" aria-label="Antigen to spawn"></select><button type="button" id="cheatSpawn">Spawn</button><button type="button" id="cheatClear">Kill all antigens</button><button type="button" id="cheatCalm">Fatigue to 0</button></div>
    <label class="row" for="ovRange"><span>Show neutrophil range</span><input type="checkbox" id="ovRange"></label>
    <label class="row" for="ovRotate"><span>Force portrait layout</span><input type="checkbox" id="ovRotate"></label>
  </div>
  <div class="grp">
    <span>Tuning <small style="color:var(--dim)">(live; gold = changed from default; saved in this browser)</small></span>
    <div id="tuning"></div>
    <div class="devbtns"><button type="button" id="tuneCopy">Copy changes as JSON</button><button type="button" id="tuneReset">Reset all</button></div>
    <textarea id="devJson" hidden readonly aria-label="Tuning JSON"></textarea>
  </div>
</aside>

<script>
// Immune RTS prototype art. Generated; edit gen.py, not this file.
// Usage: const img = await ART.load('neutrophil'); ctx.drawImage(img, x - s/2, y - s/2, s, s)
// Map sprites share a 64x64 box centred on the cell; `radius` is the body radius in those units.
// Non-square sprites (shots, trails) give meta.box [w,h] and meta.anchor [x,y]: put the anchor on the object and rotate to its heading.
// Draw cells and fields with ctx.globalCompositeOperation = 'lighter' for the fluorescence look.
const ART = {

ing: the pod cracks with a white flash. Show for ~0.3 s, then spawn bacteria.", "worldR": 7}, "staph-toxic": {"kind": "enemy", "size": 64, "radius": 9, "note": "Toxic-shock Staph (the drain): a plain rod wrapped in an orange pulse (the fatigue colour). Pulse its alpha ~1 Hz.", "worldR": 5.5}, "strep-link": {"kind": "enemy", "size": 64, "radius": 7, "note": "Strep chain link (one bead, with link stubs both sides). Place links ~18 units apart along the chain's path and rotate each to the path. Draw ~0.8x a plain bacterium.", "worldR": 4}, "strep-chain": {"kind": "enemy", "size": 64, "radius": 28, "note": "Strep chain (6 beads, wriggling). For icons, markers and previews; in play, build chains from strep-link.", "worldR": 14}, "herpes": {"kind": "enemy", "size": 64, "radius": 11, "note": "Herpes particle: a lilac hexagonal capsid in a dotted envelope. 8 burst out of each infected neutrophil.", "worldR": 3.5}, "neutrophil-infected": {"kind": "unit", "size": 64, "radius": 13, "note": "Neutrophil carrying herpes: looks normal except a faint lilac glow and a capsid inside. Flicker this sprite with the plain neutrophil every ~0.3 s so a sharp-eyed player can spot it.", "worldR": 8}, "tapeworm-head": {"kind": "enemy", "size": 64, "radius": 26, "note": "Tapeworm head (scolex): four suckers and a hook crown. The only enemy bigger than a macrophage: draw ~1.6x a macrophage. Faces +x.", "worldR": 24}, "tapeworm-segment": {"kind": "enemy", "size": 48, "radius": 19, "note": "Tapeworm segment (48x40). Chain them behind the head along its path, overlapping a little, each rotated to the path. Flash with hit-spark; when one breaks off, swap it for tapeworm-small.", "box": [48, 40], "anchor": [24, 20], "worldR": 15}, "tapeworm-small": {"kind": "enemy", "size": 64, "radius": 12, "note": "Small fast worm, made when a tapeworm segment breaks off. Faces +x.", "worldR": 6}, "neutrophil-net": {"kind": "unit", "size": 64, "radius": 13, "note": "Net neutrophil (marrow option), on its run to th   _img: {},
  ready: {},  // name -> loaded <img>, filled in as loads finish (the draw helpers below read it)
  // Resolves to an <img> you can drawImage(). Cached per name.
  load(name) {
    if (!this._img[name]) this._img[name] = new Promise((ok, err) => {
      const i = new Image();
      i.onload = () => { this.ready[name] = i; ok(i); }; i.onerror = err;
      i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(this.svg[name]);
    });
    return this._img[name];
  },
  loadAll() {
    return Promise.all(Object.keys(this.svg).map(n => this.load(n))).then(() => this);
  },
  // Pre-render a sprite to an offscreen canvas at a fixed pixel size (fast to blit hundreds of times).
  async sprite(name, px) {
    const img = await this.load(name), c = document.createElement('canvas');
    c.width = c.height = Math.ceil(px * (window.devicePixelRatio || 1));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  },
  // ---- v2 HUD helpers (call after loadAll) ----
  // Lymph node infection timer: a ring that fills red clockwise from 12 o'clock.
  // frac 0..1; beating = bacteria inside the node (adds a double-thump heartbeat); t = seconds, for the pulse.
  drawTimer(ctx, x, y, r, frac, { beating = false, t = 0 } = {}) {
    const red = this.palette.damage, k = beating ? 1 + 0.08 * this._beat(t) : 1, R = r * k;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(3, r * 0.22);
    ctx.strokeStyle = 'rgba(255,59,78,0.18)';
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = Math.max(1, r * 0.06); ctx.strokeStyle = 'rgba(255,59,78,0.45)';
    for (let i = 0; i < 12; i++) {           // tick marks every 1/12
      const a = i / 12 * Math.PI * 2 - Math.PI / 2, i0 = R - r * 0.42, i1 = R - r * 0.3;
      ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * i0, y + Math.sin(a) * i0); ctx.lineTo(x + Math.cos(a) * i1, y + Math.sin(a) * i1); ctx.stroke();
    }
    if (frac > 0) {
      const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * Math.min(1, frac);
      ctx.strokeStyle = red; ctx.lineWidth = Math.max(3, r * 0.22);
      ctx.shadowColor = red; ctx.shadowBlur = r * (beating ? 0.9 : 0.5);
      ctx.beginPath(); ctx.arc(x, y, R, a0, a1); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = '#FFE1E5';
      ctx.beginPath(); ctx.arc(x + Math.cos(a1) * R, y + Math.sin(a1) * R, Math.max(1.5, r * 0.09), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  },
  _beat(t) {  // lub-dub at ~70 bpm, 0..1
    const p = (t * 70 / 60) % 1, b = (c, w) => Math.exp(-(((p - c) / w) ** 2));
    return Math.max(b(0.05, 0.05), 0.6 * b(0.25, 0.05));
  },
  // Level progress bar. frac 0..1; events = [{at: 0..1, kind: 'wave'|'wave-armored'|'wave-final'|'toxin'}].
  // Events already passed dim out; the next one glows.
  drawProgress(ctx, x, y, w, h, frac, events = []) {
    ctx.save();
    const r = h / 2, f = Math.max(0, Math.min(1, frac));
    ctx.fillStyle = 'rgba(221,230,245,0.08)'; ctx.strokeStyle = 'rgba(221,230,245,0.3)'; ctx.lineWidth = 1;
    this._pill(ctx, x, y, w, h, r); ctx.fill(); ctx.stroke();
    if (f > 0) {
      const g = ctx.createLinearGradient(x, 0, x + w * f, 0);
      g.addColorStop(0, 'rgba(63,230,255,0.15)'); g.addColorStop(1, 'rgba(63,230,255,0.55)');
      ctx.fillStyle = g; this._pill(ctx, x, y, Math.max(h, w * f), h, r); ctx.fill();
      ctx.fillStyle = this.palette.cellHi; ctx.fillRect(x + w * f - 1, y - 2, 2, h + 4);
    }
    const next = events.filter(e => e.at > f).sort((a, b) => a.at - b.at)[0];
    for (const e of events) {
      const img = this.ready['marker-' + e.kind]; if (!img) continue;
      const s = h * (e.kind === 'wave-final' ? 2.6 : 2.1) * (e === next ? 1.15 : 1);
      ctx.globalAlpha = e.at <= f ? 0.25 : 1;
      ctx.drawImage(img, x + w * e.at - s / 2, y + h / 2 - s / 2, s, s);
    }
    ctx.restore();
  },
  // ---- v2 round 2: body output and fatigue ----
  fatigueColors: { fine: '#7F8FB0', tired: '#FFD23F', feverish: '#FF7A3D', exhausted: '#FF3B4E' },
  _fm: 0,
  // Fatigue meter as an inline SVG string for the DOM HUD: el.innerHTML = ART.fatigueMeterSVG(g.fatigue, CONFIG.fatigue).
  // Faint bands preview each tier; the fill takes the colour of the band it has reached; a bright edge marks "now".
  // Storm options: { ghost: 50, burn: 16 } while the storm button is held draws where fatigue would land:
  // a hatched bar for the instant cost, then a fading band for the afterburn's range. It turns red where it reaches 100.
  // { burning: true } during the afterburn outlines the meter in red.
  fatigueMeterSVG(fatigue, tiers = { tired: 35, feverish: 60, exhausted: 85 }, h = 10, opts = {}) {
    const id = 'fm' + (this._fm++ % 1000), c = this.fatigueColors, f = Math.max(0, Math.min(100, fatigue));
    const t1 = tiers.tired, t2 = tiers.feverish, t3 = tiers.exhausted, r = h / 2;
    const band = (a, b, col, op) => `<rect x="${a}" y="0" width="${b - a}" height="${h}" fill="${col}" fill-opacity="${op}"/>`;
    const tick = x => `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="#04050A" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Fatigue ${Math.round(f)} of 100">`
      + `<defs><clipPath id="${id}c"><rect width="100" height="${h}" rx="${r}" ry="${r}"/></clipPath>`
      + `<linearGradient id="${id}g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">`
      + `<stop offset="${t1 * .8 / 100}" stop-color="${c.fine}"/><stop offset="${t1 / 100}" stop-color="${c.tired}"/>`
      + `<stop offset="${t2 / 100}" stop-color="${c.feverish}"/><stop offset="${t3 / 100}" stop-color="${c.exhausted}"/></linearGradient></defs>`
      + `<g clip-path="url(#${id}c)">${band(0, t1, c.fine, .1)}${band(t1, t2, c.tired, .14)}${band(t2, t3, c.feverish, .17)}${band(t3, 100, c.exhausted, .22)}`
      + (f > 0.5 ? `<rect width="${f}" height="${h}" fill="url(#${id}g)"/><rect x="${Math.max(0, f - .8)}" width=".8" height="${h}" fill="#FFFFFF" fill-opacity=".9"/>` : '')
      + this._ghost(id, f, h, opts)
      + `${tick(t1)}${tick(t2)}${tick(t3)}</g>`
      + (opts.burning ? `<rect x=".5" y=".5" width="99" height="${h - 1}" rx="${r}" ry="${r}" fill="none" stroke="#FF3B4E" stroke-width="1.5" vector-effect="non-scaling-stroke"/>` : '')
      + `</svg>`;
  },
  _ghost(id, f, h, { ghost = 0, burn = 0 } = {}) {
    if (!ghost) return '';
    const g0 = Math.min(100, f + ghost), g1 = Math.min(100, f + ghost + burn), certain = f + ghost >= 100, gamble = f + ghost + burn >= 100;
    const col = certain ? '#FF3B4E' : '#FFFFFF', col2 = gamble ? '#FF3B4E' : '#FFFFFF';
    return `<defs><pattern id="${id}p" width="3" height="${h}" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">`
      + `<rect width="1.4" height="${h}" fill="${col}"/></pattern>`
      + `<pattern id="${id}q" width="3" height="${h}" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)"><rect width="1.4" height="${h}" fill="${col2}"/></pattern>`
      + `<linearGradient id="${id}f" gradientUnits="userSpaceOnUse" x1="${g0}" x2="${Math.max(g1, g0 + .1)}" y1="0" y2="0">`
      + `<stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>`
      + `<mask id="${id}m"><rect x="${g0}" width="${g1 - g0}" height="${h}" fill="url(#${id}f)"/></mask></defs>`
      + `<rect x="${f}" width="${g0 - f}" height="${h}" fill="${col}" fill-opacity="${certain ? .3 : .16}"/>`
      + `<rect x="${f}" width="${g0 - f}" height="${h}" fill="url(#${id}p)" fill-opacity=".7"/>`
      + `<rect x="${g0}" width="${g1 - g0}" height="${h}" fill="url(#${id}q)" fill-opacity=".6" mask="url(#${id}m)"/>`
      + `<rect x="${g0 - .6}" width=".6" height="${h}" fill="${col}"/>`
      + (gamble ? `<rect x="99" width="1" height="${h}" fill="#FF3B4E"/>` : '');
  },
  // ---- cytokine storm ----
  // Full-screen storm effect in view space, drawn last with source-over.
  // phase 'windup' (1 s): red flush rises, the storm-wave rolls out from (ox, oy), the marrow side.
  // phase 'hit' (~0.4 s): magenta-white flash that fades. phase 'afterburn' (8 s): fast red edge pulse, easing as p -> 1.
  // p = 0..1 progress through the phase; t = seconds (for pulses).
  drawStorm(ctx, w, h, { phase, p = 0, t = 0, ox = w / 2, oy = h } = {}) {
    ctx.save();
    if (phase === 'windup') {
      ctx.fillStyle = `rgba(255,59,78,${0.32 * p})`; ctx.fillRect(0, 0, w, h);
      const img = this.ready['storm-wave'], R = p * Math.hypot(w, h);
      if (img && R > 1) { const s = R * 256 / 120; ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - 0.4 * p; ctx.drawImage(img, ox - s / 2, oy - s / 2, s, s); }
    } else if (phase === 'hit') {
      const k = 1 - p, g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.hypot(w, h) / 2);
      g.addColorStop(0, `rgba(255,236,246,${0.9 * k})`); g.addColorStop(0.5, `rgba(255,61,203,${0.75 * k})`); g.addColorStop(1, `rgba(255,59,78,${0.85 * k})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    } else if (phase === 'afterburn') {
      const a = (0.22 + 0.16 * (0.5 + 0.5 * Math.sin(t * Math.PI * 4))) * (1 - 0.6 * p), d = Math.min(w, h) * 0.18;
      const edge = (x0, y0, x1, y1, rx, ry, rw, rh) => {
        const g = ctx.createLinearGradient(x0, y0, x1, y1);
        g.addColorStop(0, `rgba(255,59,78,${a})`); g.addColorStop(0.5, `rgba(255,61,203,${a * 0.3})`); g.addColorStop(1, 'rgba(255,61,203,0)');
        ctx.fillStyle = g; ctx.fillRect(rx, ry, rw, rh);
      };
      edge(0, 0, 0, d, 0, 0, w, d); edge(0, h, 0, h - d, 0, h - d, w, d); edge(0, 0, d, 0, 0, 0, d, h); edge(w, 0, w - d, 0, w - d, 0, d, h);
    }
    ctx.restore();
  },
  // Collapse when fatigue hits 100 during a storm. p = 0..1 over ~2 s, then show the loss screen with the organ-failure emblem.
  // A red flash, then the field drains dark while the edges beat slower and stop.
  drawCollapse(ctx, w, h, p) {
    ctx.save();
    const flash = Math.max(0, 1 - p / 0.15);
    ctx.fillStyle = `rgba(4,5,10,${Math.min(0.82, p * 1.1)})`; ctx.fillRect(0, 0, w, h);
    if (flash > 0) { ctx.fillStyle = `rgba(255,59,78,${0.6 * flash})`; ctx.fillRect(0, 0, w, h); }
    const beats = [0.25, 0.5, 0.8], beat = beats.reduce((m, b) => Math.max(m, Math.exp(-(((p - b) / 0.04) ** 2))), 0) * (1 - p * 0.6);
    if (beat > 0.01) {
      const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.65);
      g.addColorStop(0, 'rgba(255,59,78,0)'); g.addColorStop(1, `rgba(255,59,78,${0.55 * beat})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }
    ctx.restore();
  },
  // Background for the Body output slider track: cool up to the sustainable point, heating past it.
  // restFrac = where the rest multiplier sits on the slider (0..1), e.g. log(rest/min)/log(max/min).
  outputTrackCSS(restFrac) {
    const p = Math.round(restFrac * 100);
    return `linear-gradient(90deg, rgba(63,230,255,.15) 0%, rgba(63,230,255,.45) ${p}%, #FFD23F ${p}%, #FF7A3D ${Math.round(p + (100 - p) * .5)}%, #FF3B4E 100%)`;
  },
  // Screen-edge glow for Feverish (tier 2) and Exhausted (tier 3). Call last, in view space, with source-over.

  setZone(z, mode) { if (this.zones[z]) this.zones[z].mode = mode; }
  setOutput(x) { this.output = Math.max(0, Math.min(1, +x || 0)); }
  // Cytokine storm: fires after a short wind-up, any time. Fatigue reaching 100 during it is fatal.
  useStorm() { if (this.result || this.storm.wind > 0) return false; this.storm.wind = CONFIG.storm.windup; this.fx.push({ k: 'stormStart' }); return true; }
  stormActive() { return this.storm.wind > 0 || this.storm.after > 0; }
  // Where a storm started now would leave fatigue, roughly (for the ghost bar)
  stormForecast() { const S = CONFIG.storm; return Math.min(100, this.fatigue + S.cost + S.after * S.afterRate * (this.output <= 0.001 ? 0.5 : 1)); }

  outputMul() { const O = CONFIG.output; return O.min * Math.pow(O.max / O.min, this.output); }
  fatigueTier() { const F = CONFIG.fatigue, f = this.fatigue; return f >= F.exhausted ? 3 : f >= F.feverish ? 2 : f >= F.tired ? 1 : 0; }
  pendingToxin() {
    for (const tx of this.toxins) {
      if (tx.state === 'sweeping') return tx;
      if (tx.state === 'coming' && this.t >= tx.at - CONFIG.toxin.notice) return tx;
    }
    return null;
  }
  // Progress-bar markers still to come: {t, kind: 'wave' | 'toxin' | 'hatch', kinds, final}
  markers() {
    const out = [];
    for (let i = this.waveIdx; i < this.lv.waves.length; i++) {
      const w = this.lv.waves[i];
      out.push({ t: w.t, kind: 'wave', final: !!w.final, kinds: Object.keys(KINDS).filter(k => w[k] > 0), armored: !!w.mrsa });
    }
    for (const w of this.lv.waves) if (w.spore && w.t + CONFIG.spore.hatch > this.t) out.push({ t: w.t + CONFIG.spore.hatch, kind: 'hatch' });
    for (const tx of this.toxins) if (tx.state === 'coming') out.push({ t: tx.at, kind: 'toxin' });
    return out;
  }
  // Every scripted event, past and future (for the progress bar)
  levelEvents() {
    const ev = [];
    for (const w of this.lv.waves) if (w.t > 0) ev.push({ t: w.t, kind: 'wave', final: !!w.final, kinds: Object.keys(KINDS).filter(k => w[k] > 0), armored: !!w.mrsa });
    for (const w of this.lv.waves) if (w.spore) ev.push({ t: w.t + CONFIG.spore.hatch, kind: 'hatch' });
    for (const tx of this.toxins) ev.push({ t: tx.at, kind: 'toxin' });
    return ev;
  }
  liveAg() { return this.ag.filter(a => !a.dead && !a.eaten); }
  count(type) { let n = 0; for (const c of this.cells) if (c.type === type && !c.dead) n++; return n; }
  cellCount() { return this.cells.length; }
  get neut() { return this.cells.filter(c => c.type === 'neut' || c.type === 'net'); }
  get mac() { return this.cells.filter(c => c.type === 'mac'); }
  get bact() { return this.ag; }

  // ---- spawning ----
  spawnCell(type, home, u, v, start) {
    const C = CONFIG, r = this.rand;
    // every cell has the same fields (keeps the JS engine fast)
    const c = {
      id: this.id++, type, home, u: 0, v: 0, vu: 0, vv: 0, r: 3, m: 1, age: 0, dead: false, stun: 0,
      head: Math.PI / 2, turn: 0, cd: r() * 0.5, boosted: false, infected: 0, target: null, retarget: 0, tu: -1, tv: -1,
      pu: 0, pv: 0, mode: 'offense', gulp: 0, prey: null, flip: 0, tb: null,
    };
    if (type === 'mac') {
      const n = this.cells.filter(m => m.type === 'mac' && m.home === home).length, slot = n % POSTS.length;
      c.pu = home * ZONE + POSTS[slot][0] * ZONE; c.pv = VESSEL + POSTS[slot][1] * (WIDTH - VESSEL);
      c.r = C.macrophage.radius; c.m = 10; c.cd = 0;
      if (start) { c.u = c.pu; c.v = c.pv; }
    } else if (type === 'nk') { c.r = C.nk.radius; c.m = 2; }
    else if (type === 'net') { c.r = C.net.radius; c.m = 1.6; }
    else { c.r = C.neutrophil.radius; c.m = 1.4; }
    if (!start) {
      c.u = u != null ? u : home * ZONE + 20 + r() * (ZONE - 40);
      c.v = v != null ? v : VESSEL * 0.5;
      if (v == null) c.vv = 60 + r() * 40; // pushed out of the vessel into the tissue
    }
    this.cells.push(c);
    return c;
  }
  spawnAg(k, u, v, extra) {
    const C = CONFIG, r = this.rand;
    if (this.ag.length >= C.bacteria.maxCount + 260) return null;
    const K = KINDS[k];
    const hp = K.hp || (K.hpKey ? C[K.hpKey].hp : k === 'worm' ? C.worm.segHp : k === 'wormlet' ? C.worm.wormletHp : 1);
    const a = {
      id: this.id++, k, u: u == null ? WOUND.u + (r() - 0.5) * 90 : u, v: v == null ? WOUND.v + (r() - 0.5) * 180 : v,
      vu: 0, vv: 0, r: radiusOf(k), hp, maxHp: hp, age: 0, div: this.divTime(k), flash: 0, rot: r() * 6.283,
      dead: false, eaten: false, domed: false, prev: null, next: null, m: 1, split: false, anchored: false, hatchAt: 0,
    };
    a.m = Math.max(0.6, a.r * a.r / 6) * (k === 'worm' ? 3 : 1);
    if (extra) { if (extra.hatchAt) a.hatchAt = extra.hatchAt; if (extra.split) a.split = true; }
    this.ag.push(a);
    return a;
  }
  divTime(k) {
    const C = CONFIG, base = { staph: C.staph.doubling, mrsa: C.mrsa.doubling, pseudo: C.pseudo.doubling, clos: C.clos.doubling, tb: C.tb.doubling, toxic: C.toxic.doubling }[k];
    return base ? base * (1 + (this.rand() - 0.5) * 2 * C.bacteria.jitter) : Infinity;
  }
  // A chain of links following a head (Strep chains, the Tapeworm)
  spawnChain(k, n, u, v) {
    let prev = null; const sp = radiusOf(k) * 2.1;
    for (let i = 0; i < n; i++) {
      const a = this.spawnAg(k, u - i * sp, v + Math.sin(i * 0.7) * 3);
      if (!a) break;
      if (prev) { a.prev = prev; prev.next = a; }
      prev = a;
    }
  }
  runWaves() {
    const w = this.lv.waves, r = this.rand;
    while (this.waveIdx < w.length && this.t >= w[this.waveIdx].t) {
      const wave = w[this.waveIdx++];
      let n = 0;
      for (const k of Object.keys(KINDS)) {
        const c = wave[k] || 0; if (!c) continue;
        if (k === 'strep') { for (let i = 0; i < c; i++) this.spawnChain('strep', CONFIG.strep.links, WOUND.u + 30, WOUND.v + (r() - 0.5) * 200); n += c * CONFIG.strep.links; }
        else if (k === 'worm') { for (let i = 0; i < c; i++) this.spawnChain('worm', CONFIG.worm.segments, WOUND.u + 60, WOUND.v); n += c; }
        else if (k === 'spore') { for (let i = 0; i < c; i++) this.spawnAg('spore', null, null, { hatchAt: wave.t + CONFIG.spore.hatch }); n += c; }
        else if (k === 'flu') { const cu = WOUND.u, cv = WOUND.v + (r() - 0.5) * 80; for (let i = 0; i < c; i++) this.spawnAg('flu', cu + (r() - 0.5) * 50, cv + (r() - 0.5) * 70); n += c; }
        else { for (let i = 0; i < c; i++) this.spawnAg(k); n += c; }
      }
      this.fx.push({ k: 'wave', u: WOUND.u, v: WOUND.v, n, kinds: Object.keys(KINDS).filter(k => wave[k] > 0), counts: Object.fromEntries(Object.keys(KINDS).filter(k => wave[k] > 0).map(k => [k, wave[k]])), final: !!wave.final });
    }
  }

  // ---- queries ----
  // Shots and nets can hurt it (not inert, not under a dome)
  hittable(a) { return !a.dead && !a.eaten && !a.domed && a.k !== 'spore'; }
  inRing(u, v) {
    const r2 = (this.ringR || CONFIG.support.ring) ** 2;
    for (const m of this.cells) if (m.type === 'mac' && !m.dead && !m.tb && m.mode === 'support' && m.stun <= 0 && (m.u - u) ** 2 + (m.v - v) ** 2 < r2) return true;
    return false;
  }
  nearestAg(u, v, maxD, filter) {
    let best = null, bd = maxD * maxD;
    const test = a => {
      if (a.dead || a.eaten || (filter && !filter(a))) return;
      const d = (a.u - u) ** 2 + (a.v - v) ** 2;
      if (d < bd) { bd = d; best = a; }
    };
    if (maxD <= 80) this.gA.each(u, v, maxD, test); else for (const a of this.ag) test(a);
    return best;
  }
  band(z) { const lsh = CONFIG.neutrophil.leash; return [z * ZONE - lsh, (z + 1) * ZONE + lsh]; }

  // ---- tick ----
  step(dt) {
    if (this.result) return;
    const C = CONFIG, r = this.rand;
    this.t += dt;
    const t = this.t;
    if (this.fx.length > 500) this.fx.splice(0, this.fx.length - 500);

    // --- script: waves, stream, spores, toxins
    this.runWaves();
    if (t < this.duration) {
      const S = this.lv.stream, f = t / this.duration;
      this.streamAcc += dt * (S.start + (S.end - S.start) * f);
      while (this.streamAcc >= 1) {
        const n = Math.max(1, Math.min(Math.floor(this.streamAcc), 1 + Math.floor(r() * S.clump)));
        this.streamAcc -= n;
        const ks = S.kinds.filter(x => !x.from || t >= x.from), tot = ks.reduce((a, x) => a + x.w, 0);
        let pick = r() * tot, k = ks[0].k;
        for (const x of ks) { if ((pick -= x.w) <= 0) { k = x.k; break; } }
        const cu = WOUND.u + (r() - 0.5) * 60, cv = WOUND.v + (r() - 0.5) * 160;
        for (let i = 0; i < n; i++) this.spawnAg(k, cu + (r() - 0.5) * 12, cv + (r() - 0.5) * 12);
        this.fx.push({ k: 'trickle', u: cu, v: cv });
      }
    }
    for (const a of this.ag) if (a.k === 'spore' && !a.dead && t >= a.hatchAt) {
      a.k = 'clos'; a.hp = a.maxHp = C.clos.hp; a.r = radiusOf('clos'); a.div = this.divTime('clos'); a.age = 0;
      this.fx.push({ k: 'hatch', u: a.u, v: a.v });
    }

    // --- body output, fatigue, storm
    const mul = this.outputMul(), O = C.output, F = C.fatigue, S = C.storm;
    const toxicAlive = this.ag.some(a => a.k === 'toxic' && !a.dead);
    this.toxicDrain = toxicAlive;
    let df = mul > O.rest ? (mul - O.rest) * O.tire * (toxicAlive ? C.toxic.fatigueMul : 1) : (mul - O.rest) * O.recover;
    if (this.storm.wind > 0) {
      this.storm.wind -= dt;
      if (this.storm.wind <= 0) this.fireStorm();
    } else if (this.storm.after > 0) {
      this.storm.after -= dt;
      df = Math.max(0, df) + S.afterRate * (this.output <= 0.001 ? 0.5 : 1);
    }
    this.fatigue = Math.max(0, Math.min(100, this.fatigue + df * dt));
    this.fatiguePeak = Math.max(this.fatiguePeak, this.fatigue);
    if (this.fatigue >= 100 && (this.storm.after > 0 || this.storm.wind > 0 || this.storm.justFired)) {
      this.finish(false, 'Cytokine storm: organ failure. Fatigue hit 100 during the storm.', 'storm');
      return;
    }
    this.storm.justFired = false;
    const tier = this.fatigueTier();
    if (tier !== this.tier) { this.fx.push({ k: 'tier', tier, up: tier > this.tier }); this.tier = tier; }
    this.tierTime[tier] += dt;
    const slow = tier >= 1 ? F.tiredSpeed : 1;
    this.ringR = C.support.ring * (tier >= 3 ? F.exhaustedRing : 1);

    for (const tx of this.toxins) {
      if (tx.state === 'coming' && t >= tx.at) { tx.state = 'sweeping'; tx.front = 0; this.fx.push({ k: 'burst', u: WOUND.u, v: WOUND.v }); }
      if (tx.state === 'sweeping') {
        tx.front += dt / C.toxin.sweep;
        const reach = tx.front * 340;
        for (const c of this.cells) if (!c.dead && c.u < ZONE && Math.hypot(c.u - WOUND.u, c.v - WOUND.v) < reach) { this.killCell(c, 'toxin'); this.stats.toxinDeaths++; }
        if (tx.front >= 1) tx.state = 'done';
      }
    }
    const warnTx = this.toxins.find(tx => tx.state === 'coming' && t >= tx.at - C.toxin.warn);
    this.warning = warnTx ? (warnTx.at - t) : 0;

    // --- production: each zone gets a third of the marrow, split by its mix
    const rate = C.marrow.rate * mul * (tier >= 3 ? F.exhaustedMarrow : 1) / 3;
    const nMac = this.count('mac'), nNk = this.count('nk');
    let total = this.cells.length;
    for (let z = 0; z < 3; z++) {
      const zn = this.zones[z];
      for (const u of this.units) {
        zn.prog[u] += dt * rate * zn.mix[u] / C.marrow[u];
        if (zn.prog[u] >= 1) {
          const capped = total >= C.caps.cells || (u === 'mac' && nMac >= C.caps.mac) || (u === 'nk' && nNk >= C.caps.nk);
          if (capped) { zn.prog[u] = 1; continue; }
          zn.prog[u] -= 1; total++; this.stats.made++;
          const c = this.spawnCell(u, z);
          this.fx.push({ k: 'arrive', u: c.u, v: c.v, type: u });
        }
      }
    }

    // --- grids
    this.gA.clear(); this.gF.clear();
    for (const a of this.ag) if (!a.dead && !a.eaten) this.gA.add(a);
    for (const c of this.cells) if (!c.dead) this.gF.add(c);
    // domes: mark what is sheltered, grow them
    for (const d of this.domes) d.r = Math.min(C.pseudo.domeMax, d.r + C.pseudo.domeGrow * dt * (d.hp / C.pseudo.domeHp));
    for (const a of this.ag) {
      a.domed = false;
      for (const d of this.domes) if ((a.u - d.u) ** 2 + (a.v - d.v) ** 2 < d.r * d.r) { a.domed = true; break; }
    }
    for (const w of this.webs) w.life -= dt;
    if (this.webs.length) this.webs = this.webs.filter(w => w.life > 0);

    // --- your cells
    for (const c of this.cells) {
      if (c.dead) continue;
      c.age += dt;
      c.stun = Math.max(0, c.stun - dt);
      if (c.type === 'mac') this.stepMac(c, dt, slow);
      else if (c.type === 'neut') this.stepNeut(c, dt, slow, tier);
      else if (c.type === 'net') this.stepNet(c, dt, slow);
      else if (c.type === 'nk') this.stepNk(c, dt, slow);
    }
    // integrate and keep in bounds
    for (const c of this.cells) {
      if (c.dead) continue;
      c.u += c.vu * dt; c.v += c.vv * dt;
      if (c.u < 6) { c.u = 6; c.vu = Math.abs(c.vu) * 0.3; }
      if (c.u > L - 6) { c.u = L - 6; c.vu = -Math.abs(c.vu) * 0.3; }
      if (c.v < VESSEL * 0.3) { c.v = VESSEL * 0.3; c.vv = Math.abs(c.vv) * 0.3; }
      if (c.v > WIDTH - 6) { c.v = WIDTH - 6; c.vv = -Math.abs(c.vv) * 0.3; }
    }

    // --- shots
    this.stepShots(dt);

    // --- antigens
    this.stepAntigens(dt);

    // --- collisions (your cells and antigens push each other around)
    this.collide();

    // --- cleanup
    if (this.cells.some(c => c.dead)) this.cells = this.cells.filter(c => !c.dead);
    if (this.ag.some(a => a.dead)) this.ag = this.ag.filter(a => !a.dead);
    if (this.shots.some(s => s.life <= 0)) this.shots = this.shots.filter(s => s.life > 0);
    if (this.domes.some(d => d.hp <= 0)) this.domes = this.domes.filter(d => d.hp > 0);

    // --- zone counts, lymph node timer, end
    const zc = [0, 0, 0];
    for (const a of this.ag) if (!a.eaten && a.k !== 'spore') zc[zoneOf(a.u)]++;
    for (let z = 0; z < 3; z++) this.zones[z].count = zc[z];
    const live = this.ag.filter(a => !a.eaten).length;
    this.stats.peak = Math.max(this.stats.peak, live);
    if (zc[2] > 0) {
      if (!this.lymph.reached) { this.lymph.reached = true; this.fx.push({ k: 'breach' }); }
      this.lymph.timer = Math.min(1, this.lymph.timer + dt / C.lymph.fill);
      this.lymph.peak = Math.max(this.lymph.peak, this.lymph.timer);
    }
    this.histT -= dt;
    if (this.histT <= 0) { this.histT = 2; this.history.push({ t, z: zc.slice(), n: this.cells.length, m: nMac, timer: this.lymph.timer, fatigue: this.fatigue, output: this.output }); }
    const hidden = this.cells.some(c => c.infected);
    if (this.lymph.timer >= 1) this.finish(false, `Antigens sat in the Lymph node for ${C.lymph.fill} s and multiplied there.`, 'lymph');
    else if (t >= this.duration && live === 0 && !hidden) this.finish(true, 'The bar is full and every antigen is gone.');
  }

  // Steer a body toward a desired velocity with limited acceleration
  steer(c, du, dv, accel, dt) {
    let au = du - c.vu, av = dv - c.vv;
    const a = Math.hypot(au, av), lim = accel * dt;
    if (a > lim) { au *= lim / a; av *= lim / a; }
    c.vu += au; c.vv += av;
  }
  // Keep a cell near its home zone
  leashTarget(c) { const [lo, hi] = this.band(c.home); return c.u < lo ? 1 : c.u > hi ? -1 : 0; }

  stepNeut(n, dt, slow, tier) {
    const C = CONFIG, F = C.fatigue, r = this.rand, N = C.neutrophil;
    if (n.age >= N.life * (tier >= 2 ? F.feverLife : 1)) { this.killCell(n, 'age'); return; }
    if (n.infected) {
      n.infected -= dt;
      if (n.infected <= 0) { this.killCell(n, 'burst'); return; }
    }
    n.boosted = this.inRing(n.u, n.v);
    const [lo, hi] = this.band(n.home);
    n.turn -= dt;
    if (n.turn <= 0) {
      n.turn = N.turnEvery * (0.6 + r() * 0.8);
      const out = this.leashTarget(n);
      const tgt = this.nearestAg(n.u, n.v, 2000, a => a.u >= lo && a.u <= hi && a.k !== 'spore') || this.infectedMacNear(n, lo, hi);
      let want;
      if (out) want = Math.atan2(NODE.v * 0.6 + n.v * 0.4 - n.v, out * 100);
      else if (tgt) {
        const d = Math.hypot(tgt.u - n.u, tgt.v - n.v);
        want = Math.atan2(tgt.v - n.v, tgt.u - n.u);
        if (d < N.standoff) want += Math.PI / 2 * (r() < 0.5 ? 1 : -1);
      } else want = Math.atan2((WIDTH + VESSEL) / 2 + (r() - 0.5) * 200 - n.v, (n.home + 0.5) * ZONE - n.u) + (r() - 0.5) * 2;
      n.head = !out && r() < N.stray ? r() * 6.283 : want + N.zigzag * (r() * 2 - 1) * (out ? 0.3 : 1);
    }
    const sp = N.speed * slow * (n.boosted ? C.support.speedMul : 1);
    this.steer(n, Math.cos(n.head) * sp, Math.sin(n.head) * sp, N.accel, dt);
    // Fire: prefer a target the shot can hurt
    n.cd -= dt;
    if (n.cd <= 0 && n.stun <= 0) {
      const can = n.boosted ? a => this.hittable(a) : a => this.hittable(a) && a.k !== 'mrsa';
      const aim = this.nearestAg(n.u, n.v, N.range, can) || this.nearestAg(n.u, n.v, N.range, a => this.hittable(a)) || this.infectedMacNear(n, n.u - N.range, n.u + N.range, N.range);
      if (aim) {
        n.cd = N.fireEvery;
        const d = Math.hypot(aim.u - n.u, aim.v - n.v), tt = d / N.shotSpeed;
        const au = aim.u + (aim.vu || 0) * tt, av = aim.v + (aim.vv || 0) * tt;
        const a = Math.atan2(av - n.v, au - n.u) + (r() - 0.5) * 2 * (N.spread + (tier >= 2 ? F.feverSpread : 0));
        this.shots.push({ u: n.u, v: n.v, pu: n.u, pv: n.v, du: Math.cos(a), dv: Math.sin(a), life: N.range * 1.4 / N.shotSpeed, tuned: n.boosted, from: n.id });
        n.vu -= Math.cos(a) * 4; n.vv -= Math.sin(a) * 4; // a little recoil
      } else n.cd = 0.05;
    }
  }
  infectedMacNear(n, lo, hi, maxD) {
    let best = null, bd = (maxD || 2000) ** 2;
    for (const m of this.cells) if (m.type === 'mac' && m.tb && !m.dead && m.u >= lo && m.u <= hi) { const d = (m.u - n.u) ** 2 + (m.v - n.v) ** 2; if (d < bd) { bd = d; best = m; } }
    return best;
  }
  stepNet(c, dt, slow) {
    const C = CONFIG, N = C.net;
    if (c.infected) { c.infected -= dt; if (c.infected <= 0) { this.killCell(c, 'burst'); return; } }
    const [lo, hi] = this.band(c.home);
    c.retarget -= dt;
    if (c.retarget <= 0) {
      c.retarget = 0.8;
      // the thickest crowd of small things in this zone
      let best = 0, bu = null, bv = null;
      for (const i of this.gA.used) {
        const b = this.gA.b[i]; if (b.length < 2) continue;
        const cu = (i % GC + 0.5) * CELL, cvv = (Math.floor(i / GC) + 0.5) * CELL;
        if (cu < lo || cu > hi) continue;
        let n = 0; this.gA.each(cu, cvv, N.burst * 0.8, a => { if (this.netable(a)) n++; });
        if (n > best) { best = n; bu = cu; bv = cvv; }
      }
      if (bu != null) { c.tu = bu; c.tv = bv; }
    }
    if (c.tu >= 0) {
      const du = c.tu - c.u, dv = c.tv - c.v, d = Math.hypot(du, dv);
      if (d < 7 || c.age >= N.fuse) { this.burstNet(c); return; }
      this.steer(c, du / d * N.speed * slow, dv / d * N.speed * slow, 260, dt);
    } else {
      if (c.age >= N.fuse) { this.burstNet(c); return; }
      this.steer(c, ((c.home + 0.5) * ZONE - c.u) * 0.3, (NODE.v - c.v) * 0.3, 120, dt);
    }
  }
  netable(a) { return this.hittable(a) && a.k !== 'mrsa' && a.k !== 'worm' ? true : a.k === 'worm' && this.hittable(a); }
  burstNet(c) {
    const C = CONFIG, N = C.net;
    c.dead = true;

  // Tissue, vessel and the wound: one offscreen image in view space

  function zoneRect(z) {

    const nextKey = LEVEL_ORDER[LEVEL_ORDER.indexOf(levelKey) + 1];
    openModal('end', `
      <span class="eyebrow">${esc(game.lv.name)} · ${fmt(r.t)}</span>
      ${r.cause === 'storm' ? '<img class="emblem" data-art="organ-failure" alt="">' : ''}
      <h2>${r.win ? '<span class="glow">Infection cleared</span>' : r.cause === 'storm' ? '<span class="bad">Organ failure</span>' : '<span class="bad">The infection took hold</span>'}</h2>
      <p>${r.reason}</p>
      ${r.win ? `<div class="stars">${[0, 1, 2].map(i => `<img data-art="${i < r.stars ? 'star' : 'star-empty'}" alt="">`).join('')}</div>` : ''}
      <ul class="goals">${r.goals.map(g => `<li class="${g.hit ? 'hit' : ''}">${g.text}</li>`).join('')}</ul>
      <div class="stats">
        <div><b>${s.shotKills}</b><span>shot down</span></div>
        <div><b>${s.swallows}</b><span>swallowed</span></div>
        <div><b>${s.netKills}</b><span>caught in nets</span></div>
        <div><b>${s.stormKills}</b><span>killed by storms</span></div>
        <div><b>${s.toxinDeaths}</b><span>cells lost to toxin</span></div>
        <div><b>${s.peak}</b><span>most antigens at once</span></div>
        <div><b>${Math.round(r.peakTimer * 100)}%</b><span>timer peak</span></div>
        <div><b>${Math.round(r.fatiguePeak)}</b><span>fatigue peak</span></div>
        <div><b>${s.made}</b><span>cells made</span></div>
      </div>
      <canvas id="graph" aria-label="Antigens in each zone over the match"></canvas>
      <div class="legend"><span style="--c:${PAL.germ}">Wound</span><span style="--c:${PAL.antibody}">Tissue</span><span style="--c:${PAL.damage}">Lymph node</span><span style="--c:rgba(180,92,255,.5)">toxin burst</span></div>
      <div class="btnrow">${r.win && nextKey ? `<button class="btn primary" id="next" type="button">Next: ${esc(LEVELS[nextKey].name)}</button>` : ''}<button class="btn ${r.win && nextKey ? '' : 'primary'}" id="again" type="button">Play again</button><button class="btn" id="levelsBtn" type="button">Levels</button></div>`);
    drawGraph();
    if ($('#next')) $('#next').addEventListener('click', () => { levelKey = nextKey; store.set('immuneRtsV3.level', levelKey); newGame(); showStart(); });
    $('#again').addEventListener('click', () => { closeModal(); newGame(); });
    $('#levelsBtn').addEventListener('click', () => { newGame(); showStart(); });
  }
  function drawGraph() {
    const c = $('#graph'), r = c.getBoundingClientRect(), k = Math.min(3, window.devicePixelRatio || 1);
    c.width = r.width * k; c.height = r.height * k;
    const g = c.getContext('2d'); g.scale(k, k);
    const W = r.width, H = r.height, padL = 26, padB = 16, h = game.history;
    const T = Math.max(game.duration, game.t), maxY = Math.max(10, ...h.map(p => Math.max(...p.z)));
    const X = t => padL + (W - padL - 4) * t / T, Y = v => (H - padB) - (H - padB - 6) * v / maxY;
    g.font = `10px ${MONO}`; g.fillStyle = PAL.uiDim; g.strokeStyle = 'rgba(221,230,245,0.12)'; g.lineWidth = 1;
    g.textAlign = 'right'; g.textBaseline = 'middle';
    for (const v of [0, Math.round(maxY / 2), maxY]) { g.beginPath(); g.moveTo(padL, Y(v)); g.lineTo(W, Y(v)); g.stroke(); g.fillText(v, padL - 4, Y(v)); }
    g.textAlign = 'center'; g.textBaseline = 'top';
    for (let t = 0; t <= T; t += 60) { g.textAlign = X(t) > W - 20 ? 'right' : 'center'; g.fillText(fmt(t), Math.min(X(t), W), H - padB + 3); }
    g.fillStyle = 'rgba(180,92,255,0.5)';
    for (const tx of game.toxins) g.fillRect(X(tx.at) - 1, 4, 2, H - padB - 4);
    [PAL.germ, PAL.antibody, PAL.damage].forEach((col, z) => {
      g.strokeStyle = col; g.lineWidth = 2; g.lineJoin = 'round'; g.beginPath();
      h.forEach((p, i) => (i ? g.lineTo : g.moveTo).call(g, X(p.t), Y(p.z[z])));
      g.stroke();
    });
  }

  // ---- game flow ----
  function newGame() {
    game = new Game(levelKey, seed);
    paused = false; acc = 0; endShown = false; parts = []; shake = 0; flashT = 0; collapseT = 0; stormHitT = 0; toasted.clear();
    $('#pauseBtn').setAttribute('aria-label', 'Pause');
    closeSheet(); buildCards();
    hud();
  }

  let hudT = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
    if (game && !paused && !modal && !game.result) {
      acc += dt * SPEEDS[speedIdx];
      let n = 0;
      while (acc >= STEP && n < 12) { game.step(STEP); acc -= STEP; n++; }
      if (n === 12) acc = 0;
    }
    if (game) {
      consumeFx();
      const pdt = paused || modal ? 0 : dt * SPEEDS[speedIdx];
      for (const p of parts) { p.life -= pdt; p.u += p.vu * pdt; p.v += p.vv * pdt; p.vu *= 0.92; p.vv *= 0.92; if (p.vr) p.rot += p.vr * pdt; }
      if (parts.length) parts = parts.filter(p => p.life > 0);
      shake = Math.max(0, shake - pdt * 2.5); flashT = Math.max(0, flashT - pdt); stormHitT = Math.max(0, stormHitT - pdt);
      if (game.result) collapseT += dt;
      if (game.result && !endShown) { hud(); endShown = true; setTimeout(showEnd, game.result.cause === 'storm' ? 2100 : 700); }
    }
    render(now);
    drawProg();
    hudT -= dt;
    if (hudT <= 0) { hudT = 0.1; hud(); }
    requestAnimationFrame(frame);
  }

  // ---- input ----
  function tapZone(z) {
    if (!game || game.result) return;
    game.toggleZone(z);
    const zn = game.zones[z];
    toast(`${zn.name}: ${zn.mode === 'support' ? 'Support' : 'Offense'}`, zn.mode === 'support' ? 'good' : '');
    hud();
  }
  cv.addEventListener('pointerdown', e => {
    if (!game || modal) return;
    if (openZone >= 0) { closeSheet(); return; }
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left - ox) / scale, y = (e.clientY - r.top - oy) / scale;
    if (x < 0 || y < 0 || x > VW || y > VH) return;
    const u = portrait ? y : x;
    tapZone(zoneOf(u));
  });
  function setPaused(p) {
    paused = p; $('#pauseBtn').setAttribute('aria-label', paused ? 'Resume' : 'Pause');
    $('#devPause').textContent = paused ? 'Resume' : 'Pause';
  }
  $('#pauseBtn').addEventListener('click', () => setPaused(!paused));
  $('#output').addEventListener('input', e => { if (game) { game.setOutput(+e.target.value / 100); hud(); } });
  $('#helpBtn').addEventListener('click', () => { if (modal === 'guide') return; if (!modal) showGuide('game', 'units'); });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.key === ' ') { e.preventDefault(); if (!modal) setPaused(!paused); }
    if (!game || modal) return;
    if (e.key >= '1' && e.key <= '3') tapZone(+e.key - 1);
    if (e.key === '-' || e.key === '_') game.setOutput(game.output - 0.1);
    if (e.key === '=' || e.key === '+') game.setOutput(game.output + 0.1);
    if (e.key === 's' || e.key === 'S') game.useStorm();
    if (e.key === 'Escape') closeSheet();
  });

  // ---- dev tools ----
  $('#devBtn').addEventListener('click', () => { $('#dev').hidden = !$('#dev').hidden; });
  $('#devClose').addEventListener('click', () => { $('#dev').hidden = true; });
  $('#speed').addEventListener('input', e => { speedIdx = +e.target.value; $('#speedVal').textContent = `${SPEEDS[speedIdx]}×`; hud(); });
  $('#devPause').addEventListener('click', () => setPaused(!paused));
  $('#devStep').addEventListener('click', () => { if (game && !game.result) for (let i = 0; i < 60; i++) game.step(STEP); });
  $('#devSkip').addEventListener('click', () => { if (game && !game.result) for (let i = 0; i < 900 && !game.result; i++) game.step(STEP); });
  $('#seed').addEventListener('change', e => { seed = Math.max(1, Math.floor(+e.target.value || 1)); store.set('immuneRtsV3.seed', seed); });
  $('#devRestart').addEventListener('click', () => { closeModal(); newGame(); });
  $('#devNewSeed').addEventListener('click', () => { seed = 1 + Math.floor(Math.random() * 9999); $('#seed').value = seed; store.set('immuneRtsV3.seed', seed); closeModal(); newGame(); });
  $('#cheatKind').innerHTML = Object.keys(KINDS).filter(k => k !== 'clos' && k !== 'wormlet').map(k => `<option value="${k}">${esc(KINDS[k].name)}</option>`).join('');
  $('#cheatSpawn').addEventListener('click', () => {
    if (!game) return;
    const k = $('#cheatKind').value;
    if (k === 'strep') game.spawnChain('strep', CONFIG.strep.links, WOUND.u + 30, WOUND.v);
    else if (k === 'worm') game.spawnChain('worm', CONFIG.worm.segments, WOUND.u + 60, WOUND.v);
    else for (let i = 0; i < 10; i++) game.spawnAg(k, null, null, k === 'spore' ? { hatchAt: game.t + CONFIG.spore.hatch } : null);
  });
  $('#cheatClear').addEventListener('click', () => { if (game) for (const b of game.ag) if (!b.eaten) { b.dead = true; game.fx.push({ k: 'pop', u: b.u, v: b.v }); } });
  $('#cheatCalm').addEventListener('click', () => { if (game) game.fatigue = 0; });
  $('#ovRange').addEventListener('change', e => { overlay.range = e.target.checked; });
  $('#ovRotate').addEventListener('change', e => { overlay.portrait = e.target.checked; resize(); });

  const human = k => k.replace(/([A-Z])/g, ' $1').toLowerCase();
  function stepFor(v) { const a = Math.abs(v); return a === 0 ? 0.001 : Math.pow(10, Math.floor(Math.log10(a)) - 1); }
  function buildTuning() {
    const host = $('#tuning'); host.innerHTML = '';
    for (const grp in DEFAULTS) {
      const det = document.createElement('details');
      det.innerHTML = `<summary>${human(grp)}</summary>`;
      for (const key in DEFAULTS[grp]) {
        const def = DEFAULTS[grp][key], id = `t-${grp}-${key}`;
        const f = document.createElement('div'); f.className = 'field';
        f.innerHTML = `<label class="row" for="${id}"><span>${human(key)}</span><input type="number" id="${id}" step="${stepFor(def)}"></label>`;
        const hint = HINTS[`${grp}.${key}`];
        if (hint) f.insertAdjacentHTML('beforeend', `<small>${hint}</small>`);
        det.appendChild(f);
        const inp = f.querySelector('input');
        inp.value = CONFIG[grp][key];
        const mark = () => inp.classList.toggle('changed', +inp.value !== def);
        mark();
        inp.addEventListener('input', () => {
          const v = parseFloat(inp.value); if (!isFinite(v)) return;
          CONFIG[grp][key] = v; mark(); saveTuning();
          buildGraphics();
        });
      }
      host.appendChild(det);
    }
  }
  function tuningDiff() {
    const out = {};
    for (const g in DEFAULTS) for (const k in DEFAULTS[g]) if (DEFAULTS[g][k] !== CONFIG[g][k]) (out[g] = out[g] || {})[k] = CONFIG[g][k];
    return out;
  }
  function saveTuning() { store.set('immuneRtsV3.tuning', tuningDiff()); }
  $('#tuneReset').addEventListener('click', () => {
    for (const g in DEFAULTS) for (const k in DEFAULTS[g]) CONFIG[g][k] = DEFAULTS[g][k];
    saveTuning(); buildTuning(); buildGraphics();
  });
  $('#tuneCopy').addEventListener('click', () => {
    const txt = JSON.stringify(tuningDiff(), null, 1), ta = $('#devJson');
    ta.value = txt; ta.hidden = false;
    const fallback = () => { ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Tuning copied'), fallback); } catch (e) { fallback(); }
  });

  // ---- boot ----
  document.querySelectorAll('img[data-art]').forEach(i => { i.src = artUrl(i.dataset.art); });
  buildTuning();
  $('#seed').value = seed;
  { const O = CONFIG.output; $('#output').style.setProperty('--track', ART.outputTrackCSS(Math.log(O.rest / O.min) / Math.log(O.max / O.min))); }
  ART.loadAll().then(() => {
    Object.assign(img, ART.ready);
    resize();
    new ResizeObserver(resize).observe(stage);
  });
  newGame();
  showStart();
  requestAnimationFrame(frame);
})();

</script>

</html>
