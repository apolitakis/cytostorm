<title>Immune RTS Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-height column. Meters on top, the tissue field in the middle, the four control cards along the bottom.
   Deliberately single-theme: the art is fluorescence microscopy, glowing cells on black. */
:root {
  color-scheme: dark;
  --void: #04050A;
  --panel: #0A0D18;
  --panel2: #10152A;
  --line: #1E2540;
  --ink: #DDE6F5;
  --dim: #7A86A0;
  --cell: #3FE6FF;
  --germ: #FF3DCB;
  --pollen: #C9F25C;
  --gold: #FFD23F;
  --kill: #FF7A3D;
  --repair: #5CFFA1;
  --damage: #FF3B4E;
  --scar: #8A2433;
  --quiet: #7F8FB0;
  --display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--void); color: var(--ink); }
body { margin: 0; font: 14px/1.4 var(--display); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img.ico { width: 18px; height: 18px; flex: none; }

#app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; padding-inline: 16px; box-sizing: border-box; }

/* HUD */
#hud { display: grid; gap: 6px; padding-block: 8px 4px; min-width: 0; }
#hud > * { min-width: 0; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meter { display: grid; gap: 4px; min-width: 0; }
.mlabel { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); white-space: nowrap; }
.mlabel b { margin-left: auto; font: 500 13px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; }
#fLoad { background: var(--germ); box-shadow: 0 0 10px var(--germ); }
#mLoad.pollen #fLoad { background: var(--pollen); box-shadow: 0 0 10px var(--pollen); }
#fHost { background: var(--damage); box-shadow: 0 0 10px var(--damage); }
#fScar { background: var(--scar); z-index: 1; }
.meter.warn b { color: var(--damage); }
.hudrow { display: flex; align-items: center; gap: 8px; }
#clock { flex: none; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; color: var(--dim); min-width: 3.2em; }
#sampleBtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 6px; text-align: left; }
#sampleBtn .strack { position: relative; flex: 1 0 28px; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
#sampleBtn .strack i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); }
#sampleLabel { flex: 0 1 auto; min-width: 0; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sampleBtn.ready { border-color: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
#sampleBtn.ready #sampleLabel { color: var(--gold); }
@keyframes pulse { 50% { box-shadow: 0 0 14px rgba(255, 210, 63, .5); } }
.hbtn { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font: 500 12px var(--mono); min-width: 34px; }
#speedTag { font: 500 12px var(--mono); color: var(--gold); }

/* Stage */
#stage { position: relative; flex: 1; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#banner { min-height: 2.7em; font-size: 12.5px; line-height: 1.35; color: var(--ink); text-wrap: pretty; }
#banner b { color: var(--gold); font-weight: 600; }
#toasts { position: absolute; left: 0; right: 0; bottom: 8px; display: grid; justify-items: center; gap: 4px; pointer-events: none; }
.toast { background: rgba(10, 13, 24, .9); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; animation: toast 2.8s ease forwards; }
.toast.bad { border-color: var(--damage); }
.toast.good { border-color: var(--gold); }
@keyframes toast { 0% { opacity: 0; transform: translateY(6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* Sector sheet */
#sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(10, 13, 24, .96); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; display: grid; gap: 8px; }
.sheethead { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0 8px; }
.sheethead .ico { grid-row: span 2; width: 26px; height: 26px; }
.sheethead h3 { margin: 0; font-size: 15px; font-weight: 650; font-stretch: 85%; white-space: nowrap; }
.sheethead span { grid-column: 2; color: var(--dim); font: 11.5px var(--mono); }
.sheethead button { grid-column: 3; grid-row: 1 / span 2; background: none; border: 0; color: var(--dim); font-size: 22px; line-height: 1; padding: 4px 8px; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.levels button { display: grid; justify-items: center; gap: 2px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; font-size: 12px; }
.levels button img { width: 22px; height: 22px; }
.levels button[aria-pressed="true"] { border-color: var(--lv); color: var(--lv); background: color-mix(in srgb, var(--lv) 12%, var(--panel2)); }
#sheetHint { margin: 0; font-size: 12.5px; color: var(--dim); }

/* Bottom cards */
#bar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-block: 6px 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 8px; display: grid; gap: 5px; min-width: 0; align-content: start; }
.chead { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.chead b { margin-left: auto; font: 500 12px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.seg button { display: flex; align-items: center; justify-content: center; gap: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 4px; font-size: 12.5px; }
.seg button img { width: 16px; height: 16px; }
.seg button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.seg button[data-st="kill"][aria-pressed="true"] { border-color: var(--kill); color: var(--kill); }
.seg button[data-st="repair"][aria-pressed="true"] { border-color: var(--repair); color: var(--repair); }
.seg button[data-st="trap"][aria-pressed="true"] { border-color: var(--damage); color: var(--damage); }
.hint { margin: 0; font-size: 11.5px; line-height: 1.3; color: var(--dim); }
.hint.switching { color: var(--gold); }
#mix { width: 100%; margin: 2px 0; accent-color: var(--cell); }
.mixlabels { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
#feverBtn { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; }
#feverBtn small { margin-left: auto; font: 500 11px var(--mono); color: var(--dim); }
#feverBtn.active { border-color: var(--kill); color: var(--kill); }
#feverBtn:disabled { opacity: .55; cursor: default; }

/* Modals */
#modal { position: fixed; inset: 0; background: rgba(4, 5, 10, .78); display: grid; place-items: center; padding: 16px; z-index: 20; }
.mbox { width: 100%; max-width: 460px; max-height: calc(100% - 8px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; box-sizing: border-box; }
.mbox h2 { margin: 0; font-size: 24px; font-weight: 650; font-stretch: 80%; line-height: 1.05; text-wrap: balance; }
.mbox h2 .glow { color: var(--cell); }
.mbox p { margin: 0; color: var(--dim); }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.howto { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ink); font-size: 13.5px; }
.howto li::marker { color: var(--cell); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 40px 1fr; gap: 2px 12px; align-items: center; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.opt img { grid-row: span 2; width: 40px; height: 40px; }
.opt b { font-size: 16px; font-weight: 650; font-stretch: 85%; }
.opt span { font-size: 12.5px; color: var(--dim); }
.opt:hover { border-color: var(--cell); }
/* Guide */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; position: sticky; top: -18px; background: var(--panel); padding-block: 6px; z-index: 1; }
.tabs button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; font-size: 12.5px; }
.tabs button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.gsec { display: grid; gap: 14px; }
.unit { display: grid; grid-template-columns: 44px 1fr; gap: 2px 12px; align-items: start; }
.unit > img { grid-row: span 3; width: 44px; height: 44px; }
.unit h4 { margin: 0; font-size: 16px; font-weight: 650; font-stretch: 85%; }
.unit h4 small { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-left: 6px; }
.unit .why { margin: 0; color: var(--ink); font-size: 13.5px; }
.unit ul { margin: 2px 0 0; padding-left: 16px; display: grid; gap: 3px; color: var(--dim); font-size: 13px; }
.unit ul b { color: var(--ink); font-weight: 600; }
.phases { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13.5px; }
.phases b { color: var(--cell); }
.linkbtn { background: none; border: 0; color: var(--cell); text-decoration: underline; padding: 2px; justify-self: start; font-size: 13.5px; }
.ghost { background: none; border: 0; color: var(--dim); text-decoration: underline; padding: 4px; justify-self: center; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-weight: 600; white-space: nowrap; }
.btn.primary { border-color: var(--cell); color: var(--cell); }
.stars { font-size: 26px; letter-spacing: 4px; color: var(--gold); line-height: 1; }
.stars .off { color: var(--line); }
.goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
.goals li { display: flex; gap: 8px; }
.goals li::before { content: "\2606"; color: var(--dim); }
.goals li.hit::before { content: "\2605"; color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { display: grid; gap: 1px; }
.stats b { font: 500 16px var(--mono); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--dim); }
.bars { display: grid; gap: 4px; font-size: 12px; }
.bars .row { display: grid; grid-template-columns: 7.5em 1fr 3em; gap: 8px; align-items: center; }
.bars .row span:last-child { font: 12px var(--mono); text-align: right; color: var(--dim); }
.bars .bar { height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.bars .bar i { display: block; height: 100%; background: var(--damage); }
.sub { font-size: 12px; font-weight: 600; color: var(--dim); margin: 2px 0 -4px; }
#graph { width: 100%; height: 170px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--dim); margin-top: -4px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; background: var(--c); }

/* Dev panel */
#dev { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100%); background: rgba(10, 13, 24, .97); border-left: 1px solid var(--line); z-index: 30; overflow: auto; padding: 14px 16px 40px; box-sizing: border-box; display: grid; gap: 12px; align-content: start; font-size: 13px; }
#dev h3 { margin: 0; font-size: 16px; font-weight: 650; font-stretch: 85%; display: flex; align-items: center; }
#dev h3 button { margin-left: auto; }
#dev .grp { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
#dev label.row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
#dev input[type="number"] { width: 5.5em; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: 12px var(--mono); }
#dev input[type="number"].changed { border-color: var(--gold); color: var(--gold); }
#dev .arr { display: flex; gap: 4px; }
#dev .arr input { width: 4em; }
#dev details summary { cursor: pointer; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 4px 0; }
#dev details[open] summary { color: var(--ink); }
#dev details .field { display: grid; gap: 2px; padding: 4px 0; }
#dev details .field small { color: var(--dim); font-size: 11px; line-height: 1.3; }
#dev .devbtns { display: flex; gap: 6px; flex-wrap: wrap; }
#dev .devbtns button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; }
#devJson { width: 100%; min-height: 80px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 11px var(--mono); box-sizing: border-box; }
#speed { width: 100%; accent-color: var(--gold); }
@media (prefers-reduced-motion: reduce) { #sampleBtn.ready { animation: none; } .toast { animation-duration: .01s; animation-delay: 2.6s; } }
</style>

<div id="app">
  <header id="hud">
    <div class="meters">
      <div class="meter" id="mLoad">
        <div class="mlabel"><img class="ico" data-art="meter-pathogen" alt=""><span>Pathogen Load</span><b id="vLoad">0%</b></div>
        <div class="track"><i id="fLoad"></i></div>
      </div>
      <div class="meter" id="mHost">
        <div class="mlabel"><img class="ico" data-art="meter-host" alt=""><span>Host Damage</span><b id="vHost">0%</b></div>
        <div class="track"><i id="fScar"></i><i id="fHost"></i></div>
      </div>
    </div>
    <div class="hudrow">
      <span id="clock">0:00</span>
      <button id="sampleBtn" type="button" aria-label="Lymph node"><img class="ico" data-art="lymph-node" alt=""><span id="sampleLabel">Sample 0%</span><span class="strack"><i id="fSample"></i></span></button>
      <span id="speedTag" hidden></span>
      <button id="pauseBtn" class="hbtn" type="button" aria-label="Pause">II</button>
      <button id="helpBtn" class="hbtn" type="button" aria-label="Guide">?</button>
      <button id="devBtn" class="hbtn" type="button">Dev</button>
    </div>
    <div id="banner" aria-live="polite"></div>
  </header>

  <main id="stage">
    <canvas id="cv" aria-label="Tissue map. Tap a sector to set its alert level."></canvas>
    <div id="toasts"></div>
    <div id="sheet" hidden>
      <div class="sheethead"><img class="ico" id="sheetIcon" alt=""><h3 id="sheetTitle">Wound</h3><span id="sheetStats"></span><button type="button" id="sheetClose" aria-label="Close">&times;</button></div>
      <div class="levels" id="levels"></div>
      <p id="sheetHint"></p>
    </div>
  </main>

  <footer id="bar">
    <div class="card">
      <div class="chead"><span>Neutrophils</span><b id="nCount">0</b></div>
      <div class="seg" data-type="neut">
        <button type="button" data-st="eat"><img data-art="stance-eat" alt="">Eat</button>
        <button type="button" data-st="trap"><img data-art="stance-trap" alt="">Trap</button>
      </div>
      <p class="hint" id="nHint"></p>
    </div>
    <div class="card">
      <div class="chead"><span>Macrophages</span><b id="mCount">0</b></div>
      <div class="seg" data-type="mac">
        <button type="button" data-st="kill"><img data-art="stance-kill" alt="">Kill</button>
        <button type="button" data-st="repair"><img data-art="stance-repair" alt="">Repair</button>
      </div>
      <p class="hint" id="mHint"></p>
    </div>
    <div class="card">
      <div class="chead"><img class="ico" data-art="marrow" alt=""><span>Bone marrow</span><b id="rate"></b></div>
      <input type="range" id="mix" min="0" max="100" step="5" value="70" aria-label="Production mix, neutrophils to macrophages">
      <div class="mixlabels"><span id="mixN">70% neut.</span><span id="mixM">30% macro.</span></div>
    </div>
    <div class="card">
      <button type="button" id="feverBtn"><img class="ico" data-art="fever" alt=""><span>Fever</span><small id="feverState">Ready</small></button>
      <p class="hint">Halves bacterial growth. Hurts the host while on.</p>
    </div>
  </footer>
</div>

<div id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>

<aside id="dev" hidden aria-label="Dev tools">
  <h3>Dev tools <button type="button" class="hbtn" id="devClose">Close</button></h3>
  <div class="grp">
    <label class="row" for="speed"><span>Speed <b id="speedVal">1×</b></span></label>
    <input type="range" id="speed" min="0" max="6" step="1" value="2">
    <div class="devbtns"><button type="button" id="devPause">Pause</button><button type="button" id="devStep">Step 1 s</button></div>
  </div>
  <div class="grp">
    <label class="row" for="seed"><span>Random seed</span><input type="number" id="seed" value="1" min="1" step="1"></label>
    <div class="devbtns"><button type="button" id="devRestart">Restart with seed</button><button type="button" id="devNewSeed">New seed</button><button type="button" id="devMenu">Scenario menu</button></div>
  </div>
  <div class="grp">
    <span>Cheats and overlays</span>
    <div class="devbtns"><button type="button" id="cheatBact">+50 bacteria</button><button type="button" id="cheatSample">Fill sample</button><button type="button" id="cheatClear">Kill all pathogens</button></div>
    <label class="row" for="ovAlarm"><span>Show alarm field</span><input type="checkbox" id="ovAlarm"></label>
    <label class="row" for="ovStats"><span>Show sector stats</span><input type="checkbox" id="ovStats"></label>
  </div>
  <div class="grp">
    <span>Tuning <small style="color:var(--dim)">(live; gold = changed from default; saved in this browser)</small></span>
    <div id="tuning"></div>
    <div class="devbtns"><button type="button" id="tuneCopy">Copy changes as JSON</button><button type="button" id="tuneReset">Reset all</button></div>
    <textarea id="devJson" hidden readonly aria-label="Tuning JSON"></textarea>
  </div>
</aside>

<script>
// Immune RTS prototype art. Generated; edit gen.py, not this file.
// Usage: const img = await ART.load('neutrophil'); ctx.drawImage(img, x - s/2, y - s/2, s, s)
// Map sprites share a 64x64 box centred on the cell; `radius` is the body radius in those units.
// Non-square sprites (shots, trails) give meta.box [w,h] and meta.anchor [x,y]: put the anchor on the object and rotate to its heading.
// Draw cells and fields with ctx.globalCompositeOperation = 'lighter' for the fluorescence look.
const ART = {
  palette: {"void": "#04050A", "cell": "#3FE6FF", "cellHi": "#C8FAFF", "germ": "#FF3DCB", "germHi": "#FFC4EF", "toxin": "#B45CFF", "pollen": "#C9F25C", "pollenHi": "#F1FFC9", "antibody": "#FFD23F", "kill": "#FF7A3D", "repair": "#5CFFA1", "tissue": "#2B3A8C", "tissueHi": "#5468E0", "damage": "#FF3B4E", "blood": "#C2334F", "lymph": "#2FB89A", "ui": "#DDE6F5", "uiDim": "#6E7B96"},
  alert: {"quiet": "#7F8FB0", "watch": "#FFD23F", "inflamed": "#FF7A3D", "max": "#FF3B4E"},
  meta: {"neutrophil": {"kind": "unit", "size": 64, "radius": 13, "note": "Neutrophil, Eat stance (default). Small, fast swarm cell; the three-lobed nucleus is its tell."}, "net": {"kind": "effect", "size": 64, "radius": 28, "note": "DNA net left by a Trap neutrophil. Pins bacteria; tint the sector toward damage while it lasts."}, "neutrophil-trap": {"kind": "unit", "size": 64, "radius": 13, "note": "Neutrophil casting a net (Trap stance, one-way). Broken rim plus strands: it dies doing this."}, "macrophage-kill": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage, Kill stance. Big, slow tank. Orange core = inflammatory (adds Host Damage)."}, "macrophage-repair": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage, Repair stance. Same body, green core = healing tissue and calming the sector."}, "bacterium": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium (rod). Faces +x; rotate to heading. Rod silhouette keeps it distinct from round friendly cells."}, "bacterium-dividing": {"kind": "enemy", "size": 64, "radius": 12, "note": "Bacterium mid-division. Swap in for the last moments before a doubling so growth is visible."}, "bacterium-opsonized": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium coated in antibodies (Opsonize). Gold tags = macrophages eat it faster."}, "bacterium-complement": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium being holed by complement. Orange-rimmed pores; the orange is the inflammation it costs."}, "toxin-burst": {"kind": "effect", "size": 64, "radius": 30, "note": "Toxin burst (area damage). Draw at the blast radius, grow from 40% to 100% and fade out."}, "pollen": {"kind": "enemy", "size": 64, "radius": 18, "note": "Pollen grain (Pollen scenario). Harmless, so it gets its own hue and a calm spiky silhouette, not magenta."}, "antibody": {"kind": "particle", "size": 16, "radius": 2, "note": "Antibody particle (16px box). Draw at 3-6px, hundreds at once: random spin, slow drift, short fade. Spawn rate follows the antibody field."}, "antibody-cloud": {"kind": "field", "size": 64, "radius": 30, "note": "Faint gold haze under dense antibody particles. One stamp per field cell, alpha = density, additive."}, "tissue": {"kind": "tile", "size": 128, "radius": null, "note": "Healthy tissue, seamless 128px tile. Sits under everything; keep it dim."}, "tissue-damaged": {"kind": "tile", "size": 128, "radius": null, "note": "Damaged tissue tile. Cross-fade over 'tissue' by the sector's Host Damage share."}, "vessel-blood": {"kind": "tile", "size": 128, "radius": null, "note": "Blood vessel strip, tiles horizontally (128x64). Edge of the blood-entry sector; new cells emerge from it."}, "vessel-lymph": {"kind": "tile", "size": 128, "radius": null, "note": "Lymph vessel strip, tiles horizontally (128x64). Chevron valves point the way out."}, "wound": {"kind": "tile", "size": 128, "radius": null, "note": "Wound gash overlay (transparent background, 128x64). Lay across the wound sector where bacteria pour in."}, "alert-quiet": {"kind": "icon", "size": 48, "radius": null, "note": "Sector alert: Quiet. Bars = level, colour ramps toward inflammation."}, "alert-watch": {"kind": "icon", "size": 48, "radius": null, "note": "Sector alert: Watch. Bars = level, colour ramps toward inflammation."}, "alert-inflamed": {"kind": "icon", "size": 48, "radius": null, "note": "Sector alert: Inflamed. Bars = level, colour ramps toward inflammation."}, "alert-max": {"kind": "icon", "size": 48, "radius": null, "note": "Sector alert: Max. Bars = level, colour ramps toward inflammation."}, "fever": {"kind": "icon", "size": 48, "radius": null, "note": "Fever (body-wide ability). Slows bacterial growth, costs Host Damage, has a cooldown."}, "stance-eat": {"kind": "icon", "size": 48, "radius": null, "note": "Neutrophil stance: Eat (default). Engulf bacteria one at a time."}, "stance-trap": {"kind": "icon", "size": 48, "radius": null, "note": "Neutrophil stance: Trap (one-way). Cells die casting nets that pin bacteria but damage tissue."}, "stance-kill": {"kind": "icon", "size": 48, "radius": null, "note": "Macrophage stance: Kill. Fights hard, adds inflammation."}, "stance-repair": {"kind": "icon", "size": 48, "radius": null, "note": "Macrophage stance: Repair. Heals tissue and calms the sector."}, "marrow": {"kind": "icon", "size": 48, "radius": null, "note": "Bone marrow (production mix). Pair with the neutrophil and macrophage sprites at each end of the slider."}, "meter-pathogen": {"kind": "icon", "size": 48, "radius": null, "note": "Pathogen Load meter icon. Fill the bar in the bacteria magenta."}, "meter-host": {"kind": "icon", "size": 48, "radius": null, "note": "Host Damage meter icon (cracked tissue cell). Fill the bar in damage red."}, "lymph-node": {"kind": "icon", "size": 48, "radius": null, "note": "Lymph node / sample bar. Fills as macrophages eat bacteria; full = antibody choice."}, "choice-opsonize": {"kind": "icon", "size": 48, "radius": null, "note": "Adaptive choice: Opsonize. Macrophages eat tagged bacteria faster, with no extra inflammation."}, "choice-complement": {"kind": "icon", "size": 48, "radius": null, "note": "Adaptive choice: Complement. Punches holes in bacteria directly; adds inflammation."}, "sector-blood": {"kind": "icon", "size": 48, "radius": null, "note": "Sector label: blood entry. Reinforcements arrive here."}, "sector-wound": {"kind": "icon", "size": 48, "radius": null, "note": "Sector label: wound. Where the infection starts."}, "sector-lymph": {"kind": "icon", "size": 48, "radius": null, "note": "Sector label: lymph exit. Samples leave here for the lymph node."}, "scenario-papercut": {"kind": "icon", "size": 48, "radius": null, "note": "Scenario: Papercut (rout). Clear the infection."}, "scenario-pollen": {"kind": "icon", "size": 48, "radius": null, "note": "Scenario: Pollen (restraint). Harmless invader; win by not hurting the host."}, "shot": {"kind": "projectile", "size": 64, "radius": 2.2, "note": "Neutrophil shot: a gold antibody tracer (64x16). Faces +x, head at the anchor. About 14px long on a phone.", "box": [64, 16], "anchor": [54, 8]}, "shot-tuned": {"kind": "projectile", "size": 64, "radius": 3.4, "note": "Tuned shot from inside a Support ring: thicker, white-hot, with a piercing tip. Draw ~1.4x the plain shot.", "box": [64, 16], "anchor": [54, 8]}, "hit-spark": {"kind": "effect", "size": 32, "radius": 14, "note": "Hit spark. Flash for ~80 ms where a shot lands; also the ricochet when a plain shot bounces off armor."}, "kill-shard": {"kind": "particle", "size": 16, "radius": 4, "note": "Kill fragment (16px). On a kill, throw 4-6 outward with random spin and fade over ~0.4 s."}, "bacterium-hit": {"kind": "enemy", "size": 64, "radius": 9, "note": "Bacterium flashed white on a hit. Swap in for ~80 ms and nudge it back along the shot."}, "bacterium-armored": {"kind": "enemy", "size": 64, "radius": 19, "note": "Armored bacterium: the rod inside a thick plated ring. Plain shots bounce off; tuned shots and Offense macrophages kill it."}, "bacterium-armored-dividing": {"kind": "enemy", "size": 64, "radius": 22, "note": "Armored bacterium mid-division (every 20 s). The shell stretches around both halves."}, "macrophage-offense": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage on Offense (v2). Orange core: swallows the nearest bacterium, one every 2 s."}, "macrophage-support": {"kind": "unit", "size": 64, "radius": 22, "note": "Macrophage on Support (v2). Green core: stays put; pair with support-ring under it."}, "support-ring": {"kind": "field", "size": 128, "radius": 60, "note": "Support macrophage's ring (128 box, edge at 60). Width on screen = ring radius x 128/60. Pulse gently: scale 0.97-1.03 and alpha 0.7-1 over ~1.6 s."}, "speed-trail": {"kind": "effect", "size": 48, "radius": null, "note": "Speed trail behind a boosted neutrophil (48x16). Faces +x; put the anchor on the neutrophil's centre, rotate to its heading, draw before the cell. Height ~ the cell's body diameter.", "box": [48, 16], "anchor": [36, 8]}, "wound-flash": {"kind": "effect", "size": 128, "radius": null, "note": "Toxin warning: stretch over the Wound zone and blink it (about 3 Hz) for the 2 s before a burst."}, "toxin-shockwave": {"kind": "effect", "size": 256, "radius": 118, "note": "Toxin shockwave (256 box, front at 118). Grow from the wound until it covers the zone in ~0.5 s, fade out, shake the screen lightly. Kills your cells it passes."}, "marker-wave": {"kind": "marker", "size": 24, "radius": null, "note": "Progress bar: a wave of bacteria still to come."}, "marker-wave-armored": {"kind": "marker", "size": 24, "radius": null, "note": "Progress bar: a wave of armored bacteria."}, "marker-wave-final": {"kind": "marker", "size": 24, "radius": null, "note": "Progress bar: the final wave (bigger, ringed)."}, "marker-toxin": {"kind": "marker", "size": 24, "radius": null, "note": "Progress bar: a toxin burst in the Wound (diamond)."}, "mode-offense": {"kind": "icon", "size": 48, "radius": null, "note": "Zone chip: Offense. Macrophages here swallow bacteria."}, "mode-support": {"kind": "icon", "size": 48, "radius": null, "note": "Zone chip: Support. Neutrophils in the ring move faster and fire tuned shots."}, "sector-tissue": {"kind": "icon", "size": 48, "radius": null, "note": "Zone label: Tissue (the middle zone)."}, "pause": {"kind": "icon", "size": 48, "radius": null, "note": "Pause button."}, "star": {"kind": "icon", "size": 48, "radius": null, "note": "Win star (earned)."}, "star-empty": {"kind": "icon", "size": 48, "radius": null, "note": "Win star (not earned)."}},

      const i = new Image();
      i.onload = () => { this.ready[name] = i; ok(i); }; i.onerror = err;
      i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(this.svg[name]);
    });
    return this._img[name];
  },
  loadAll() {
    return Promise.all(Object.keys(this.svg).map(n => this.load(n))).then(() => this);
  },
  // Pre-render a sprite to an offscreen canvas at a fixed pixel size (fast to blit hundreds of times).
  async sprite(name, px) {
    const img = await this.load(name), c = document.createElement('canvas');

    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

  // ---- v2 HUD helpers (call after loadAll) ----
  // Lymph node infection timer: a ring that fills red clockwise from 12 o'clock.
  // frac 0..1; beating = bacteria inside the node (adds a double-thump heartbeat); t = seconds, for the pulse.
  drawTimer(ctx, x, y, r, frac, { beating = false, t = 0 } = {}) {
    const red = this.palette.damage, k = beating ? 1 + 0.08 * this._beat(t) : 1, R = r * k;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(3, r * 0.22);
    ctx.strokeStyle = 'rgba(255,59,78,0.18)';
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = Math.max(1, r * 0.06); ctx.strokeStyle = 'rgba(255,59,78,0.45)';
    for (let i = 0; i < 12; i++) {           // tick marks every 1/12
      const a = i / 12 * Math.PI * 2 - Math.PI / 2, i0 = R - r * 0.42, i1 = R - r * 0.3;
      ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * i0, y + Math.sin(a) * i0); ctx.lineTo(x + Math.cos(a) * i1, y + Math.sin(a) * i1); ctx.stroke();
    }
    if (frac > 0) {
      const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * Math.min(1, frac);
      ctx.strokeStyle = red; ctx.lineWidth = Math.max(3, r * 0.22);
      ctx.shadowColor = red; ctx.shadowBlur = r * (beating ? 0.9 : 0.5);
      ctx.beginPath(); ctx.arc(x, y, R, a0, a1); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = '#FFE1E5';
      ctx.beginPath(); ctx.arc(x + Math.cos(a1) * R, y + Math.sin(a1) * R, Math.max(1.5, r * 0.09), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  },
  _beat(t) {  // lub-dub at ~70 bpm, 0..1
    const p = (t * 70 / 60) % 1, b = (c, w) => Math.exp(-(((p - c) / w) ** 2));
    return Math.max(b(0.05, 0.05), 0.6 * b(0.25, 0.05));
  },
  // Level progress bar. frac 0..1; events = [{at: 0..1, kind: 'wave'|'wave-armored'|'wave-final'|'toxin'}].
  // Events already passed dim out; the next one glows.
  drawProgress(ctx, x, y, w, h, frac, events = []) {
    ctx.save();
    const r = h / 2, f = Math.max(0, Math.min(1, frac));
    ctx.fillStyle = 'rgba(221,230,245,0.08)'; ctx.strokeStyle = 'rgba(221,230,245,0.3)'; ctx.lineWidth = 1;
    this._pill(ctx, x, y, w, h, r); ctx.fill(); ctx.stroke();
    if (f > 0) {
      const g = ctx.createLinearGradient(x, 0, x + w * f, 0);
      g.addColorStop(0, 'rgba(63,230,255,0.15)'); g.addColorStop(1, 'rgba(63,230,255,0.55)');
      ctx.fillStyle = g; this._pill(ctx, x, y, Math.max(h, w * f), h, r); ctx.fill();
      ctx.fillStyle = this.palette.cellHi; ctx.fillRect(x + w * f - 1, y - 2, 2, h + 4);
    }
    const next = events.filter(e => e.at > f).sort((a, b) => a.at - b.at)[0];
    for (const e of events) {
      const img = this.ready['marker-' + e.kind]; if (!img) continue;
      const s = h * (e.kind === 'wave-final' ? 2.6 : 2.1) * (e === next ? 1.15 : 1);
      ctx.globalAlpha = e.at <= f ? 0.25 : 1;
      ctx.drawImage(img, x + w * e.at - s / 2, y + h / 2 - s / 2, s, s);
    }
    ctx.restore();
  },
  _pill(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  },
};

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

};

    this.t = 0;
    this.inf = new Float32Array(N); this.alarm = new Float32Array(N); this.ab = new Float32Array(N);
    this.vis = new Float32Array(N); this.tmp = new Float32Array(N);
    this.sectors = SECTOR_DEFS.map((d, i) => ({ ...d, alert: this.sc.alerts[i], dmg: 0, inf: 0 }));
    this.secAlarm = [0, 0, 0];
    this.path = []; this.neut = []; this.mac = []; this.nets = []; this.debris = []; this.fx = [];
    this.scar = 0; this.heal = 0; this.healed = 0; this.taken = 0;
    this.bySource = { bacteria: 0, toxin: 0, inflammation: 0, nets: 0, fever: 0 };
    this.stance = { neut: 'eat', mac: 'kill' };
    this.mix = CONFIG.production.mix;
    this.acc = { n: 0, m: 0, pollen: 0 };
    this.fever = { active: false, left: 0, cd: 0, uses: 0 };
    this.sample = 0;
    this.ad = { state: 'none', choice: null, level: 0, t0: 0, prompted: false };
    this.phase = this.sc.pollen ? 'season' : 'breach';
    this.calmT = 0; this.result = null; this.meanInf = 0;
    this.history = []; this.events = []; this.notices = []; this.inputs = 0;
    this.peakLoad = 0; this.toxReady = 0; this.toxins = 0; this.histT = 0;
    this.hb = Array.from({ length: HX * HY }, () => []);
    const r = this.rng;
    if (this.sc.pollen) {
      for (let i = 0; i < CONFIG.pollen.start; i++) this.spawnPollen();
    } else {
      for (let i = 0; i < CONFIG.bacteria.start; i++) {
        // Seeded along the cut
        this.spawnBact(300 + (r() * 2 - 1) * 130, 450 + (r() + r() - 1) * 22);
      }
    }
    this.record();
  }

  // ---- spawning ----
  spawnBact(x, y) {
    const B = CONFIG.bacteria, r = this.rng;
    this.path.push({ kind: 'b', x, y, vx: 0, vy: 0, rot: r() * 6.28, div: B.doublingTime * (0.3 + r() * 0.9), pin: 0, tc: r() * 1.5, dead: false });
  }
  spawnPollen() {
    const P = CONFIG.pollen, r = this.rng;
    this.path.push({ kind: 'p', x: 40 + r() * 520, y: 450 + (r() + r() - 1) * 120, vx: 0, vy: 0, rot: r() * 6.28,
      life: P.life + (r() * 2 - 1) * P.lifeJitter, pin: 0, dead: false });
  }
  spawnCell(type) {
    const r = this.rng, C = CONFIG;
    const base = type === 'n' ? C.neutrophil.life : C.macrophage.life;
    const c = { type, x: 20 + r() * 560, y: 10, vx: 0, vy: 20, life: base * (0.85 + 0.3 * r()),
      stance: type === 'n' ? this.stance.neut : this.stance.mac, pend: null, pendAt: 0,
      tgt: null, tgtD: null, spot: null, rt: 0, cd: 0, eats: 0, seek: 0, lastEat: -99,
      home: 0, wx: 0, wy: 0, homeT: 6 + r() * 6, dead: false, ph: r() * 6.28 };
    this.setHome(c);
    (type === 'n' ? this.neut : this.mac).push(c);
  }
  randPoint(s) { const r = this.rng; return { x: 40 + r() * 520, y: s * SECTOR_H + 40 + r() * (SECTOR_H - 80) }; }
  chooseHome() {
    const C = CONFIG, w = [0, 0, 0]; let tot = 0;
    for (let s = 0; s < 3; s++) { w[s] = C.alert.weight[this.sectors[s].alert] * (1 + C.alarm.recruit * this.secAlarm[s]); tot += w[s]; }
    let x = this.rng() * tot;
    for (let s = 0; s < 3; s++) { x -= w[s]; if (x <= 0) return s; }
    return 2;
  }
  setHome(c) { c.home = this.chooseHome(); const p = this.randPoint(c.home); c.wx = p.x; c.wy = p.y; }

  // ---- spatial queries over pathogens ----
  rebuildHash() {
    for (const b of this.hb) b.length = 0;
    for (const p of this.path) {
      if (p.dead) continue;
      let bx = (p.x / HB) | 0, by = (p.y / HB) | 0;
      if (bx < 0) bx = 0; else if (bx >= HX) bx = HX - 1;
      if (by < 0) by = 0; else if (by >= HY) by = HY - 1;
      this.hb[by * HX + bx].push(p);
    }
  }
  forNear(x, y, r, fn) {
    const x0 = Math.max(0, ((x - r) / HB) | 0), x1 = Math.min(HX - 1, ((x + r) / HB) | 0);
    const y0 = Math.max(0, ((y - r) / HB) | 0), y1 = Math.min(HY - 1, ((y + r) / HB) | 0), r2 = r * r;
    for (let by = y0; by <= y1; by++) for (let bx = x0; bx <= x1; bx++) {
      for (const p of this.hb[by * HX + bx]) {
        if (p.dead) continue;
        const dx = p.x - x, dy = p.y - y;
        if (dx * dx + dy * dy <= r2) fn(p);
      }
    }
  }
  nearest(x, y, r, kind) {
    let best = null, bd = r * r;
    const x0 = Math.max(0, ((x - r) / HB) | 0), x1 = Math.min(HX - 1, ((x + r) / HB) | 0);
    const y0 = Math.max(0, ((y - r) / HB) | 0), y1 = Math.min(HY - 1, ((y + r) / HB) | 0);
    for (let by = y0; by <= y1; by++) for (let bx = x0; bx <= x1; bx++) {
      for (const p of this.hb[by * HX + bx]) {
        if (p.dead || (kind && p.kind !== kind)) continue;
        const dx = p.x - x, dy = p.y - y, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = p; }
      }
    }
    return best;
  }
  countNear(x, y, r) { let n = 0; this.forNear(x, y, r, () => n++); return n; }
  nearestDebris(x, y, r) {
    let best = null, bd = r * r;
    for (const d of this.debris) {
      if (d.dead) continue;
      const dx = d.x - x, dy = d.y - y, q = dx * dx + dy * dy;
      if (q < bd) { bd = q; best = d; }
    }
    return best;
  }

  // ---- meters ----
  hostDamage() { return this.scar + this.heal; }
  load() {
    const B = CONFIG.bacteria, P = CONFIG.pollen; let w = 0;
    for (const p of this.path) {
      if (p.dead) continue;
      w += p.kind === 'p' ? P.loadWeight : (secOf(p.y) === 1 ? 1 : B.edgeWeight);
    }
    return (w / B.loadCap) * 100;
  }
  addDmg(a, src, s) {
    if (a <= 0) return;
    const f = CONFIG.host.scarFrac;
    this.scar += a * f; this.heal += a * (1 - f); this.taken += a;
    this.bySource[src] += a;
    if (s != null) this.sectors[s].dmg += a;
  }
  // Eat-speed multiplier for a target: opsonized targets are eaten faster.
  opso(p) {
    const ad = this.ad;
    const o = ad.state === 'active' && ad.choice === 'opsonize' ? 1 + CONFIG.adaptive.opsonize * this.ab[cellIdx(p.x, p.y)] : 1;
    return o;
  }
  counts() {
    let b = 0, p = 0;
    for (const q of this.path) if (!q.dead) { if (q.kind === 'b') b++; else p++; }
    return { bacteria: b, pollen: p, neut: this.neut.length, mac: this.mac.length };
  }

  // ---- player inputs ----
  event(type, label) { this.events.push({ t: this.t, type, label }); }
  notice(text, kind) { this.notices.push({ text, kind: kind || 'info' }); }
  setAlert(s, lvl) {
    if (this.result || this.sectors[s].alert === lvl) return;
    this.sectors[s].alert = lvl; this.inputs++;
    this.event('alert', `${this.sectors[s].name}: ${LEVELS[lvl]}`);
  }
  setStance(type, st) {
    if (this.result || this.stance[type] === st) return;
    this.stance[type] = st; this.inputs++;
    const list = type === 'neut' ? this.neut : this.mac, d = CONFIG.world.stanceDelay;
    for (const c of list) { c.pend = st; c.pendAt = this.t + this.rng() * d; }
    this.event('stance', `${type === 'neut' ? 'Neutrophils' : 'Macrophages'}: ${st[0].toUpperCase() + st.slice(1)}`);
  }
  switchProgress(type) {
    const list = type === 'neut' ? this.neut : this.mac;
    if (!list.length) return 1;
    let p = 0; for (const c of list) if (c.pend) p++;
    return 1 - p / list.length;
  }
  setMix(v) {
    if (this.result) return;
    this.mix = Math.max(0, Math.min(1, v)); this.inputs++;
    this.event('mix', `Marrow: ${Math.round(this.mix * 100)}% neutrophils`);
  }
  startFever() {
    const F = this.fever;
    if (this.result || F.active || F.cd > 0) return false;
    F.active = true; F.left = CONFIG.fever.duration; F.uses++; this.inputs++;
    this.event('fever', 'Fever');
    return true;
  }
  chooseAntibody(ch) {
    const ad = this.ad;
    if (ad.state !== 'ready') return;
    this.inputs++;
    if (ch === 'hold') { this.event('hold', 'Held off on antibodies'); return; }
    ad.state = 'ramping'; ad.choice = ch; ad.t0 = this.t;
    this.event('antibody', ch === 'opsonize' ? 'Opsonize' : 'Complement');
  }

  // ---- main tick ----
  step(dt) {
    if (this.result) return;
    const C = CONFIG, r = this.rng;
    this.t += dt;
    const t = this.t;

    // Fever
    const F = this.fever;
    if (F.active) {
      F.left -= dt;
      this.addDmg(C.fever.hostDmg * dt, 'fever', null);
      if (F.left <= 0) { F.active = false; F.cd = C.fever.cooldown; this.notice('Fever broke'); this.event('feverEnd', 'Fever broke'); }
    } else if (F.cd > 0) { F.cd = Math.max(0, F.cd - dt); }
    const growth = F.active ? C.fever.growth : 1;

    // Bone marrow: continuous flow, boosted by escalation
    let boost = 0;
    for (const s of this.sectors) boost += Math.max(0, s.alert - 1);
    const rate = C.production.rate * (1 + C.production.alertBoost * boost);
    this.acc.n += rate * this.mix * dt / C.neutrophil.cost;
    this.acc.m += rate * (1 - this.mix) * dt / C.macrophage.cost;
    while (this.acc.n >= 1) { this.acc.n -= 1; if (this.neut.length + this.mac.length < C.world.popCap) this.spawnCell('n'); }
    while (this.acc.m >= 1) { this.acc.m -= 1; if (this.neut.length + this.mac.length < C.world.popCap) this.spawnCell('m'); }

    // Papercut: bacteria keep pouring in through the cut while it closes
    if (!this.sc.pollen) {
      const B = C.bacteria, sIn = B.inflow * Math.max(0, 1 - t / B.closeTime);
      if (sIn > 0) {
        this.acc.bact = (this.acc.bact || 0) + sIn * dt;
        while (this.acc.bact >= 1) { this.acc.bact -= 1; if (this.path.length < C.world.maxPathogens) this.spawnBact(300 + (r() * 2 - 1) * 130, 450 + (r() + r() - 1) * 14); }
      }
    }

    // Pollen season inflow
    if (this.sc.pollen && t < C.pollen.season) {
      this.acc.pollen += C.pollen.inflow * dt;
      while (this.acc.pollen >= 1) { this.acc.pollen -= 1; if (this.path.length < C.world.maxPathogens) this.spawnPollen(); }
    }

    this.rebuildHash();
    this.updateNets(dt);
    this.updatePathogens(dt, growth);
    this.updateNeut(dt);
    this.updateMac(dt);
    this.updateDebris(dt);
    this.updateFields(dt);
    this.updateAdaptive(dt);

    compact(this.path); compact(this.neut); compact(this.mac); compact(this.nets); compact(this.debris);
    for (const f of this.fx) if (t - f.born > f.dur) f.dead = true;
    compact(this.fx);

    this.checkEnd(dt);
    this.histT += dt;
    if (this.histT >= 1) { this.histT -= 1; this.record(); }
  }

  record() {
    this.history.push({ t: this.t, load: this.load(), host: this.hostDamage(), scar: this.scar, inf: this.meanInf, ab: this.ad.state === 'active' ? this.ad.level : 0 });
  }

  steer(c, tx, ty, sp, dt) {
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy) || 1, k = Math.min(1, 6 * dt);
    c.vx += (dx / d * sp - c.vx) * k; c.vy += (dy / d * sp - c.vy) * k;
  }
  move(c, dt) {
    c.x += c.vx * dt; c.y += c.vy * dt;
    if (c.x < 6) { c.x = 6; c.vx = Math.abs(c.vx); } else if (c.x > W - 6) { c.x = W - 6; c.vx = -Math.abs(c.vx); }
    if (c.y < 6) { c.y = 6; c.vy = Math.abs(c.vy); } else if (c.y > H - 6) { c.y = H - 6; c.vy = -Math.abs(c.vy); }
  }
  // No target in reach: follow the alarm gradient inside the home sector, else patrol.
  idle(c, sp, dt) {
    if (secOf(c.y) !== c.home) { this.steer(c, c.wx, c.wy, sp, dt); return; }
    const gx = Math.min(GW - 2, Math.max(1, (c.x / CELL) | 0)), gy = Math.min(GH - 2, Math.max(1, (c.y / CELL) | 0));
    const a = this.alarm, i = gy * GW + gx;
    const ax = a[i + 1] - a[i - 1], ay = a[i + GW] - a[i - GW], m = Math.hypot(ax, ay);
    if (m > 0.004) this.steer(c, c.x + ax / m * 50, c.y + ay / m * 50, sp, dt);
    else {
      if (Math.hypot(c.wx - c.x, c.wy - c.y) < 15) { const p = this.randPoint(c.home); c.wx = p.x; c.wy = p.y; }
      this.steer(c, c.wx, c.wy, sp * 0.6, dt);
    }
    c.homeT -= dt;
    if (c.homeT <= 0) { c.homeT = 6 + this.rng() * 6; this.setHome(c); }
  }

  // Bacteria are swallowed on contact; a pollen grain takes a while to engulf (faster when antibody-coated).
  engulfed(p, dt) {
    return p.kind !== 'p' || this.rng() < dt * this.opso(p) / CONFIG.pollen.engulf;
  }
  kill(p, sample) {
    p.dead = true;
    if (sample && this.ad.state === 'none') this.sample = Math.min(CONFIG.adaptive.sampleNeeded, this.sample + (p.kind === 'p' ? CONFIG.pollen.sample : 1));
    if (this.fx.length < 160) this.fx.push({ type: 'pop', x: p.x, y: p.y, born: this.t, dur: 0.35, kind: p.kind });
  }
  dieCell(c, leaveDebris) {
    c.dead = true;
    if (leaveDebris) this.debris.push({ x: c.x, y: c.y, life: CONFIG.debris.life, dead: false });
  }

  updateNets(dt) {
    const T = CONFIG.trap, r = this.rng, t = this.t;
    for (const n of this.nets) {
      n.life -= dt;
      if (n.life <= 0) { n.dead = true; continue; }
      const s = secOf(n.y), ci = cellIdx(n.x, n.y);
      this.addDmg(T.hostDmg * dt, 'nets', s);
      this.inf[ci] += T.inflam * dt;
      this.vis[ci] = Math.min(1, this.vis[ci] + 0.02 * dt);
      this.forNear(n.x, n.y, T.netRadius, p => {
        p.pin = t + 0.1;
        if (r() < T.killRate * dt) this.kill(p, false);
      });
    }
  }

  updatePathogens(dt, growth) {
    const C = CONFIG, B = C.bacteria, P = C.pollen, A = C.adaptive, r = this.rng, t = this.t, ad = this.ad;
    const active = ad.state === 'active', comp = active && ad.choice === 'complement';
    const dmg = [0, 0, 0];
    const n = this.path.length;
    let nb = 0;
    for (let i = 0; i < n; i++) if (this.path[i].kind === 'b' && !this.path[i].dead) nb++;
    const room = Math.max(0, 1 - nb / B.capacity);
    for (let i = 0; i < n; i++) {
      const p = this.path[i];
      if (p.dead) continue;
      const pinned = p.pin > t;
      if (!pinned) {
        const sp = p.kind === 'b' ? B.speed : 3;
        if (r() < dt * 0.7) { const a = r() * 6.28; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp; p.rot = a; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x < 8) p.x = 8; else if (p.x > W - 8) p.x = W - 8;
        if (p.y < 30) p.y = 30; else if (p.y > H - 30) p.y = H - 30;
      }
      const ci = cellIdx(p.x, p.y);
      if (p.kind === 'b') {
        this.alarm[ci] += B.alarm * dt;
        dmg[secOf(p.y)] += B.hostDmg * dt;
        this.vis[ci] = Math.min(1, this.vis[ci] + 0.004 * dt);
        if (!pinned) {
          p.div -= dt * growth;
          if (p.div <= 0) {
            const crowded = r() > room || this.countNear(p.x, p.y, B.crowdRadius) >= B.crowdMax;
            if (!crowded && this.path.length < C.world.maxPathogens) {
              const a = r() * 6.28;
              this.spawnBact(p.x + Math.cos(a) * 5, p.y + Math.sin(a) * 5);
              this.path[this.path.length - 1].div = B.doublingTime * (1 + (r() * 2 - 1) * B.jitter);
            }
            p.div = B.doublingTime * (1 + (r() * 2 - 1) * B.jitter) * (crowded ? 0.5 : 1);
          }
        }
        p.tc -= dt;
        if (p.tc <= 0) {
          p.tc = 1 + r();
          if (t >= this.toxReady && r() < C.toxin.chance && this.countNear(p.x, p.y, C.toxin.radius * 0.5) >= C.toxin.quorum) this.toxinBurst(p.x, p.y);
        }
      } else {
        p.life -= dt;
        if (p.life <= 0) { p.dead = true; continue; }
        this.alarm[ci] += P.alarm * dt;
        if (active) this.inf[ci] += A.allergyInflam * this.ab[ci] * dt;
      }
      if (comp && r() < A.complementKill * this.ab[ci] * dt) {
        this.kill(p, false);
        this.inf[ci] += A.complementInflam;
      }
    }
    for (let s = 0; s < 3; s++) this.addDmg(dmg[s], 'bacteria', s);
  }

  toxinBurst(x, y) {
    const X = CONFIG.toxin, s = secOf(y), r = this.rng, R = X.radius;
    this.toxReady = this.t + X.cooldown; this.toxins++;
    this.addDmg(X.hostDmg, 'toxin', s);
    const g0x = Math.max(0, ((x - R) / CELL) | 0), g1x = Math.min(GW - 1, ((x + R) / CELL) | 0);
    const g0y = Math.max(0, ((y - R) / CELL) | 0), g1y = Math.min(GH - 1, ((y + R) / CELL) | 0);
    for (let gy = g0y; gy <= g1y; gy++) for (let gx = g0x; gx <= g1x; gx++) {
      const d = Math.hypot((gx + 0.5) * CELL - x, (gy + 0.5) * CELL - y);
      if (d > R) continue;
      const i = gy * GW + gx, f = 1 - d / R;
      this.inf[i] += X.inflam * f; this.alarm[i] += 0.5 * f; this.vis[i] = Math.min(1, this.vis[i] + 0.3 * f);
    }
    for (const list of [this.neut, this.mac]) for (const c of list) {
      if (c.dead) continue;
      if (Math.hypot(c.x - x, c.y - y) < R && r() < X.killChance * (c.type === 'm' ? 0.4 : 1)) this.dieCell(c, true);
    }
    this.fx.push({ type: 'toxin', x, y, born: this.t, dur: 1.1, r: R });
    this.notice(`Toxin burst in the ${this.sectors[s].name.toLowerCase()}`, 'bad');
    this.event('toxin', 'Toxin burst');
  }

  updateNeut(dt) {
    const C = CONFIG, NC = C.neutrophil, T = C.trap, t = this.t, r = this.rng;
    for (const c of this.neut) {
      if (c.dead) continue;
      c.life -= dt;
      if (c.life <= 0) { this.dieCell(c, true); continue; }
      if (c.pend && t >= c.pendAt) { c.stance = c.pend; c.pend = null; c.tgt = null; c.seek = 0; }
      const lvl = this.sectors[secOf(c.y)].alert, sp = NC.speed * C.alert.speed[lvl];
      c.cd -= dt; c.rt -= dt;
      if (c.stance === 'eat') {
        if (!c.tgt || c.tgt.dead || c.rt <= 0) { c.tgt = this.nearest(c.x, c.y, NC.sense, 'b'); c.rt = 0.35 + r() * 0.2; }
        const g = c.tgt;
        if (g) {
          this.steer(c, g.x, g.y, sp, dt);
          if (Math.hypot(g.x - c.x, g.y - c.y) < 7 && c.cd <= 0 && this.engulfed(g, dt)) {
            this.kill(g, false); c.eats++; c.tgt = null;
            c.cd = NC.eatCooldown / (C.alert.eat[lvl] * this.opso(g));
            if (c.eats >= NC.maxEats) { this.dieCell(c, true); continue; }
          }
        } else this.idle(c, sp, dt);
      } else { // trap: find a crowd, cast a net, die
        c.seek += dt;
        if (!c.tgt || c.tgt.dead || c.rt <= 0) { c.tgt = this.nearest(c.x, c.y, NC.sense * 1.5, 'b'); c.rt = 0.5; }
        const g = c.tgt;
        if (g) {
          this.steer(c, g.x, g.y, sp, dt);
          if (Math.hypot(g.x - c.x, g.y - c.y) < 12) {
            const k = this.countNear(c.x, c.y, T.netRadius);
            if (k >= T.minTargets || c.seek > T.seekTime) {
              c.dead = true;
              this.nets.push({ x: c.x, y: c.y, life: T.netLife, max: T.netLife, rot: r() * 6.28, dead: false });
              continue;
            }
          }
        } else this.idle(c, sp, dt);
      }
      this.move(c, dt);
    }
  }

  updateMac(dt) {
    const C = CONFIG, M = C.macrophage, R = C.repair, t = this.t, r = this.rng;
    const rr = Math.ceil(R.radius / CELL);
    for (const c of this.mac) {
      if (c.dead) continue;
      c.life -= dt;
      if (c.life <= 0) { this.dieCell(c, false); continue; }
      if (c.pend && t >= c.pendAt) { c.stance = c.pend; c.pend = null; c.tgt = null; c.tgtD = null; c.spot = null; c.rt = 0; }
      const lvl = this.sectors[secOf(c.y)].alert, sp = M.speed * C.alert.speed[lvl];
      c.cd -= dt; c.rt -= dt;
      const ci = cellIdx(c.x, c.y);
      if (c.stance === 'kill') {
        if (!c.tgt || c.tgt.dead || c.rt <= 0) {
          c.tgt = this.nearest(c.x, c.y, M.sense);

      // Right side: pathogens here and this sector's share of Host Damage
      const rx = ox + W * scale - 6;
      const txt = `${cnt[s]}`, dm = `${sec.dmg.toFixed(0)}% dmg`;
      const wt = ctx.measureText(txt).width, wd = ctx.measureText(dm).width;
      const bw = 10 + 8 + wt + 10 + wd + 8;
      ctx.fillStyle = 'rgba(4,5,10,0.72)'; roundRect(rx - bw, y, bw, 22, 11); ctx.fill();
      ctx.fillStyle = g.sc.pollen ? PAL.pollen : PAL.germ;
      ctx.beginPath(); ctx.arc(rx - bw + 10, y + 11, 3.5, 0, 6.29); ctx.fill();
      ctx.fillStyle = PAL.ui; ctx.fillText(txt, rx - bw + 18, y + 11.5);
      ctx.fillStyle = sec.dmg > 10 ? PAL.damage : PAL.uiDim; ctx.fillText(dm, rx - wd - 8, y + 11.5);
      if (overlay.stats) {
        let nn = 0, mm = 0;
        for (const c of g.neut) if (secOf(c.y) === s) nn++;
        for (const c of g.mac) if (secOf(c.y) === s) mm++;
        ctx.fillStyle = PAL.uiDim;
        ctx.fillText(`neut ${nn} · mac ${mm} · infl ${(sec.inf * 100).toFixed(0)}% · alarm ${g.secAlarm[s].toFixed(1)}`, x + 4, y + 34);
      }
    }
    if (paused && !modal) {
      ctx.fillStyle = 'rgba(4,5,10,0.55)'; ctx.fillRect(ox, oy, W * scale, H * scale);
      ctx.fillStyle = PAL.ui; ctx.font = '600 20px "Instrument Sans", Arial, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Paused', ox + W * scale / 2, oy + H * scale / 2); ctx.textAlign = 'left';
    }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ---- HUD ----

    else if (ad.state === 'ready') { sl = 'Sample ready: choose antibodies'; sf = 1; }
    else if (ad.state === 'ramping') { sl = `${cap(ad.choice)} antibodies in ${Math.ceil(A.delay - (g.t - ad.t0))}s`; sf = 1; }
    else { sl = `${cap(ad.choice)} antibodies: output ${Math.round(ad.level * 100)}%`; sf = ad.level; }
    $('#sampleLabel').textContent = sl;

  function drawGraph(c, g) {
    const r = c.getBoundingClientRect(), k = Math.min(3, window.devicePixelRatio || 1);
    c.width = Math.round(r.width * k); c.height = Math.round(r.height * k);
    const x = c.getContext('2d'); x.scale(k, k);
    const w = r.width, h = r.height, L = 30, R = 8, T = 16, B = 20, pw = w - L - R, ph = h - T - B;
    const hist = g.history, tEnd = Math.max(60, g.t);
    const X = t => L + t / tEnd * pw, Y = v => T + ph - Math.min(100, v) / 100 * ph;
    x.font = '10px "IBM Plex Mono", monospace'; x.textBaseline = 'middle';
    // grid
    for (const v of [0, 25, 50, 75, 100]) {
      x.strokeStyle = v === 0 ? 'rgba(221,230,245,0.25)' : 'rgba(221,230,245,0.08)';
      x.beginPath(); x.moveTo(L, Y(v)); x.lineTo(w - R, Y(v)); x.stroke();
      x.fillStyle = PAL.uiDim; x.textAlign = 'right'; x.fillText(`${v}`, L - 5, Y(v));
    }
    x.textAlign = 'center';
    const stepT = tEnd > 600 ? 120 : 60;
    for (let t = 0; t <= tEnd; t += stepT) x.fillText(fmt(t), X(t), h - 8);
    // fever spans
    let fs = null;
    for (const e of g.events) {
      if (e.type === 'fever') fs = e.t;
      if (e.type === 'feverEnd' && fs != null) { x.fillStyle = 'rgba(255,122,61,0.13)'; x.fillRect(X(fs), T, X(e.t) - X(fs), ph); fs = null; }
    }
    if (fs != null) { x.fillStyle = 'rgba(255,122,61,0.13)'; x.fillRect(X(fs), T, X(g.t) - X(fs), ph); }
    // markers
    const mark = (t, col, label) => {
      x.strokeStyle = col; x.setLineDash([3, 3]); x.beginPath(); x.moveTo(X(t), T); x.lineTo(X(t), T + ph); x.stroke(); x.setLineDash([]);
      x.fillStyle = col; x.textAlign = X(t) > w - 70 ? 'right' : 'left'; x.fillText(label, X(t) + (x.textAlign === 'left' ? 3 : -3), T - 7);
    };
    for (const e of g.events) {
      if (e.type === 'antibody') mark(e.t, PAL.antibody, e.label);
      if (e.type === 'standdown') mark(e.t, PAL.cell, 'Stand down');
      if (e.type === 'alert' || e.type === 'stance' || e.type === 'mix') { x.fillStyle = PAL.cell; x.fillRect(X(e.t) - 0.5, T + ph - 5, 1.5, 5); }
    }
    const line = (key, col, wdt) => {
      x.strokeStyle = col; x.lineWidth = wdt; x.beginPath();
      hist.forEach((p, i) => { const v = key === 'ab' ? p.ab * 100 : key === 'inf' ? p.inf * 100 : p[key]; i ? x.lineTo(X(p.t), Y(v)) : x.moveTo(X(p.t), Y(v)); });
      x.stroke(); x.lineWidth = 1;
    };
    line('ab', 'rgba(255,210,63,0.7)', 1);
    line('load', g.sc.pollen ? PAL.pollen : PAL.germ, 2);
    line('host', PAL.damage, 2);
  }

  // ---- game lifecycle ----
  function newGame(key, s) {
    scenarioKey = key; setSeed(s);
    game = new Game(key, seed);
    endShown = false; paused = false; acc = 0;
    closeModal(); closeSheet();
    $('#toasts').innerHTML = '';
    hud();
  }
  function setSeed(s) { seed = Math.max(1, Math.floor(+s || 1)); store.set('immuneRts.seed', seed); $('#seed').value = seed; }
  function toast(text, kind) {
    const el = document.createElement('div'); el.className = `toast ${kind || ''}`; el.textContent = text;
    $('#toasts').appendChild(el);
    while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
    setTimeout(() => el.remove(), 2900);
  }

  let hudT = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - (last || now)) / 1000); last = now;
    if (game && !paused && !modal && !game.result) {
      acc += dt * SPEEDS[speedIdx];
      let n = 0;
      while (acc >= STEP && n < 16) { game.step(STEP); acc -= STEP; n++; }
      if (n === 16) acc = 0;
    }
    if (game) {
      for (const m of game.notices.splice(0)) toast(m.text, m.kind);
      if (game.ad.state === 'ready' && !game.ad.prompted && !modal) { game.ad.prompted = true; showChoice(); }
      if (game.result && !endShown) { hud(); showEnd(); }
    }
    render(now);
    hudT -= dt;
    if (hudT <= 0) { hudT = 0.1; hud(); }
    requestAnimationFrame(frame);
  }

  // ---- input wiring ----
  cv.addEventListener('pointerdown', e => {
    if (!game || modal) return;
    const r = cv.getBoundingClientRect(), y = (e.clientY - r.top - oy) / scale, x = (e.clientX - r.left - ox) / scale;
    if (x < 0 || x > W || y < 0 || y > H) { closeSheet(); return; }
    const s = secOf(y);
    if (selSector === s) closeSheet(); else openSheet(s);
  });
  $('#sheetClose').addEventListener('click', closeSheet);
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    if (game) game.setStance(b.parentElement.dataset.type, b.dataset.st); hud();
  }));
  $('#mix').addEventListener('input', e => { $('#mixN').textContent = `${e.target.value}% neut.`; $('#mixM').textContent = `${100 - e.target.value}% macro.`; });
  $('#mix').addEventListener('change', e => { if (game) game.setMix(e.target.value / 100); });
  $('#feverBtn').addEventListener('click', () => { if (game && game.startFever()) toast('Fever is up: bacteria grow at half speed', 'bad'); hud(); });
  $('#sampleBtn').addEventListener('click', () => { if (game && game.ad.state === 'ready' && !modal) showChoice(); });
  $('#pauseBtn').addEventListener('click', () => { paused = !paused; hud(); });
  $('#devBtn').addEventListener('click', () => { $('#dev').hidden = !$('#dev').hidden; });
  $('#helpBtn').addEventListener('click', () => { if (!modal) showGuide('game', 'cells'); });
  $('#devClose').addEventListener('click', () => { $('#dev').hidden = true; });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === ' ' && !modal) { paused = !paused; e.preventDefault(); hud(); }
    if (e.key === 'Escape') { if (selSector != null) closeSheet(); else $('#dev').hidden = true; }
  });

  // ---- dev tools ----
  $('#speed').addEventListener('input', e => { speedIdx = +e.target.value; $('#speedVal').textContent = `${SPEEDS[speedIdx]}×`; hud(); });
  $('#devPause').addEventListener('click', () => { paused = !paused; hud(); });
  $('#devStep').addEventListener('click', () => { if (game && !game.result) { for (let i = 0; i < 60; i++) game.step(STEP); hud(); } });
  $('#devRestart').addEventListener('click', () => newGame(scenarioKey, $('#seed').value));
  $('#devNewSeed').addEventListener('click', () => newGame(scenarioKey, 1 + Math.floor(Math.random() * 99999)));
  $('#devMenu').addEventListener('click', () => { $('#dev').hidden = true; showStart(); });
  $('#cheatBact').addEventListener('click', () => { if (game) for (let i = 0; i < 50; i++) game.spawnBact(300 + (Math.random() * 2 - 1) * 200, 450 + (Math.random() * 2 - 1) * 60); });
  $('#cheatSample').addEventListener('click', () => { if (game && game.ad.state === 'none') game.sample = CONFIG.adaptive.sampleNeeded; });
  $('#cheatClear').addEventListener('click', () => { if (game) for (const p of game.path) p.dead = true; });
  $('#ovAlarm').addEventListener('change', e => { overlay.alarm = e.target.checked; });
  $('#ovStats').addEventListener('change', e => { overlay.stats = e.target.checked; });

  const human = k => k.replace(/([A-Z])/g, ' $1').toLowerCase();
  function stepFor(v) { const a = Math.abs(v); return a === 0 ? 0.001 : Math.pow(10, Math.floor(Math.log10(a)) - 1); }
  function buildTuning() {
    const host = $('#tuning'); host.innerHTML = '';
    for (const grp in DEFAULTS) {
      const det = document.createElement('details');
      det.innerHTML = `<summary>${human(grp)}</summary>`;
      for (const key in DEFAULTS[grp]) {
        const def = DEFAULTS[grp][key], id = `t-${grp}-${key}`;
        const f = document.createElement('div'); f.className = 'field';
        const hint = HINTS[`${grp}.${key}`];
        if (Array.isArray(def)) {
          f.innerHTML = `<label class="row"><span>${human(key)}</span><span class="arr">${def.map((_, i) => `<input type="number" id="${id}-${i}" step="${stepFor(def[i] || def[def.length - 1])}" aria-label="${human(key)} ${LEVELS[i] || i}">`).join('')}</span></label>`;
        } else {
          f.innerHTML = `<label class="row" for="${id}"><span>${human(key)}</span><input type="number" id="${id}" step="${stepFor(def)}"></label>`;
        }
        if (hint) f.insertAdjacentHTML('beforeend', `<small>${hint}</small>`);
        det.appendChild(f);
        f.querySelectorAll('input').forEach((inp, i) => {
          const isArr = Array.isArray(def);
          inp.value = isArr ? CONFIG[grp][key][i] : CONFIG[grp][key];
          const mark = () => inp.classList.toggle('changed', +inp.value !== (isArr ? def[i] : def));
          mark();
          inp.addEventListener('input', () => {
            const v = parseFloat(inp.value); if (!isFinite(v)) return;
            if (isArr) CONFIG[grp][key][i] = v; else CONFIG[grp][key] = v;
            mark(); saveTuning();
            if (grp === 'trap' || grp === 'toxin') buildGraphics();
          });
        });
      }
      host.appendChild(det);
    }
  }
  function tuningDiff() {
    const out = {};
    for (const g in DEFAULTS) for (const k in DEFAULTS[g]) {
      if (JSON.stringify(DEFAULTS[g][k]) !== JSON.stringify(CONFIG[g][k])) (out[g] = out[g] || {})[k] = CONFIG[g][k];
    }
    return out;
  }
  function saveTuning() { store.set('immuneRts.tuning', tuningDiff()); }
  $('#tuneReset').addEventListener('click', () => {
    for (const g in DEFAULTS) for (const k in DEFAULTS[g]) CONFIG[g][k] = clone(DEFAULTS[g][k]);
    saveTuning(); buildTuning(); buildGraphics();
  });
  $('#tuneCopy').addEventListener('click', () => {
    const txt = JSON.stringify(tuningDiff(), null, 1), ta = $('#devJson');
    ta.value = txt; ta.hidden = false;
    const fallback = () => { ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Tuning copied'), fallback); } catch (e) { fallback(); }
  });

  // ---- boot ----
  document.querySelectorAll('img[data-art]').forEach(i => { i.src = artUrl(i.dataset.art); });
  buildLevels();
  buildTuning();
  $('#seed').value = seed;
  const names = Object.keys(ART.svg);
  Promise.all(names.map(n => ART.load(n).then(im => { img[n] = im; }))).then(() => {
    resize();
    new ResizeObserver(resize).observe(stage);
  });
  showStart();
  requestAnimationFrame(frame);
})();

</script>
