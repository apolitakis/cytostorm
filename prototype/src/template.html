<title>Immune RTS Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-height column. Meters on top, the tissue field in the middle, the four control cards along the bottom.
   Deliberately single-theme: the art is fluorescence microscopy, glowing cells on black. */
:root {
  color-scheme: dark;
  --void: #04050A;
  --panel: #0A0D18;
  --panel2: #10152A;
  --line: #1E2540;
  --ink: #DDE6F5;
  --dim: #7A86A0;
  --cell: #3FE6FF;
  --germ: #FF3DCB;
  --pollen: #C9F25C;
  --gold: #FFD23F;
  --kill: #FF7A3D;
  --repair: #5CFFA1;
  --damage: #FF3B4E;
  --scar: #8A2433;
  --quiet: #7F8FB0;
  --display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--void); color: var(--ink); }
body { margin: 0; font: 14px/1.4 var(--display); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img.ico { width: 18px; height: 18px; flex: none; }

#app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; padding-inline: 16px; box-sizing: border-box; }

/* HUD */
#hud { display: grid; gap: 6px; padding-block: 8px 4px; min-width: 0; }
#hud > * { min-width: 0; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meter { display: grid; gap: 4px; min-width: 0; }
.mlabel { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); white-space: nowrap; }
.mlabel b { margin-left: auto; font: 500 13px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; }
#fLoad { background: var(--germ); box-shadow: 0 0 10px var(--germ); }
#mLoad.pollen #fLoad { background: var(--pollen); box-shadow: 0 0 10px var(--pollen); }
#fHost { background: var(--damage); box-shadow: 0 0 10px var(--damage); }
#fScar { background: var(--scar); z-index: 1; }
.meter.warn b { color: var(--damage); }
.hudrow { display: flex; align-items: center; gap: 8px; }
#clock { flex: none; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; color: var(--dim); min-width: 3.2em; }
#sampleBtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 6px; text-align: left; }
#sampleBtn .strack { position: relative; flex: 1 0 28px; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
#sampleBtn .strack i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); }
#sampleLabel { flex: 0 1 auto; min-width: 0; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sampleBtn.ready { border-color: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
#sampleBtn.ready #sampleLabel { color: var(--gold); }
@keyframes pulse { 50% { box-shadow: 0 0 14px rgba(255, 210, 63, .5); } }
.hbtn { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font: 500 12px var(--mono); min-width: 34px; }
#speedTag { font: 500 12px var(--mono); color: var(--gold); }

/* Stage */
#stage { position: relative; flex: 1; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#banner { min-height: 2.7em; font-size: 12.5px; line-height: 1.35; color: var(--ink); text-wrap: pretty; }
#banner b { color: var(--gold); font-weight: 600; }
#toasts { position: absolute; left: 0; right: 0; bottom: 8px; display: grid; justify-items: center; gap: 4px; pointer-events: none; }
.toast { background: rgba(10, 13, 24, .9); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; animation: toast 2.8s ease forwards; }
.toast.bad { border-color: var(--damage); }
.toast.good { border-color: var(--gold); }
@keyframes toast { 0% { opacity: 0; transform: translateY(6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* Sector sheet */
#sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(10, 13, 24, .96); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; display: grid; gap: 8px; }
.sheethead { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0 8px; }
.sheethead .ico { grid-row: span 2; width: 26px; height: 26px; }
.sheethead h3 { margin: 0; font-size: 15px; font-weight: 650; font-stretch: 85%; white-space: nowrap; }
.sheethead span { grid-column: 2; color: var(--dim); font: 11.5px var(--mono); }
.sheethead button { grid-column: 3; grid-row: 1 / span 2; background: none; border: 0; color: var(--dim); font-size: 22px; line-height: 1; padding: 4px 8px; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.levels button { display: grid; justify-items: center; gap: 2px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; font-size: 12px; }
.levels button img { width: 22px; height: 22px; }
.levels button[aria-pressed="true"] { border-color: var(--lv); color: var(--lv); background: color-mix(in srgb, var(--lv) 12%, var(--panel2)); }
#sheetHint { margin: 0; font-size: 12.5px; color: var(--dim); }

/* Bottom cards */
#bar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-block: 6px 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 8px; display: grid; gap: 5px; min-width: 0; align-content: start; }
.chead { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.chead b { margin-left: auto; font: 500 12px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.seg button { display: flex; align-items: center; justify-content: center; gap: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 4px; font-size: 12.5px; }
.seg button img { width: 16px; height: 16px; }
.seg button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.seg button[data-st="kill"][aria-pressed="true"] { border-color: var(--kill); color: var(--kill); }
.seg button[data-st="repair"][aria-pressed="true"] { border-color: var(--repair); color: var(--repair); }
.seg button[data-st="trap"][aria-pressed="true"] { border-color: var(--damage); color: var(--damage); }
.hint { margin: 0; font-size: 11.5px; line-height: 1.3; color: var(--dim); }
.hint.switching { color: var(--gold); }
#mix { width: 100%; margin: 2px 0; accent-color: var(--cell); }
.mixlabels { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
#feverBtn { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; }
#feverBtn small { margin-left: auto; font: 500 11px var(--mono); color: var(--dim); }
#feverBtn.active { border-color: var(--kill); color: var(--kill); }
#feverBtn:disabled { opacity: .55; cursor: default; }

/* Modals */
#modal { position: fixed; inset: 0; background: rgba(4, 5, 10, .78); display: grid; place-items: center; padding: 16px; z-index: 20; }
.mbox { width: 100%; max-width: 460px; max-height: calc(100% - 8px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; box-sizing: border-box; }
.mbox h2 { margin: 0; font-size: 24px; font-weight: 650; font-stretch: 80%; line-height: 1.05; text-wrap: balance; }
.mbox h2 .glow { color: var(--cell); }
.mbox p { margin: 0; color: var(--dim); }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.howto { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ink); font-size: 13.5px; }
.howto li::marker { color: var(--cell); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 40px 1fr; gap: 2px 12px; align-items: center; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.opt img { grid-row: span 2; width: 40px; height: 40px; }
.opt b { font-size: 16px; font-weight: 650; font-stretch: 85%; }
.opt span { font-size: 12.5px; color: var(--dim); }
.opt:hover { border-color: var(--cell); }
/* Guide */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; position: sticky; top: -18px; background: var(--panel); padding-block: 6px; z-index: 1; }
.tabs button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; font-size: 12.5px; }
.tabs button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.gsec { display: grid; gap: 14px; }
.unit { display: grid; grid-template-columns: 44px 1fr; gap: 2px 12px; align-items: start; }
.unit > img { grid-row: span 3; width: 44px; height: 44px; }
.unit h4 { margin: 0; font-size: 16px; font-weight: 650; font-stretch: 85%; }
.unit h4 small { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-left: 6px; }
.unit .why { margin: 0; color: var(--ink); font-size: 13.5px; }
.unit ul { margin: 2px 0 0; padding-left: 16px; display: grid; gap: 3px; color: var(--dim); font-size: 13px; }
.unit ul b { color: var(--ink); font-weight: 600; }
.phases { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13.5px; }
.phases b { color: var(--cell); }
.linkbtn { background: none; border: 0; color: var(--cell); text-decoration: underline; padding: 2px; justify-self: start; font-size: 13.5px; }
.ghost { background: none; border: 0; color: var(--dim); text-decoration: underline; padding: 4px; justify-self: center; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-weight: 600; white-space: nowrap; }
.btn.primary { border-color: var(--cell); color: var(--cell); }
.stars { font-size: 26px; letter-spacing: 4px; color: var(--gold); line-height: 1; }
.stars .off { color: var(--line); }
.goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
.goals li { display: flex; gap: 8px; }
.goals li::before { content: "\2606"; color: var(--dim); }
.goals li.hit::before { content: "\2605"; color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { display: grid; gap: 1px; }
.stats b { font: 500 16px var(--mono); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--dim); }
.bars { display: grid; gap: 4px; font-size: 12px; }
.bars .row { display: grid; grid-template-columns: 7.5em 1fr 3em; gap: 8px; align-items: center; }
.bars .row span:last-child { font: 12px var(--mono); text-align: right; color: var(--dim); }
.bars .bar { height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.bars .bar i { display: block; height: 100%; background: var(--damage); }
.sub { font-size: 12px; font-weight: 600; color: var(--dim); margin: 2px 0 -4px; }
#graph { width: 100%; height: 170px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--dim); margin-top: -4px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; background: var(--c); }

/* Dev panel */
#dev { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100%); background: rgba(10, 13, 24, .97); border-left: 1px solid var(--line); z-index: 30; overflow: auto; padding: 14px 16px 40px; box-sizing: border-box; display: grid; gap: 12px; align-content: start; font-size: 13px; }
#dev h3 { margin: 0; font-size: 16px; font-weight: 650; font-stretch: 85%; display: flex; align-items: center; }
#dev h3 button { margin-left: auto; }
#dev .grp { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
#dev label.row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
#dev input[type="number"] { width: 5.5em; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: 12px var(--mono); }
#dev input[type="number"].changed { border-color: var(--gold); color: var(--gold); }
#dev .arr { display: flex; gap: 4px; }
#dev .arr input { width: 4em; }
#dev details summary { cursor: pointer; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 4px 0; }
#dev details[open] summary { color: var(--ink); }
#dev details .field { display: grid; gap: 2px; padding: 4px 0; }
#dev details .field small { color: var(--dim); font-size: 11px; line-height: 1.3; }
#dev .devbtns { display: flex; gap: 6px; flex-wrap: wrap; }
#dev .devbtns button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; }
#devJson { width: 100%; min-height: 80px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 11px var(--mono); box-sizing: border-box; }
#speed { width: 100%; accent-color: var(--gold); }
@media (prefers-reduced-motion: reduce) { #sampleBtn.ready { animation: none; } .toast { animation-duration: .01s; animation-delay: 2.6s; } }
</style>

<div id="app">
  <header id="hud">
    <div class="meters">
      <div class="meter" id="mLoad">
        <div class="mlabel"><img class="ico" data-art="meter-pathogen" alt=""><span>Pathogen Load</span><b id="vLoad">0%</b></div>
        <div class="track"><i id="fLoad"></i></div>
      </div>
      <div class="meter" id="mHost">
        <div class="mlabel"><img class="ico" data-art="meter-host" alt=""><span>Host Damage</span><b id="vHost">0%</b></div>
        <div class="track"><i id="fScar"></i><i id="fHost"></i></div>
      </div>
    </div>
    <div class="hudrow">
      <span id="clock">0:00</span>
      <button id="sampleBtn" type="button" aria-label="Lymph node"><img class="ico" data-art="lymph-node" alt=""><span id="sampleLabel">Sample 0%</span><span class="strack"><i id="fSample"></i></span></button>
      <span id="speedTag" hidden></span>
      <button id="pauseBtn" class="hbtn" type="button" aria-label="Pause">II</button>
      <button id="helpBtn" class="hbtn" type="button" aria-label="Guide">?</button>
      <button id="devBtn" class="hbtn" type="button">Dev</button>
    </div>
    <div id="banner" aria-live="polite"></div>
  </header>

  <main id="stage">
    <canvas id="cv" aria-label="Tissue map. Tap a sector to set its alert level."></canvas>
    <div id="toasts"></div>
    <div id="sheet" hidden>
      <div class="sheethead"><img class="ico" id="sheetIcon" alt=""><h3 id="sheetTitle">Wound</h3><span id="sheetStats"></span><button type="button" id="sheetClose" aria-label="Close">&times;</button></div>
      <div class="levels" id="levels"></div>
      <p id="sheetHint"></p>
    </div>
  </main>

  <footer id="bar">
    <div class="card">
      <div class="chead"><span>Neutrophils</span><b id="nCount">0</b></div>
      <div class="seg" data-type="neut">
        <button type="button" data-st="eat"><img data-art="stance-eat" alt="">Eat</button>
        <button type="button" data-st="trap"><img data-art="stance-trap" alt="">Trap</button>
      </div>
      <p class="hint" id="nHint"></p>
    </div>
    <div class="card">
      <div class="chead"><span>Macrophages</span><b id="mCount">0</b></div>
      <div class="seg" data-type="mac">
        <button type="button" data-st="kill"><img data-art="stance-kill" alt="">Kill</button>
        <button type="button" data-st="repair"><img data-art="stance-repair" alt="">Repair</button>
      </div>
      <p class="hint" id="mHint"></p>
    </div>
    <div class="card">
      <div class="chead"><img class="ico" data-art="marrow" alt=""><span>Bone marrow</span><b id="rate"></b></div>
      <input type="range" id="mix" min="0" max="100" step="5" value="70" aria-label="Production mix, neutrophils to macrophages">
      <div class="mixlabels"><span id="mixN">70% neut.</span><span id="mixM">30% macro.</span></div>
    </div>
    <div class="card">
      <button type="button" id="feverBtn"><img class="ico" data-art="fever" alt=""><span>Fever</span><small id="feverState">Ready</small></button>
      <p class="hint">Halves bacterial growth. Hurts the host while on.</p>
    </div>
  </footer>
</div>

<div id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>

<aside id="dev" hidden aria-label="Dev tools">
  <h3>Dev tools <button type="button" class="hbtn" id="devClose">Close</button></h3>
  <div class="grp">
    <label class="row" for="speed"><span>Speed <b id="speedVal">1×</b></span></label>
    <input type="range" id="speed" min="0" max="6" step="1" value="2">
    <div class="devbtns"><button type="button" id="devPause">Pause</button><button type="button" id="devStep">Step 1 s</button></div>
  </div>
  <div class="grp">
    <label class="row" for="seed"><span>Random seed</span><input type="number" id="seed" value="1" min="1" step="1"></label>
    <div class="devbtns"><button type="button" id="devRestart">Restart with seed</button><button type="button" id="devNewSeed">New seed</button><button type="button" id="devMenu">Scenario menu</button></div>
  </div>
  <div class="grp">
    <span>Cheats and overlays</span>
    <div class="devbtns"><button type="button" id="cheatBact">+50 bacteria</button><button type="button" id="cheatSample">Fill sample</button><button type="button" id="cheatClear">Kill all pathogens</button></div>
    <label class="row" for="ovAlarm"><span>Show alarm field</span><input type="checkbox" id="ovAlarm"></label>
    <label class="row" for="ovStats"><span>Show sector stats</span><input type="checkbox" id="ovStats"></label>
  </div>
  <div class="grp">
    <span>Tuning <small style="color:var(--dim)">(live; gold = changed from default; saved in this browser)</small></span>
    <div id="tuning"></div>
    <div class="devbtns"><button type="button" id="tuneCopy">Copy changes as JSON</button><button type="button" id="tuneReset">Reset all</button></div>
    <textarea id="devJson" hidden readonly aria-label="Tuning JSON"></textarea>
  </div>
</aside>
