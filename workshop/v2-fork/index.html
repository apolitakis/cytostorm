<title>Immune RTS Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Workshop layout: the v2 game on the left (progress or census bar, map, controls), the workshop panel docked on the
   right on wide screens and as a bottom sheet on phones. Deliberately single-theme: fluorescence microscopy, glowing cells on black. */
:root {
  color-scheme: dark;
  --void: #04050A;
  --panel: #0A0D18;
  --panel2: #10152A;
  --line: #1E2540;
  --ink: #DDE6F5;
  --dim: #7A86A0;
  --cell: #3FE6FF;
  --germ: #FF3DCB;
  --gold: #FFD23F;
  --kill: #FF7A3D;
  --repair: #5CFFA1;
  --damage: #FF3B4E;
  --toxin: #B45CFF;
  --slime: #A9CF3C;
  --display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--void); color: var(--ink); }
body { margin: 0; font: 14px/1.4 var(--display); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img.ico { width: 18px; height: 18px; flex: none; }

#shell { height: 100%; display: flex; min-width: 0; }
#app { flex: 1; min-width: 0; height: 100%; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; padding-inline: 16px; box-sizing: border-box; }

/* HUD */
#hud { display: grid; gap: 4px; padding-block: 8px 2px; min-width: 0; }
.hudrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
#prog { flex: 1; min-width: 0; height: 30px; display: block; }
#clock { flex: none; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; color: var(--dim); min-width: 2.8em; text-align: right; }
.hbtn { flex: none; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font: 500 12px var(--mono); min-width: 34px; height: 30px; box-sizing: border-box; }
.hbtn img { width: 16px; height: 16px; }
.hbtn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
#speedTag { font: 500 12px var(--mono); color: var(--gold); }
.fatigue { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--dim); min-width: 0; }
.fatigue > span:first-child { flex: none; }
.ftrack { flex: 1; min-width: 40px; height: 10px; display: flex; }
.ftrack svg { display: block; }
#fIcon { width: 18px; height: 18px; flex: none; }
#fTier { flex: none; min-width: 5.4em; font: 600 11.5px var(--display); color: var(--dim); text-align: right; }
.fatigue[data-tier="1"] #fTier { color: var(--gold); }
.fatigue[data-tier="2"] #fTier { color: var(--kill); }
.fatigue[data-tier="3"] #fTier { color: var(--damage); }
.fatigue[data-burning="true"] #fTier { color: var(--damage); }
#banner { min-height: 1.4em; font-size: 12.5px; line-height: 1.35; color: var(--dim); text-wrap: pretty; }
#banner b { color: var(--ink); font-weight: 600; }
#banner.alarm b { color: var(--toxin); }
#banner.bad b { color: var(--damage); }
#banner.cheat { color: var(--gold); }

/* Stage */
#stage { position: relative; flex: 1; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#toasts { position: absolute; left: 0; right: 0; bottom: 8px; display: grid; justify-items: center; gap: 4px; pointer-events: none; }
.toast { background: rgba(10, 13, 24, .9); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; animation: toast 2.2s ease forwards; }
.toast.bad { border-color: var(--damage); }
.toast.good { border-color: var(--gold); }
.toast.toxin { border-color: var(--toxin); }
.toast.storm { border-color: var(--damage); color: #FFB3BC; }
@keyframes toast { 0% { opacity: 0; transform: translateY(6px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* Bottom controls: marrow switch, body output + fatigue, storm, pause */
#bar { display: flex; align-items: stretch; gap: 8px; padding-block: 6px 10px; min-width: 0; }
.marrow { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.mlabel { display: grid; gap: 2px; font-size: 12px; color: var(--dim); white-space: nowrap; }
.mlabel b { color: var(--ink); font: 600 12.5px var(--display); }
.mlabel span { font: 500 11px var(--mono); font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; min-width: 0; }
.seg button { position: relative; display: flex; align-items: center; justify-content: center; gap: 5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 4px; font-size: 12.5px; font-weight: 600; overflow: hidden; min-width: 0; white-space: nowrap; }
.seg button img { width: 20px; height: 20px; flex: none; }
.seg button .nm { overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.seg button .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--cell); box-shadow: 0 0 8px var(--cell); }
.seg button .ct { font: 500 11px var(--mono); color: var(--dim); }
#pauseBtn { height: auto; min-width: 48px; border-radius: 12px; }
.output { flex: 0 1 300px; min-width: 0; display: grid; gap: 2px; align-content: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; }
.output .mlabel { display: flex; align-items: center; gap: 6px; }
.output .mlabel span { margin-left: auto; }
#output { width: 100%; margin: 4px 0 2px; -webkit-appearance: none; appearance: none; height: 18px; background: none; }
#output::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--track, var(--panel2)); }
#output::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track, var(--panel2)); }
#output::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: var(--ink); border: 2px solid var(--void); box-shadow: 0 0 8px rgba(255, 210, 63, .6); }
#output::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: 2px solid var(--void); }
#burnTag { display: flex; align-items: center; gap: 3px; font: 500 11px var(--mono); color: var(--damage); flex: none; }
#burnTag img { width: 16px; height: 16px; }
/* Storm: one big red button. Hold to preview the cost on the fatigue meter, release to fire. */
#stormBtn { flex: none; display: grid; justify-items: center; align-content: center; gap: 1px; min-width: 64px; background: var(--panel); border: 1px solid rgba(255, 59, 78, .55); border-radius: 12px; padding: 4px 6px; color: #FFB3BC; font: 600 11.5px var(--display); touch-action: none; }
#stormBtn img { width: 34px; height: 34px; pointer-events: none; }
#stormBtn span { pointer-events: none; }
#stormBtn.held { background: rgba(255, 59, 78, .14); border-color: var(--damage); }
#stormBtn.lethal { box-shadow: 0 0 0 2px var(--damage), 0 0 18px rgba(255, 59, 78, .6); }
#stormBtn:disabled { opacity: .45; }
#stormBtn, #stormBtn img { -webkit-touch-callout: none; }
/* Toxin load: a thin green bar under the fatigue meter; the notch marks where puddles start */
.toxbar { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--dim); min-width: 0; }
.toxbar > span:first-child { flex: none; min-width: 3.3em; }
.ttrack { position: relative; flex: 1; min-width: 40px; height: 6px; border-radius: 3px; background: rgba(169, 207, 60, .13); overflow: hidden; }
#toxFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--slime); box-shadow: 0 0 6px var(--slime); }
#toxMark { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--void); }
#toxVal { flex: none; min-width: 5.4em; text-align: right; font: 600 11.5px var(--display); color: var(--slime); }
.toxbar[data-hot="true"] .ttrack { animation: toxPulse .8s ease-in-out infinite; }
.toxbar[data-max="true"] #toxVal { color: var(--damage); }
@keyframes toxPulse { 50% { box-shadow: 0 0 0 2px rgba(169, 207, 60, .45); } }
@media (prefers-reduced-motion: reduce) { .toxbar[data-hot="true"] .ttrack { animation: none; box-shadow: 0 0 0 2px rgba(169, 207, 60, .45); } }

/* Modals */
#modal { position: fixed; inset: 0; background: rgba(4, 5, 10, .8); display: grid; place-items: center; padding: 16px; z-index: 40; }
.mbox { width: 100%; max-width: 520px; max-height: calc(100% - 8px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; box-sizing: border-box; }
.mbox h2 { margin: 0; font-size: 24px; font-weight: 650; font-stretch: 80%; line-height: 1.05; text-wrap: balance; }
.mbox h2 .glow { color: var(--cell); }
.mbox h2 .bad { color: var(--damage); }
.mbox p { margin: 0; color: var(--dim); }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.howto { margin: 0; padding-left: 18px; display: grid; gap: 5px; color: var(--ink); font-size: 13.5px; }
.howto li::marker { color: var(--cell); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-weight: 600; white-space: nowrap; }
.btn.primary { border-color: var(--cell); color: var(--cell); }
.linkbtn { background: none; border: 0; color: var(--cell); text-decoration: underline; padding: 2px; justify-self: start; font-size: 13.5px; }
.emblem { width: 96px; height: 96px; justify-self: center; }
.stars { display: flex; gap: 6px; }
.stars img { width: 34px; height: 34px; }
.goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
.goals li { display: flex; gap: 8px; color: var(--dim); }
.goals li::before { content: "\2606"; }
.goals li.hit { color: var(--ink); }
.goals li.hit::before { content: "\2605"; color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { display: grid; gap: 1px; }
.stats b { font: 500 16px var(--mono); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--dim); }
#graph { width: 100%; height: 130px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--dim); margin-top: -6px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; background: var(--c); }
/* Combo picker on the start screen */
.combos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.combo { display: grid; gap: 2px; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.combo b { font-size: 13.5px; font-weight: 650; }
.combo small { color: var(--dim); font-size: 11.5px; line-height: 1.3; }
.combo .icons { display: flex; gap: 2px; min-height: 18px; }
.combo .icons img { width: 18px; height: 18px; }
.combo[aria-pressed="true"] { border-color: var(--cell); }
/* Guide */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; position: sticky; top: -18px; background: var(--panel); padding-block: 6px; z-index: 1; }
.tabs button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; font-size: 12.5px; }
.tabs button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
.gsec { display: grid; gap: 14px; }
.unit { display: grid; grid-template-columns: 44px 1fr; gap: 2px 12px; align-items: start; }
.unit > img { grid-row: span 3; width: 44px; height: 44px; }
.unit h4 { margin: 0; font-size: 16px; font-weight: 650; font-stretch: 85%; }
.unit .why { margin: 0; color: var(--ink); font-size: 13.5px; }
.unit ul { margin: 2px 0 0; padding-left: 16px; display: grid; gap: 3px; color: var(--dim); font-size: 13px; }
.unit ul b { color: var(--ink); font-weight: 600; }

/* Workshop panel: docked on the right when there's room, a bottom sheet on phones */
#ws { flex: none; width: 360px; height: 100%; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 12px 14px 40px; box-sizing: border-box; display: grid; gap: 12px; align-content: start; font-size: 13px; overscroll-behavior: contain; }
#ws h3 { margin: 0; font-size: 17px; font-weight: 650; font-stretch: 85%; display: flex; align-items: center; gap: 8px; }
#ws h3 small { font: 500 11px var(--mono); color: var(--dim); font-stretch: 100%; }
#ws h3 button { margin-left: auto; }
#ws h4 { margin: 0; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--dim); display: flex; align-items: center; gap: 6px; }
#ws h4 button { margin-left: auto; text-transform: none; letter-spacing: 0; }
#ws .grp { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); min-width: 0; }
#ws .grp > p { margin: 0; color: var(--dim); font-size: 12px; }
#ws label.row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
#ws label.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer; }
#ws label.check input { margin: 2px 0 0; accent-color: var(--gold); width: 16px; height: 16px; flex: none; }
#ws label.check small { display: block; color: var(--dim); font-size: 11.5px; }
#ws input[type="number"] { width: 5.5em; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: 12px var(--mono); }
#ws input[type="number"].changed { border-color: var(--gold); color: var(--gold); }
#ws input[type="range"] { width: 100%; accent-color: var(--gold); margin: 0; }
#ws details summary { cursor: pointer; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 4px 0; }
#ws details[open] summary { color: var(--ink); }
#ws details .field { display: grid; gap: 2px; padding: 4px 0; }
#ws details .field small { color: var(--dim); font-size: 11px; line-height: 1.3; }
.sbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.sbtns button, .sbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; white-space: nowrap; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chips button { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.chips button[aria-pressed="true"] { border-color: var(--cell); color: var(--cell); }
/* One spawn row: icon, name and trait, rate, + button; the slider sits on its own line */
.spawn { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 2px 8px; align-items: center; }
.spawn img { width: 30px; height: 30px; grid-row: span 2; }
.spawn .nm { font-weight: 600; font-size: 13px; min-width: 0; }
.spawn .nm small { display: block; font-weight: 400; color: var(--dim); font-size: 11.5px; line-height: 1.25; }
.spawn output { font: 500 11.5px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; min-width: 4.6em; text-align: right; }
.spawn output.on { color: var(--gold); }
.spawn input[type="range"] { grid-column: 2 / 4; }
.spawn .add { grid-row: span 2; align-self: center; min-width: 44px; }
.spawn.live .nm::after { content: attr(data-live); margin-left: 6px; font: 500 11px var(--mono); color: var(--germ); }
table.readout { width: 100%; border-collapse: collapse; font-size: 12px; }
table.readout th { text-align: left; font-weight: 500; color: var(--dim); padding: 2px 4px 2px 0; }
table.readout td { text-align: right; font: 500 12px var(--mono); font-variant-numeric: tabular-nums; padding: 2px 0 2px 6px; }
table.readout td.l { text-align: left; font: 13px var(--display); }
#nearLog { margin: 0; padding-left: 16px; font-size: 12px; color: var(--gold); display: grid; gap: 2px; }
#setupJson { width: 100%; min-height: 90px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 11px var(--mono); box-sizing: border-box; -webkit-user-select: text; user-select: text; }
#wsClose { display: none; }
#wsBtn { display: none; }

@media (max-width: 1099px) {
  #wsBtn { display: grid; }
  #wsClose { display: grid; }
  #ws { position: fixed; left: 0; right: 0; bottom: 0; width: auto; height: auto; max-height: 64%; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; z-index: 30; box-shadow: 0 -12px 40px rgba(0, 0, 0, .6); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
  body:not(.ws-open) #ws { display: none; }
}
@media (max-width: 640px) {
  #bar { flex-wrap: wrap; }
  .marrow { flex-basis: 100%; }
  .output { flex: 1 1 auto; }
}
@media (max-width: 480px) {
  .marrow { grid-template-columns: 1fr; padding: 5px 6px 6px; }
  .mlabel { display: flex; align-items: baseline; gap: 8px; }
  .seg button { flex-direction: column; gap: 1px; font-size: 11px; padding: 4px 2px; }
  .seg button img { width: 18px; height: 18px; }
  .seg button .ct { display: none; }
  #pauseBtn { min-width: 40px; }
  #stormBtn { min-width: 56px; }
}
@media (max-height: 480px) {
  #hud { padding-block: 4px 0; }
  #banner { min-height: 0; font-size: 12px; }
  #bar { padding-block: 4px 6px; }
  .seg button { padding: 5px 4px; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation-duration: .01s; animation-delay: 2s; } }
</style>

<div id="shell">
  <div id="app">
    <header id="hud">
      <div class="hudrow">
        <canvas id="prog" aria-label="Enemies on the map by type, or the level's progress when the Papercut script runs"></canvas>
        <span id="clock">0:00</span>
        <span id="speedTag" hidden></span>
        <button id="helpBtn" class="hbtn" type="button" aria-label="Guide">?</button>
        <button id="wsBtn" class="hbtn" type="button" aria-pressed="false">Workshop</button>
      </div>
      <div id="banner" aria-live="polite"></div>
    </header>

    <main id="stage">
      <canvas id="cv" aria-label="The map: Wound, Tissue and Lymph node. Tap a zone to flip its macrophages between Offense and Support."></canvas>
      <div id="toasts"></div>
    </main>

    <footer id="bar">
      <div class="marrow">
        <div class="mlabel"><b>Marrow</b><span id="cellCount">0/60</span></div>
        <div class="seg" id="marrowSeg">
          <button type="button" data-make="neut" aria-pressed="true"><img data-art="neutrophil" alt=""><span class="nm">Neutrophil</span><span class="ct" data-count="neut">0</span><i class="fill"></i></button>
          <button type="button" data-make="mac" aria-pressed="false"><img data-art="macrophage-offense" alt=""><span class="nm">Macrophage</span><span class="ct" data-count="mac">0</span><i class="fill"></i></button>
          <button type="button" data-make="net" aria-pressed="false"><img data-art="neutrophil-net" alt=""><span class="nm">Net</span><span class="ct" data-count="net">0</span><i class="fill"></i></button>
          <button type="button" data-make="nk" aria-pressed="false"><img data-art="nk-cell" alt=""><span class="nm">NK</span><span class="ct" data-count="nk">0</span><i class="fill"></i></button>
        </div>
      </div>
      <div class="output">
        <div class="mlabel"><img class="ico" data-art="body-output" alt=""><b>Body output</b><span id="outVal">1.0×</span></div>
        <input type="range" id="output" min="0" max="100" step="5" value="50" aria-label="Body output: how fast the marrow makes cells">
        <div class="fatigue" id="fatigue" data-tier="0"><span>Fatigue</span><div class="ftrack" id="ftrack"></div><span id="burnTag" hidden><img data-art="storm-afterburn" alt=""><span id="burnLeft">8s</span></span><img id="fIcon" alt=""><span id="fTier">Fine</span></div>
        <div class="toxbar" id="toxbar" hidden><span>Toxin</span><div class="ttrack"><i id="toxFill"></i><u id="toxMark"></u></div><span id="toxVal">0</span></div>
      </div>
      <button id="stormBtn" type="button" aria-label="Cytokine storm. Hold to see the cost, release to fire."><img id="stormIcon" data-art="storm" alt=""><span>Storm</span></button>
      <button id="pauseBtn" class="hbtn" type="button" aria-label="Pause"><img data-art="pause" alt=""></button>
    </footer>
  </div>

  <aside id="ws" aria-label="Workshop"></aside>
</div>

<div id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>

<script>
// Immune RTS prototype art. Generated; edit gen.py, not this file.
// Usage: const img = await ART.load('neutrophil'); ctx.drawImage(img, x - s/2, y - s/2, s, s)
// Map sprites share a 64x64 box centred on the cell; `radius` is the body radius in those units.
// Non-square sprites (shots, trails) give meta.box [w,h] and meta.anchor [x,y]: put the anchor on the object and rotate to its heading.
// Draw cells and fields with ctx.globalCompositeOperation = 'lighter' for the fluorescence look.
const ART = {

ing: the pod cracks with a white flash. Show for ~0.3 s, then spawn bacteria.", "worldR": 7}, "staph-toxic": {"kind": "enemy", "size": 64, "radius": 9, "note": "Toxic-shock Staph (the drain): a plain rod wrapped in an orange pulse (the fatigue colour). Pulse its alpha ~1 Hz.", "worldR": 5.5}, "strep-link": {"kind": "enemy", "size": 64, "radius": 7, "note": "Strep chain link (one bead, with link stubs both sides). Place links ~18 units apart along the chain's path and rotate each to the path. Draw ~0.8x a plain bacterium.", "worldR": 4}, "strep-chain": {"kind": "enemy", "size": 64, "radius": 28, "note": "Strep chain (6 beads, wriggling). For icons, markers and previews; in play, build chains from strep-link.", "worldR": 14}, "herpes": {"kind": "enemy", "size": 64, "radius": 11, "note": "Herpes particle: a lilac hexagonal capsid in a dotted envelope. 8 burst out of each infected neutrophil.", "worldR": 3.5}, "neutrophil-infected": {"kind": "unit", "size": 64, "radius": 13, "note": "Neutrophil carrying herpes: looks normal except a faint lilac glow and a capsid inside. Flicker this sprite with the plain neutrophil every ~0.3 s so a sharp-eyed player can spot it.", "worldR": 8}, "tapeworm-head": {"kind": "enemy", "size": 64, "radius": 26, "note": "Tapeworm head (scolex): four suckers and a hook crown. The only enemy bigger than a macrophage: draw ~1.6x a macrophage. Faces +x.", "worldR": 24}, "tapeworm-segment": {"kind": "enemy", "size": 48, "radius": 19, "note": "Tapeworm segment (48x40). Chain them behind the head along its path, overlapping a little, each rotated to the path. Flash with hit-spark; when one breaks off, swap it for tapeworm-small.", "box": [48, 40], "anchor": [24, 20], "worldR": 15}, "tapeworm-small": {"kind": "enemy", "size": 64, "radius": 12, "note": "Small fast worm, made when a tapeworm segment breaks off. Faces +x.", "worldR": 6}, "neutrophil-net": {"kind": "unit", "size": 64, "radius": 13, "note": "Net neutrophil (marrow option), on its run to th   _img: {},
  ready: {},  // name -> loaded <img>, filled in as loads finish (the draw helpers below read it)
  // Resolves to an <img> you can drawImage(). Cached per name.
  load(name) {
    if (!this._img[name]) this._img[name] = new Promise((ok, err) => {
      const i = new Image();
      i.onload = () => { this.ready[name] = i; ok(i); }; i.onerror = err;
      i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(this.svg[name]);
    });
    return this._img[name];
  },
  loadAll() {
    return Promise.all(Object.keys(this.svg).map(n => this.load(n))).then(() => this);
  },
  // Pre-render a sprite to an offscreen canvas at a fixed pixel size (fast to blit hundreds of times).
  async sprite(name, px) {
    const img = await this.load(name), c = document.createElement('canvas');
    c.width = c.height = Math.ceil(px * (window.devicePixelRatio || 1));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  },
  // ---- v2 HUD helpers (call after loadAll) ----
  // Lymph node infection timer: a ring that fills red clockwise from 12 o'clock.
  // frac 0..1; beating = bacteria inside the node (adds a double-thump heartbeat); t = seconds, for the pulse.
  drawTimer(ctx, x, y, r, frac, { beating = false, t = 0 } = {}) {
    const red = this.palette.damage, k = beating ? 1 + 0.08 * this._beat(t) : 1, R = r * k;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(3, r * 0.22);
    ctx.strokeStyle = 'rgba(255,59,78,0.18)';
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = Math.max(1, r * 0.06); ctx.strokeStyle = 'rgba(255,59,78,0.45)';
    for (let i = 0; i < 12; i++) {           // tick marks every 1/12
      const a = i / 12 * Math.PI * 2 - Math.PI / 2, i0 = R - r * 0.42, i1 = R - r * 0.3;
      ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * i0, y + Math.sin(a) * i0); ctx.lineTo(x + Math.cos(a) * i1, y + Math.sin(a) * i1); ctx.stroke();
    }
    if (frac > 0) {
      const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * Math.min(1, frac);
      ctx.strokeStyle = red; ctx.lineWidth = Math.max(3, r * 0.22);
      ctx.shadowColor = red; ctx.shadowBlur = r * (beating ? 0.9 : 0.5);
      ctx.beginPath(); ctx.arc(x, y, R, a0, a1); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = '#FFE1E5';
      ctx.beginPath(); ctx.arc(x + Math.cos(a1) * R, y + Math.sin(a1) * R, Math.max(1.5, r * 0.09), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  },
  _beat(t) {  // lub-dub at ~70 bpm, 0..1
    const p = (t * 70 / 60) % 1, b = (c, w) => Math.exp(-(((p - c) / w) ** 2));
    return Math.max(b(0.05, 0.05), 0.6 * b(0.25, 0.05));
  },
  // Level progress bar. frac 0..1; events = [{at: 0..1, kind: 'wave'|'wave-armored'|'wave-final'|'toxin'}].
  // Events already passed dim out; the next one glows.
  drawProgress(ctx, x, y, w, h, frac, events = []) {
    ctx.save();
    const r = h / 2, f = Math.max(0, Math.min(1, frac));
    ctx.fillStyle = 'rgba(221,230,245,0.08)'; ctx.strokeStyle = 'rgba(221,230,245,0.3)'; ctx.lineWidth = 1;
    this._pill(ctx, x, y, w, h, r); ctx.fill(); ctx.stroke();
    if (f > 0) {
      const g = ctx.createLinearGradient(x, 0, x + w * f, 0);
      g.addColorStop(0, 'rgba(63,230,255,0.15)'); g.addColorStop(1, 'rgba(63,230,255,0.55)');
      ctx.fillStyle = g; this._pill(ctx, x, y, Math.max(h, w * f), h, r); ctx.fill();
      ctx.fillStyle = this.palette.cellHi; ctx.fillRect(x + w * f - 1, y - 2, 2, h + 4);
    }
    const next = events.filter(e => e.at > f).sort((a, b) => a.at - b.at)[0];
    for (const e of events) {
      const img = this.ready['marker-' + e.kind]; if (!img) continue;
      const s = h * (e.kind === 'wave-final' ? 2.6 : 2.1) * (e === next ? 1.15 : 1);
      ctx.globalAlpha = e.at <= f ? 0.25 : 1;
      ctx.drawImage(img, x + w * e.at - s / 2, y + h / 2 - s / 2, s, s);
    }
    ctx.restore();
  },
  // ---- v2 round 2: body output and fatigue ----
  fatigueColors: { fine: '#7F8FB0', tired: '#FFD23F', feverish: '#FF7A3D', exhausted: '#FF3B4E' },
  _fm: 0,
  // Fatigue meter as an inline SVG string for the DOM HUD: el.innerHTML = ART.fatigueMeterSVG(g.fatigue, CONFIG.fatigue).
  // Faint bands preview each tier; the fill takes the colour of the band it has reached; a bright edge marks "now".
  // Storm options: { ghost: 50, burn: 16 } while the storm button is held draws where fatigue would land:
  // a hatched bar for the instant cost, then a fading band for the afterburn's range. It turns red where it reaches 100.
  // { burning: true } during the afterburn outlines the meter in red.
  fatigueMeterSVG(fatigue, tiers = { tired: 35, feverish: 60, exhausted: 85 }, h = 10, opts = {}) {
    const id = 'fm' + (this._fm++ % 1000), c = this.fatigueColors, f = Math.max(0, Math.min(100, fatigue));
    const t1 = tiers.tired, t2 = tiers.feverish, t3 = tiers.exhausted, r = h / 2;
    const band = (a, b, col, op) => `<rect x="${a}" y="0" width="${b - a}" height="${h}" fill="${col}" fill-opacity="${op}"/>`;
    const tick = x => `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="#04050A" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Fatigue ${Math.round(f)} of 100">`
      + `<defs><clipPath id="${id}c"><rect width="100" height="${h}" rx="${r}" ry="${r}"/></clipPath>`
      + `<linearGradient id="${id}g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">`
      + `<stop offset="${t1 * .8 / 100}" stop-color="${c.fine}"/><stop offset="${t1 / 100}" stop-color="${c.tired}"/>`
      + `<stop offset="${t2 / 100}" stop-color="${c.feverish}"/><stop offset="${t3 / 100}" stop-color="${c.exhausted}"/></linearGradient></defs>`
      + `<g clip-path="url(#${id}c)">${band(0, t1, c.fine, .1)}${band(t1, t2, c.tired, .14)}${band(t2, t3, c.feverish, .17)}${band(t3, 100, c.exhausted, .22)}`
      + (f > 0.5 ? `<rect width="${f}" height="${h}" fill="url(#${id}g)"/><rect x="${Math.max(0, f - .8)}" width=".8" height="${h}" fill="#FFFFFF" fill-opacity=".9"/>` : '')
      + this._ghost(id, f, h, opts)
      + `${tick(t1)}${tick(t2)}${tick(t3)}</g>`
      + (opts.burning ? `<rect x=".5" y=".5" width="99" height="${h - 1}" rx="${r}" ry="${r}" fill="none" stroke="#FF3B4E" stroke-width="1.5" vector-effect="non-scaling-stroke"/>` : '')
      + `</svg>`;
  },
  _ghost(id, f, h, { ghost = 0, burn = 0 } = {}) {
    if (!ghost) return '';
    const g0 = Math.min(100, f + ghost), g1 = Math.min(100, f + ghost + burn), certain = f + ghost >= 100, gamble = f + ghost + burn >= 100;
    const col = certain ? '#FF3B4E' : '#FFFFFF', col2 = gamble ? '#FF3B4E' : '#FFFFFF';
    return `<defs><pattern id="${id}p" width="3" height="${h}" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">`
      + `<rect width="1.4" height="${h}" fill="${col}"/></pattern>`
      + `<pattern id="${id}q" width="3" height="${h}" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)"><rect width="1.4" height="${h}" fill="${col2}"/></pattern>`
      + `<linearGradient id="${id}f" gradientUnits="userSpaceOnUse" x1="${g0}" x2="${Math.max(g1, g0 + .1)}" y1="0" y2="0">`
      + `<stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>`
      + `<mask id="${id}m"><rect x="${g0}" width="${g1 - g0}" height="${h}" fill="url(#${id}f)"/></mask></defs>`
      + `<rect x="${f}" width="${g0 - f}" height="${h}" fill="${col}" fill-opacity="${certain ? .3 : .16}"/>`
      + `<rect x="${f}" width="${g0 - f}" height="${h}" fill="url(#${id}p)" fill-opacity=".7"/>`
      + `<rect x="${g0}" width="${g1 - g0}" height="${h}" fill="url(#${id}q)" fill-opacity=".6" mask="url(#${id}m)"/>`
      + `<rect x="${g0 - .6}" width=".6" height="${h}" fill="${col}"/>`
      + (gamble ? `<rect x="99" width="1" height="${h}" fill="#FF3B4E"/>` : '');
  },
  // ---- cytokine storm ----
  // Full-screen storm effect in view space, drawn last with source-over.
  // phase 'windup' (1 s): red flush rises, the storm-wave rolls out from (ox, oy), the marrow side.
  // phase 'hit' (~0.4 s): magenta-white flash that fades. phase 'afterburn' (8 s): fast red edge pulse, easing as p -> 1.
  // p = 0..1 progress through the phase; t = seconds (for pulses).
  drawStorm(ctx, w, h, { phase, p = 0, t = 0, ox = w / 2, oy = h } = {}) {
    ctx.save();
    if (phase === 'windup') {
      ctx.fillStyle = `rgba(255,59,78,${0.32 * p})`; ctx.fillRect(0, 0, w, h);
      const img = this.ready['storm-wave'], R = p * Math.hypot(w, h);
      if (img && R > 1) { const s = R * 256 / 120; ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - 0.4 * p; ctx.drawImage(img, ox - s / 2, oy - s / 2, s, s); }
    } else if (phase === 'hit') {
      const k = 1 - p, g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.hypot(w, h) / 2);
      g.addColorStop(0, `rgba(255,236,246,${0.9 * k})`); g.addColorStop(0.5, `rgba(255,61,203,${0.75 * k})`); g.addColorStop(1, `rgba(255,59,78,${0.85 * k})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    } else if (phase === 'afterburn') {
      const a = (0.22 + 0.16 * (0.5 + 0.5 * Math.sin(t * Math.PI * 4))) * (1 - 0.6 * p), d = Math.min(w, h) * 0.18;
      const edge = (x0, y0, x1, y1, rx, ry, rw, rh) => {
        const g = ctx.createLinearGradient(x0, y0, x1, y1);
        g.addColorStop(0, `rgba(255,59,78,${a})`); g.addColorStop(0.5, `rgba(255,61,203,${a * 0.3})`); g.addColorStop(1, 'rgba(255,61,203,0)');
        ctx.fillStyle = g; ctx.fillRect(rx, ry, rw, rh);
      };
      edge(0, 0, 0, d, 0, 0, w, d); edge(0, h, 0, h - d, 0, h - d, w, d); edge(0, 0, d, 0, 0, 0, d, h); edge(w, 0, w - d, 0, w - d, 0, d, h);
    }
    ctx.restore();
  },
  // Collapse when fatigue hits 100 during a storm. p = 0..1 over ~2 s, then show the loss screen with the organ-failure emblem.
  // A red flash, then the field drains dark while the edges beat slower and stop.
  drawCollapse(ctx, w, h, p) {
    ctx.save();
    const flash = Math.max(0, 1 - p / 0.15);
    ctx.fillStyle = `rgba(4,5,10,${Math.min(0.82, p * 1.1)})`; ctx.fillRect(0, 0, w, h);
    if (flash > 0) { ctx.fillStyle = `rgba(255,59,78,${0.6 * flash})`; ctx.fillRect(0, 0, w, h); }
    const beats = [0.25, 0.5, 0.8], beat = beats.reduce((m, b) => Math.max(m, Math.exp(-(((p - b) / 0.04) ** 2))), 0) * (1 - p * 0.6);
    if (beat > 0.01) {
      const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.65);
      g.addColorStop(0, 'rgba(255,59,78,0)'); g.addColorStop(1, `rgba(255,59,78,${0.55 * beat})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }
    ctx.restore();
  },
  // Background for the Body output slider track: cool up to the sustainable point, heating past it.
  // restFrac = where the rest multiplier sits on the slider (0..1), e.g. log(rest/min)/log(max/min).
  outputTrackCSS(restFrac) {
    const p = Math.round(restFrac * 100);
    return `linear-gradient(90deg, rgba(63,230,255,.15) 0%, rgba(63,230,255,.45) ${p}%, #FFD23F ${p}%, #FF7A3D ${Math.round(p + (100 - p) * .5)}%, #FF3B4E 100%)`;
  },
  // Screen-edge glow for Feverish (tier 2) and Exhausted (tier 3). Call last, in view space, with source-over.

        const chain = this.chainId++;
        let lead = null;
        for (let i = 0; i <= C.tapeworm.segments; i++) {
          const hp = i ? C.tapeworm.segHp : C.tapeworm.segHp * 1.5;
          const b = this.spawnEnemy('worm', 40 - i * 4, WOUND.v, { chain, lead, head: !lead, hp, maxHp: hp });
          if (b) lead = b;
        }
        break;
      }
      default: {
        const s = SPAWNABLE.find(x => x.kind === kind), n = s ? groupSize(s) : 1;
        for (let i = 0; i < n; i++) near(kind, 24);
      }
    }
    this.fx.push({ k: 'trickle', u: cu, v: cv, kind });
  }

  runWaves() {
    const w = this.lv.waves;
    while (this.waveIdx < w.length && this.t >= w[this.waveIdx].t) {
      const wave = w[this.waveIdx++];
      for (let i = 0; i < (wave.b || 0); i++) this.spawnEnemy('staph');
      for (let i = 0; i < (wave.a || 0); i++) this.spawnEnemy('armored');
      this.fx.push({ k: 'wave', u: WOUND.u, v: WOUND.v, n: (wave.b || 0) + (wave.a || 0), armored: wave.a || 0, final: !!wave.final });
    }
  }
  markers() {
    const out = [];
    if (this.dev.script) for (let i = this.waveIdx; i < this.lv.waves.length; i++) out.push({ t: this.lv.waves[i].t, kind: 'wave', final: !!this.lv.waves[i].final, armored: !!this.lv.waves[i].a });
    for (const tx of this.toxins) if (tx.state === 'coming') out.push({ t: tx.at, kind: 'toxin' });
    return out;
  }

  // ---- queries ----
  liveBact() { return this.bact.filter(b => !b.dead && !b.eaten); }
  countByKind() {
    const n = {};
    for (const b of this.bact) if (!b.dead && !b.eaten) n[b.kind] = (n[b.kind] || 0) + 1;
    return n;
  }
  // Can a neutrophil see and shoot this? (spores are inert, dome cover hides them)
  shootable(b) { return !b.dead && !b.eaten && b.kind !== 'spore' && !b.shield; }
  nearestBact(u, v, maxD, filter) {
    let best = null, bd = maxD * maxD;
    for (const b of this.bact) {
      if (b.dead || b.eaten || (filter && !filter(b))) continue;
      const d = (b.u - u) ** 2 + (b.v - v) ** 2;
      if (d < bd) { bd = d; best = b; }
    }
    return best;
  }
  // Neutrophil targets: shootable enemies plus TB-infected macrophages
  nearestTarget(u, v, maxD, filter) {
    let best = this.nearestBact(u, v, maxD, b => this.shootable(b) && (!filter || filter(b)));
    let bd = best ? (best.u - u) ** 2 + (best.v - v) ** 2 : maxD * maxD;
    for (const m of this.mac) {
      if (m.dead || !m.infected) continue;
      const d = (m.u - u) ** 2 + (m.v - v) ** 2;
      if (d < bd) { bd = d; best = m; }
    }
    return best;
  }
  inRing(u, v) {
    const r2 = (this.ringR || CONFIG.support.ring) ** 2;
    for (const m of this.mac) if (!m.dead && !m.infected && m.mode === 'support' && m.stun <= 0 && (m.u - u) ** 2 + (m.v - v) ** 2 < r2) return true;
    return false;
  }
  domeAt(u, v) { for (const d of this.domes) if ((d.u - u) ** 2 + (d.v - v) ** 2 < d.r * d.r) return d; return null; }

  // ---- kills ----
  kill(b, source, quiet) {
    if (b.dead) return;
    b.dead = true; b.eaten = false;
    const st = this.stats;
    if (source === 'shot') st.shotKills++; else if (source === 'tuned') { st.shotKills++; st.tunedKills++; }
    else if (source === 'swallow') st.swallows++; else if (source === 'net') st.netKills++; else if (source === 'nk') st.nkKills++; else if (source === 'storm') st.stormKills++;
    st.byKind[b.kind] = (st.byKind[b.kind] || 0) + 1;
    if (source === 'shot' || source === 'tuned' || source === 'net' || source === 'storm') this.addToxin(b, source === 'tuned' ? 'shot' : source);
    if (b.kind === 'worm') {
      // A broken segment sheds a small fast worm
      this.spawnEnemy('wormlet', b.u, b.v);
      this.fx.push({ k: 'shed', u: b.u, v: b.v });
    }
    if (!quiet) this.fx.push({ k: source === 'storm' ? 'stormKill' : 'pop', u: b.u, v: b.v, tuned: source === 'tuned', armored: b.armored, kind: b.kind });
  }
  // Toxin load: messy kills dump toxin; swallows are clean; viruses carry none
  addToxin(b, source) {
    if (!this.dev.toxinLoad) return;
    const T = CONFIG.toxload;
    const amt = source === 'burst' ? T.perBurst : KINDS[b.kind].virus ? 0 : (b.kind === 'pseudo' || b.kind === 'clos') ? T.perEndo : T.perKill;
    if (!amt) return;
    this.toxLoad = Math.min(100, this.toxLoad + amt);
    this.stats.toxinFrom[source] = (this.stats.toxinFrom[source] || 0) + amt;
    if (b && this.toxLoad > T.puddleAt && this.puddles.length < 160) this.puddles.push({ u: b.u, v: b.v, life: T.puddleLife, max: T.puddleLife, r: T.puddleR * (0.8 + this.rand() * 0.5) });
  }
  // Speed multiplier for one of your cells standing in a puddle
  puddleMul(u, v) {
    for (const p of this.puddles) if ((p.u - u) ** 2 + (p.v - v) ** 2 < p.r * p.r) return CONFIG.toxload.puddleSlow;
    return 1;
  }
  loseCell(c, why, kind) {
    if (c.dead) return;
    c.dead = true; this.stats.lost[why] = (this.stats.lost[why] || 0) + 1;
    if (kind === 'neut' && c.infected > 0 && why !== 'age') this.herpesBurst(c);
    if (kind === 'mac' && c.prey) { c.prey.eaten = false; c.prey = null; }
    this.fx.push({ k: why === 'age' ? 'expire' : why === 'storm' ? 'stormKill' : 'die', u: c.u, v: c.v, who: kind });
  }
  herpesBurst(n) {
    for (let i = 0; i < CONFIG.herpes.burstInto; i++) {
      const a = this.rand() * 6.283;
      this.spawnEnemy('herpes', n.u + Math.cos(a) * 6, n.v + Math.sin(a) * 6);
    }
    this.fx.push({ k: 'herpesBurst', u: n.u, v: n.v });
  }

  // ---- tick ----
  step(dt) {
    if (this.result) return;
    const C = CONFIG, r = this.rand, D = this.dev;
    this.t += dt;
    const t = this.t;
    if (this.fx.length > 600) this.fx.splice(0, this.fx.length - 600);

    // ---- script (optional) ----
    if (D.script) {
      this.runWaves();
      if (t < C.level.duration) {
        const f = t / C.level.duration;
        this.streamAcc += dt * (C.stream.start + (C.stream.end - C.stream.start) * f);
        while (this.streamAcc >= 1) {
          const n = Math.max(1, Math.min(Math.floor(this.streamAcc), 1 + Math.floor(r() * C.stream.clump)));
          this.streamAcc -= n;
          const cu = WOUND.u + (r() - 0.5) * 60, cv = WOUND.v + (r() - 0.5) * 160;
          for (let i = 0; i < n; i++) this.spawnEnemy(t >= C.stream.armoredFrom && r() < C.stream.armoredShare ? 'armored' : 'staph', cu + (r() - 0.5) * 12, cv + (r() - 0.5) * 12);
          this.fx.push({ k: 'trickle', u: cu, v: cv });
        }
      }
    }
    // ---- workshop spawn rates ----
    for (const s of SPAWNABLE) {
      const rate = +D.rates[s.kind] || 0; if (rate <= 0) continue;
      if (this.spawnAcc[s.kind] == null) this.spawnAcc[s.kind] = 0.6; // first group comes quickly
      this.spawnAcc[s.kind] += rate / 10 * dt;
      while (this.spawnAcc[s.kind] >= 1) { this.spawnAcc[s.kind] -= 1; this.spawnGroup(s.kind); }
    }
    for (const f of FRIENDLY) {
      const rate = +D.friendly[f.kind] || 0; if (rate <= 0) continue;
      this.friendAcc[f.kind] = (this.friendAcc[f.kind] || 0) + rate / 10 * dt;
      while (this.friendAcc[f.kind] >= 1) { this.friendAcc[f.kind] -= 1; if (this.cellCount() < this.cellCap()) this.spawnFriendly(f.kind); }
    }

    // ---- body output, fatigue, storm ----
    const mul = this.outputMul(), O = C.output, F = C.fatigue, S = C.storm;
    const toxicAlive = this.bact.some(b => b.kind === 'toxic' && !b.dead);
    this.toxicAlive = toxicAlive;
    this.fatigue += (mul > O.rest ? (mul - O.rest) * O.tire * (toxicAlive ? C.toxic.fatigueMul : 1) : (mul - O.rest) * O.recover) * dt;
    const st = this.storm;
    if (st.phase) {
      st.left -= dt;
      const len = st.phase === 'windup' ? S.windup : st.phase === 'hit' ? S.hit : S.afterburn;
      st.p = Math.max(0, Math.min(1, 1 - st.left / len));
      if (st.phase === 'afterburn' || st.phase === 'hit') this.fatigue += S.burnRate * (this.output <= 0.001 ? 0.5 : 1) * dt * (st.phase === 'hit' ? 0 : 1);
      if (st.left <= 0) {
        if (st.phase === 'windup') { st.phase = 'hit'; st.left = S.hit; st.p = 0; this.stormHit(); }
        else if (st.phase === 'hit') { st.phase = 'afterburn'; st.left = S.afterburn; st.p = 0; }
        else { st.phase = null; st.p = 0; this.fx.push({ k: 'stormEnd' }); }
      }
    }
    // Toxin load drains faster when rested; pinned at 100 it spills into fatigue
    if (D.toxinLoad) {
      const T = C.toxload, fNow = Math.max(0, Math.min(100, this.fatigue));
      const pinned = this.toxLoad >= 100 - 1e-6;
      if (pinned) { this.fatigue += T.spill * dt; this.toxPinned += dt; }
      this.toxLoad = Math.max(0, this.toxLoad - (T.drainRested + (T.drainTired - T.drainRested) * fNow / 100) * dt);
      this.toxPeak = Math.max(this.toxPeak, this.toxLoad);
      for (const p of this.puddles) if (!pinned) p.life -= dt * (this.toxLoad < T.puddleAt ? 2 : 1);
      if (this.puddles.some(p => p.life <= 0)) this.puddles = this.puddles.filter(p => p.life > 0);
    } else if (this.toxLoad || this.puddles.length) { this.toxLoad = 0; this.puddles.length = 0; }
    if (D.noFatigue) this.fatigue = 0;
    // Collapse: fatigue reaching the limit during a storm or its afterburn kills you
    if (st.phase && st.phase !== 'windup' && this.fatigue >= S.collapse) {
      if (D.noDeath) { this.nearLoss('collapse', `Organ failure: fatigue hit ${S.collapse} during a storm`); this.fatigue = S.collapse - 0.01; }
      else { this.fatigue = Math.min(100, this.fatigue); this.finish(false, `Cytokine storm: organ failure. Fatigue hit ${S.collapse} during the storm.`, 'collapse'); return; }
    }
    this.fatigue = Math.max(0, Math.min(100, this.fatigue));
    this.fatiguePeak = Math.max(this.fatiguePeak, this.fatigue);
    const tier = this.fatigueTier();
    if (tier !== this.tier) { this.fx.push({ k: 'tier', tier, up: tier > this.tier }); this.tier = tier; }
    this.tierTime[tier] += dt;
    const slow = tier >= 1 ? F.tiredSpeed : 1;
    this.ringR = C.support.ring * (tier >= 3 ? F.exhaustedRing : 1);

    // ---- toxin bursts ----
    for (const tx of this.toxins) {
      if (tx.state === 'coming' && t >= tx.at) { tx.state = 'sweeping'; tx.front = 0; this.fx.push({ k: 'burst', u: WOUND.u, v: WOUND.v }); this.addToxin(null, 'burst'); }
      if (tx.state === 'sweeping') {
        tx.front += dt / C.toxin.sweep;
        const reach = tx.front * 340;
        const hit = c => !c.dead && c.u < ZONE && Math.hypot(c.u - WOUND.u, c.v - WOUND.v) < reach;
        if (!D.immortal) {
          for (const c of this.neut) if (hit(c)) { this.stats.toxinDeaths++; this.loseCell(c, 'toxin', 'neut'); }
          for (const c of this.mac) if (hit(c)) { this.stats.toxinDeaths++; this.loseCell(c, 'toxin', 'mac'); }
          for (const c of this.runners) if (hit(c)) { this.stats.toxinDeaths++; this.loseCell(c, 'toxin', 'net'); }
          for (const c of this.nk) if (hit(c)) { this.stats.toxinDeaths++; this.loseCell(c, 'toxin', 'nk'); }
        }
        if (tx.front >= 1) tx.state = 'done';
      }
    }
    const warnTx = this.toxins.find(tx => tx.state === 'coming' && t >= tx.at - C.toxin.warn);
    this.warning = warnTx ? (warnTx.at - t) : 0;

    // ---- marrow ----
    const make = this.marrow.make;
    const every = { neut: C.marrow.neutEvery, mac: C.marrow.macEvery, net: C.marrow.netEvery, nk: C.marrow.nkEvery }[make];
    if (D.marrowOn && this.cellCount() < this.cellCap()) {
      this.marrow.prog += dt / every * mul * (tier >= 3 ? F.exhaustedMarrow : 1);
      if (this.marrow.prog >= 1) { this.marrow.prog = 0; this.stats.made++; this.spawnFriendly(make); }
    } else this.marrow.prog = Math.min(1, this.marrow.prog);

    // ---- domes: shelter what's under them ----
    for (const d of this.domes) {
      const grow = d.r < C.pseudo.domeR ? C.pseudo.domeGrow : C.pseudo.domeSpread;
      d.r = Math.min(C.pseudo.domeMax, d.r + grow * dt);
    }
    for (const b of this.bact) b.shield = !b.dead && !b.eaten && b.kind !== 'worm' && !!this.domeAt(b.u, b.v);

    this.stepMacrophages(dt, slow);
    this.stepNeutrophils(dt, slow, tier);
    this.stepRunners(dt, slow);
    this.stepNK(dt, slow);
    this.stepShots(dt);
    this.stepEnemies(dt);

    // ---- cleanup ----
    if (this.neut.some(n => n.dead)) this.neut = this.neut.filter(n => !n.dead);
    if (this.mac.some(m => m.dead)) this.mac = this.mac.filter(m => !m.dead);
    if (this.runners.some(m => m.dead)) this.runners = this.runners.filter(m => !m.dead);
    if (this.nk.some(m => m.dead)) this.nk = this.nk.filter(m => !m.dead);
    if (this.bact.some(b => b.dead)) this.bact = this.bact.filter(b => !b.dead);
    if (this.shots.some(s => s.life <= 0)) this.shots = this.shots.filter(s => s.life > 0);
    if (this.webs.some(w => w.life <= 0)) this.webs = this.webs.filter(w => w.life > 0);
    if (this.domes.some(d => d.hp <= 0)) {
      for (const d of this.domes) if (d.hp <= 0) for (const b of this.bact) if (b.settled === d) { b.settled = false; b.life = 0; }
      this.domes = this.domes.filter(d => d.hp > 0);
    }

    // ---- zone counts, lymph node timer ----
    const zc = [0, 0, 0];
    for (const b of this.bact) if (!b.eaten) zc[zoneOf(b.u)]++;
    for (let z = 0; z < 3; z++) this.zones[z].count = zc[z];
    const total = zc[0] + zc[1] + zc[2];
    this.stats.peak = Math.max(this.stats.peak, total);
    if (zc[2] > 0) {
      if (!this.lymph.reached) { this.lymph.reached = true; this.fx.push({ k: 'breach' }); }
      this.lymph.timer = Math.min(1, this.lymph.timer + dt / C.lymph.fill);
      this.lymph.peak = Math.max(this.lymph.peak, this.lymph.timer);
    }
    this.histT -= dt;
    if (this.histT <= 0) { this.histT = 2; this.history.push({ t, z: zc.slice(), n: this.neut.length, m: this.mac.length, timer: this.lymph.timer, fatigue: this.fatigue, output: this.output, tox: this.toxLoad }); if (this.history.length > 900) this.history.splice(0, 300); }

    if (this.lymph.timer >= 1) {
      if (D.noDeath) { this.nearLoss('lymph', 'The Lymph node timer filled'); this.lymph.timer = 0; }
      else this.finish(false, `Enemies sat in the Lymph node for ${C.lymph.fill} s and took hold.`, 'lymph');
    } else if (D.script && t >= C.level.duration && total === 0) this.finish(true, 'The bar is full and every enemy is gone.');
  }

  nearLoss(kind, text) {
    this.stats.nearLosses.push({ t: this.t, kind, text });
    this.fx.push({ k: 'nearLoss', text });
  }

  // The storm lands: decimate enemies, hurt your own cells, stun macrophages
  stormHit() {
    const S = CONFIG.storm, r = this.rand, D = this.dev;
    for (const b of this.bact) {
      if (b.dead || b.eaten || b.kind === 'spore' || b.shield) continue;
      if (b.kind === 'worm') { b.hp -= b.maxHp * S.worm; b.flash = 0.3; if (b.hp <= 0) this.kill(b, 'storm'); continue; }
      if (r() < S.kill) this.kill(b, 'storm');
    }
    if (!D.immortal) {
      for (const n of this.neut) if (r() < S.friendly) this.loseCell(n, 'storm', 'neut');
      for (const n of this.runners) if (r() < S.friendly) this.loseCell(n, 'storm', 'net');
      for (const n of this.nk) if (r() < S.friendly) this.loseCell(n, 'storm', 'nk');
      for (const m of this.mac) if (m.infected && r() < S.friendly) this.loseCell(m, 'storm', 'mac');
    }
    for (const m of this.mac) { if (m.dead) continue; m.stun = S.stun; if (m.prey) { m.prey.eaten = false; m.prey = null; } m.gulp = 0; m.dome = null; }
    if (!D.noFatigue) this.fatigue += S.cost;
    this.fx.push({ k: 'stormHit' });
  }

  stepMacrophages(dt, slow) {
    const C = CONFIG;
    for (const m of this.mac) {
      if (m.dead) continue;
      // TB-infected: rooted, spits out new TB until it dies or is shot down
      if (m.infected) {
        const inf = m.infected;
        inf.age += dt; inf.spit -= dt;
        if (inf.spit <= 0) { inf.spit = C.tb.spitEvery; this.spawnEnemy('tb', m.u + (this.rand() - 0.5) * 16, m.v + (this.rand() - 0.5) * 16); this.fx.push({ k: 'spit', u: m.u, v: m.v }); }
        if (inf.age >= C.tb.infectedLife) this.loseCell(m, 'tb', 'mac');
        continue;
      }
      const mode = this.zones[zoneOf(m.u)].mode;
      if (mode !== m.mode) { m.mode = mode; m.flip = 0.4; if (mode === 'support' && (m.prey || m.dome)) { if (m.prey) m.prey.eaten = false; m.prey = null; m.dome = null; m.gulp = 0; } }
      m.flip = Math.max(0, m.flip - dt);
      m.cd = Math.max(0, m.cd - dt);
      if (m.stun > 0) { m.stun -= dt; continue; }
      let tu = m.pu, tv = m.pv, sp = C.macrophage.speed * slow * (this.puddles.length ? this.puddleMul(m.u, m.v) : 1);
      if (m.gulp > 0) {
        m.gulp -= dt; sp = 0;
        if (m.prey) { m.prey.u += (m.u - m.prey.u) * Math.min(1, dt * 8); m.prey.v += (m.v - m.prey.v) * Math.min(1, dt * 8); }
        if (m.gulp <= 0) {
          m.cd = C.macrophage.eatEvery;
          if (m.dome) {
            const d = m.dome; d.hp--; d.r *= 0.85; m.dome = null;
            this.fx.push({ k: d.hp <= 0 ? 'domePop' : 'domeChew', u: d.u, v: d.v, r: d.r });
          } else if (m.prey) {
            const b = m.prey, how = KINDS[b.kind].swallow;
            m.prey = null;
            if (how === 'spit') {
              b.eaten = false; b.spitT = C.mrsa.spitIgnore;
              const a = this.rand() * 6.283; b.u += Math.cos(a) * 16; b.v = Math.max(VESSEL + 8, Math.min(WIDTH - 8, b.v + Math.sin(a) * 16));
              this.fx.push({ k: 'spit', u: b.u, v: b.v });
            } else if (how === 'infect') {
              this.kill(b, 'swallow', true);
              m.infected = { hp: C.tb.infectedHp, age: 0, spit: C.tb.spitEvery };
              this.fx.push({ k: 'infect', u: m.u, v: m.v });
            } else this.kill(b, 'swallow', true);
          }
        }
      } else if (m.mode === 'offense' && m.cd <= 0) {
        const lo = m.home * ZONE - 10, hi = (m.home + 1) * ZONE + 10;
        // Domes first: they're the one thing only macrophages can break
        let dome = null, dd = Infinity;
        for (const d of this.domes) if (d.u >= lo && d.u < hi) { const q = Math.hypot(d.u - m.u, d.v - m.v) - d.r; if (q < dd) { dd = q; dome = d; } }
        if (dome) {
          tu = dome.u; tv = dome.v;
          if (dd < C.macrophage.reach) { m.dome = dome; m.gulp = C.macrophage.gulp; this.fx.push({ k: 'gulp', id: m.id, u: m.u, v: m.v }); sp = 0; }
        } else {
          const b = this.nearestBact(m.u, m.v, 400, b => b.u >= lo && b.u < hi && KINDS[b.kind].swallow !== 'no' && b.spitT <= 0);
          if (b) {
            tu = b.u; tv = b.v;
            if (Math.hypot(b.u - m.u, b.v - m.v) < C.macrophage.reach) { m.prey = b; b.eaten = true; m.gulp = C.macrophage.gulp; this.fx.push({ k: 'gulp', id: m.id, u: m.u, v: m.v }); sp = 0; }
          }
        }
      }
      const du = tu - m.u, dv = tv - m.v, d = Math.hypot(du, dv);
      if (d > 1 && sp > 0) { const s = Math.min(d, sp * dt); m.u += du / d * s; m.v += dv / d * s; }
    }
  }

  stepNeutrophils(dt, slow, tier) {
    const C = CONFIG, F = C.fatigue, r = this.rand, D = this.dev;
    for (const n of this.neut) {
      if (n.dead) continue;
      n.age += dt;
      if (!D.immortal && n.age >= C.neutrophil.life * (tier >= 2 ? F.feverLife : 1)) { this.loseCell(n, 'age', 'neut'); continue; }
      if (n.infected > 0) { n.infected -= dt; if (n.infected <= 0) { n.dead = true; this.stats.lost.herpes++; this.herpesBurst(n); continue; } }
      n.boosted = this.inRing(n.u, n.v);
      n.turn -= dt;
      if (n.turn <= 0) {
        n.turn = C.neutrophil.turnEvery * (0.6 + r() * 0.8);
        const target = this.nearestTarget(n.u, n.v, 2000);
        let want;
        if (target) {
          const d = Math.hypot(target.u - n.u, target.v - n.v);
          want = Math.atan2(target.v - n.v, target.u - n.u);
          if (d < C.neutrophil.standoff) want += Math.PI / 2 * (r() < 0.5 ? 1 : -1);
        } else want = Math.atan2(WIDTH * 0.55 - n.v, L * 0.45 - n.u) + (r() - 0.5) * 2;
        n.head = r() < C.neutrophil.stray ? r() * 6.283 : want + C.neutrophil.zigzag * (r() * 2 - 1);
      }
      const sp = C.neutrophil.speed * slow * (n.boosted ? C.support.speedMul : 1) * (this.puddles.length ? this.puddleMul(n.u, n.v) : 1);
      n.vu += (Math.cos(n.head) * sp - n.vu) * Math.min(1, dt * 6);
      n.vv += (Math.sin(n.head) * sp - n.vv) * Math.min(1, dt * 6);
      n.u = Math.max(8, Math.min(L - 8, n.u + n.vu * dt));
      n.v = Math.max(VESSEL * 0.3, Math.min(WIDTH - 8, n.v + n.vv * dt));
      if (n.v < VESSEL && n.vv < 0) n.vv *= -0.5;
      n.cd -= dt;
      if (n.cd <= 0) {
        const can = n.boosted ? null : b => !b.armored;
        const aim = this.nearestTarget(n.u, n.v, C.neutrophil.range, can) || this.nearestTarget(n.u, n.v, C.neutrophil.range);
        if (aim) {
          n.cd = C.neutrophil.fireEvery;
          const d = Math.hypot(aim.u - n.u, aim.v - n.v), tt = d / C.neutrophil.shotSpeed;
          const au = aim.u + (aim.kind ? C.bacteria.drift * tt : 0), av = aim.v;
          const a = Math.atan2(av - n.v, au - n.u) + (r() - 0.5) * 2 * (C.neutrophil.spread + (tier >= 2 ? F.feverSpread : 0));
          this.shots.push({ u: n.u, v: n.v, pu: n.u, pv: n.v, du: Math.cos(a), dv: Math.sin(a), life: C.neutrophil.range * 1.4 / C.neutrophil.shotSpeed, tuned: n.boosted, from: n.id });
        } else n.cd = 0.05;
      }
    }
  }

  // Net neutrophils run for the thickest crowd of small enemies, then burst
  stepRunners(dt, slow) {
    const C = CONFIG, r = this.rand, D = this.dev;
    let smalls = null;
    for (const n of this.runners) {
      if (n.dead) continue;
      n.age += dt; n.retarget -= dt;
      if (n.retarget <= 0) {
        n.retarget = 0.8;
        smalls = smalls || this.bact.filter(b => !b.dead && !b.eaten && !b.shield && KINDS[b.kind].small);
        let best = null, bn = 0;
        const R2 = C.net.radius * C.net.radius;
        for (let i = 0; i < Math.min(24, smalls.length); i++) {
          const c = smalls[Math.floor(r() * smalls.length)];
          let k = 0; for (const o of smalls) if ((o.u - c.u) ** 2 + (o.v - c.v) ** 2 < R2) k++;
          k -= Math.hypot(c.u - n.u, c.v - n.v) / 200; // prefer closer crowds a little
          if (k > bn) { bn = k; best = c; }
        }
        if (best) { n.tu = best.u; n.tv = best.v; } else { n.tu = L * 0.4; n.tv = WIDTH * 0.55; }
        n.hasTarget = !!best;
      }
      const du = n.tu - n.u, dv = n.tv - n.v, d = Math.hypot(du, dv);
      const sp = C.net.speed * slow * (this.puddles.length ? this.puddleMul(n.u, n.v) : 1);
      if (d > 1) { const s = Math.min(d, sp * dt); n.u += du / d * s; n.v += dv / d * s; }
      if ((n.hasTarget && d < 8) || (!D.immortal && n.age >= C.net.fuse) || (D.immortal && n.hasTarget && n.age >= C.net.fuse)) {
        n.dead = true;
        this.webs.push({ u: n.u, v: n.v, r: C.net.radius, life: C.net.linger, max: C.net.linger });
        this.netSweep(n.u, n.v, C.net.radius);
        this.fx.push({ k: 'netBurst', u: n.u, v: n.v });
      }
    }
    for (const w of this.webs) { w.life -= dt; this.netSweep(w.u, w.v, w.r * (0.6 + 0.4 * Math.max(0, w.life) / w.max)); }
  }
  netSweep(u, v, rad) {
    const r2 = rad * rad;
    for (const b of this.bact) if (!b.dead && !b.eaten && !b.shield && KINDS[b.kind].small && (b.u - u) ** 2 + (b.v - v) ** 2 < r2) this.kill(b, 'net');
  }

  // NK cells hunt infected neutrophils first, then free virus particles
  stepNK(dt, slow) {
    const C = CONFIG, D = this.dev;
    for (const k of this.nk) {
      if (k.dead) continue;
      k.age += dt; k.cd = Math.max(0, k.cd - dt);
      if (!D.immortal && k.age >= C.nk.life) { this.loseCell(k, 'age', 'nk'); continue; }
      let prey = null, pd = Infinity;
      for (const n of this.neut) if (!n.dead && n.infected > 0) { const d = Math.hypot(n.u - k.u, n.v - k.v); if (d < pd) { pd = d; prey = n; } }
      if (!prey) { const b = this.nearestBact(k.u, k.v, 400, b => KINDS[b.kind].virus && !b.shield); if (b) { prey = b; pd = Math.hypot(b.u - k.u, b.v - k.v); } }
      let tu, tv;
      if (prey) { tu = prey.u; tv = prey.v; }
      else { k.wander += (this.rand() - 0.5) * dt * 2; tu = k.u + Math.cos(k.wander) * 30; tv = k.v + Math.sin(k.wander) * 30; if (k.v < VESSEL + 20) k.wander = Math.PI / 2; }
      const du = tu - k.u, dv = tv - k.v, d = Math.hypot(du, dv), sp = C.nk.speed * slow * (this.puddles.length ? this.puddleMul(k.u, k.v) : 1);
      if (d > 1) { const s = Math.min(d, sp * dt); k.u = Math.max(8, Math.min(L - 8, k.u + du / d * s)); k.v = Math.max(VESSEL * 0.4, Math.min(WIDTH - 8, k.v + dv / d * s)); }
      if (prey && pd < C.nk.reach && k.cd <= 0) {
        k.cd = C.nk.killEvery;
        if (prey.kind) this.kill(prey, 'nk');
        else { prey.dead = true; prey.infected = 0; this.stats.nkKills++; this.stats.byKind.infected = (this.stats.byKind.infected || 0) + 1; this.fx.push({ k: 'nkPop', u: prey.u, v: prey.v }); }
      }
    }
  }

  // Shots: straight tracers; the first thing touched takes the hit. Domes swallow shots.
  stepShots(dt) {
    const C = CONFIG;
    for (const s of this.shots) {
      s.pu = s.u; s.pv = s.v;
      const step = C.neutrophil.shotSpeed * dt;
      s.u += s.du * step; s.v += s.dv * step; s.life -= dt;
      for (const d of this.domes) {
        const inNow = (s.u - d.u) ** 2 + (s.v - d.v) ** 2 < d.r * d.r, inBefore = (s.pu - d.u) ** 2 + (s.pv - d.v) ** 2 < d.r * d.r;
        if (inNow && !inBefore) { s.life = 0; this.fx.push({ k: 'absorb', u: s.u, v: s.v }); break; }
      }
      if (s.life <= 0) continue;
      const hitTest = (x, y, rad) => {
        const wu = x - s.pu, wv = y - s.pv, proj = Math.max(0, Math.min(step, wu * s.du + wv * s.dv));
        const cu = s.pu + s.du * proj, cv = s.pv + s.dv * proj;
        return (x - cu) ** 2 + (y - cv) ** 2 <= rad * rad ? [cu, cv] : null;
      };
      let done = false;
      for (const b of this.bact) {
        if (b.dead || b.eaten || b.shield || b.kind === 'spore') continue;
        const k = KINDS[b.kind], at = hitTest(b.u, b.v, b.kind === 'worm' && b.head ? 12 : k.hit);
        if (!at) continue;
        s.life = 0; done = true;
        if (k.shot === 'boss') {
          b.hp -= s.tuned ? C.tapeworm.tunedDmg : 1; b.flash = 0.12;
          if (b.hp <= 0) this.kill(b, s.tuned ? 'tuned' : 'shot'); else this.fx.push({ k: 'hit', u: at[0], v: at[1] });
        } else if (s.tuned) this.kill(b, 'tuned');
        else if (k.shot === 'armor') { this.stats.bounced++; this.fx.push({ k: 'bounce', u: at[0], v: at[1], du: -s.du, dv: -s.dv }); }
        else {
          b.hp--; b.flash = 0.12;
          if (!b.lead && !b.settled) { b.u += s.du * C.bacteria.knock; b.v += s.dv * C.bacteria.knock; }
          if (b.hp <= 0) this.kill(b, 'shot'); else this.fx.push({ k: 'hit', u: at[0], v: at[1] });
        }
        break;
      }
      if (done) continue;
      for (const m of this.mac) {
        if (m.dead || !m.infected || !hitTest(m.u, m.v, 9)) continue;
        s.life = 0;
        m.infected.hp -= s.tuned ? 3 : 1;
        this.fx.push({ k: 'hit', u: m.u, v: m.v });
        if (m.infected.hp <= 0) this.loseCell(m, 'tb', 'mac');
        break;
      }
    }
  }

  // Enemies: drift with the flow, spill on crowding, divide while there is room, plus each kind's trick
  stepEnemies(dt) {
    const C = CONFIG, r = this.rand, t = this.t, D = this.dev;
    const counts = [0, 0, 0];
    for (const b of this.bact) if (!b.dead && !b.eaten) counts[zoneOf(b.u)]++;
    const live = counts[0] + counts[1] + counts[2];
    // Spatial grid for the neighbour checks
    const grid = new Map();
    for (const b of this.bact) {
      if (b.dead || b.eaten) continue;
      const key = ((b.u / GRID) | 0) * 1000 + ((b.v / GRID) | 0);
      let cell = grid.get(key); if (!cell) grid.set(key, cell = []); cell.push(b);
    }
    const cr = C.bacteria.crowdRadius, cr2 = cr * cr;
    const born = [];
    for (const b of this.bact) {
      if (b.dead || b.eaten) continue;
      b.flash = Math.max(0, b.flash - dt);
      b.spitT = Math.max(0, b.spitT - dt);
      b.life += dt;
      const z = zoneOf(b.u), pool = z === 2 && b.u > POOL_U;
      // Spores: inert, then hatch together
      if (b.kind === 'spore' && t >= b.hatchAt) {
        b.kind = 'clos'; b.hp = b.maxHp = C.spore.hp; b.age = 0; b.div = this.divTime('clos');
        this.fx.push({ k: 'hatch', u: b.u, v: b.v });
      }
      // Chains (Strep, Tapeworm): links follow the one ahead; a dead or eaten lead frees the rest as a new chain
      if (b.lead && (b.lead.dead || b.lead.eaten)) { b.lead = null; b.head = true; }
      if ((b.kind === 'strep' || b.kind === 'worm') && !(b.kind === 'strep' && pool)) {
        const sp = b.kind === 'strep' ? C.strep.spacing : C.tapeworm.spacing;
        if (b.lead) {
          const du = b.lead.u - b.u, dv = b.lead.v - b.v, d = Math.hypot(du, dv);
          if (d > sp) { b.u += du / d * (d - sp); b.v += dv / d * (d - sp); }
          if (d > 0.01) b.rot = Math.atan2(dv, du);
        } else {
          const speed = b.kind === 'strep' ? C.strep.speed : C.tapeworm.speed;
          const stopAt = b.kind === 'worm' ? L - 150 : L;
          const wig = Math.sin(t * (b.kind === 'strep' ? 3 : 1.2) + b.id) * (b.kind === 'strep' ? 26 : 14);
          const toward = ((WIDTH + VESSEL) / 2 - b.v) * 0.15;
          if (b.u < stopAt) b.u += speed * dt;
          b.v += (wig + toward) * dt;
          b.rot = Math.atan2(wig + toward, speed);
        }
        b.u = Math.max(6, Math.min(L - 10, b.u)); b.v = Math.max(VESSEL + 8, Math.min(WIDTH - 8, b.v));
        continue;
      }
      if (b.kind === 'strep' && pool && b.lead) { b.lead = null; b.head = true; }
      // Pseudomonas settles and grows a dome
      if (b.kind === 'pseudo' && !b.settled && b.life >= C.pseudo.settleAfter && z < 2) {
        const d = this.domeAt(b.u, b.v);
        if (d) b.settled = d;
        else { const nd = { id: this.id++, u: b.u, v: b.v, r: 6, hp: C.pseudo.domeHp, maxHp: C.pseudo.domeHp }; this.domes.push(nd); b.settled = nd; this.fx.push({ k: 'dome', u: b.u, v: b.v }); }
      }
      // Flow
      let drift = C.bacteria.drift + C.bacteria.crowdDrift * Math.max(0, counts[z] - C.bacteria.crowdStart);
      if (b.kind === 'flu') drift = C.flu.speed;
      else if (b.kind === 'wormlet') drift = C.tapeworm.smallSpeed;
      else if (b.kind === 'tb') drift *= C.tb.drift;
      else if (b.kind === 'spore') drift *= C.spore.drift;
      else if (b.kind === 'herpes') drift *= 1.2;
      if (b.settled && b.kind === 'pseudo') drift = 0;
      else if (b.shield) drift *= C.pseudo.domeDrift;
      if (pool) drift = (L - 130 - b.u) * 0.3;
      // Flu splits when it reaches the Tissue
      if (b.kind === 'flu' && !b.split && b.u >= ZONE) {
        b.split = true;
        for (let i = 1; i < C.flu.splitInto; i++) born.push(['flu', b.u + (r() - 0.5) * 8, b.v + (r() - 0.5) * 8, { split: true }]);
        this.fx.push({ k: 'split', u: b.u, v: b.v });
      }
      // Neighbours: separation push and the room check
      let near = 0, pu = 0, pv = 0;
      const gu = (b.u / GRID) | 0, gv = (b.v / GRID) | 0;
      for (let a = -1; a <= 1; a++) for (let c = -1; c <= 1; c++) {
        const cell = grid.get((gu + a) * 1000 + gv + c); if (!cell) continue;
        for (const o of cell) {
          if (o === b || o.dead || o.eaten) continue;
          const du = b.u - o.u, dv = b.v - o.v, d2 = du * du + dv * dv;
          if (d2 < cr2) { near++; if (d2 > 0.01) { const d = Math.sqrt(d2); pu += du / d * (1 - d / cr); pv += dv / d * (1 - d / cr); } }
        }
      }
      const jumpy = b.kind === 'flu' || b.kind === 'herpes';
      b.u += (drift + pu * 14) * dt;
      b.v += (pv * (pool ? 30 : 14) + (pool ? ((WIDTH + VESSEL) / 2 - b.v) * 0.12 : 0) + Math.sin(t * (jumpy ? 2.3 : 0.7) + b.id) * (pool ? 8 : jumpy ? 12 : 3)) * dt;
      if (pool) b.u += pu * 16 * dt;
      b.u = Math.max(6, Math.min(L - 10, b.u));
      b.v = Math.max(VESSEL + 8, Math.min(WIDTH - 8, b.v));
      b.rot += dt * 0.3;
      // Herpes: hitch a ride inside a neutrophil
      if (b.kind === 'herpes') {
        for (const n of this.neut) {
          if (n.dead || n.infected > 0 || (n.u - b.u) ** 2 + (n.v - b.v) ** 2 > 64) continue;
          n.infected = C.herpes.burstAfter; b.dead = true; this.fx.push({ k: 'infectN', u: n.u, v: n.v });
          break;
        }
        if (b.dead) continue;
      }
      // Division
      if (!D.noDivision && b.div < Infinity && live + born.length < this.bactCap() && near < C.bacteria.crowdMax) {
        b.age += dt;
        if (b.age >= b.div) {
          b.age = 0; b.div = this.divTime(b.kind);
          const a = r() * 6.283;
          born.push([b.kind, b.u + Math.cos(a) * 5, b.v + Math.sin(a) * 5, b.kind === 'pseudo' && b.settled ? { settled: b.settled } : null]);
          b.u -= Math.cos(a) * 3; b.v -= Math.sin(a) * 3;
          b.hp = b.maxHp;
        }
      }
    }
    for (const nb of born) { if (this.spawnEnemy(nb[0], nb[1], nb[2], nb[3])) this.fx.push({ k: 'divide', u: nb[1], v: nb[2] }); }
  }

  finish(win, reason, why) {
    const st = this.stats;
    const goals = [
      { text: 'Clear every enemy', hit: win },
      { text: 'Lymph node timer never passed half', hit: win && this.lymph.peak <= 0.5 },
      { text: 'No enemy reached the Lymph node', hit: win && !this.lymph.reached },
    ];
    this.result = { win, reason, why: why || null, t: this.t, goals, stars: goals.filter(g => g.hit).length, stats: { ...st }, peakTimer: this.lymph.peak, fatiguePeak: this.fatiguePeak, toxPeak: this.toxPeak, toxPinned: this.toxPinned, tierTime: this.tierTime.slice() };
  }
}

    bacterium: 64 * 5.5 / 9, 'bacterium-hit': 64 * 5.5 / 9, 'bacterium-dividing': 64 * 7 / 12, 'bacterium-complement': 64 * 5.5 / 9,
